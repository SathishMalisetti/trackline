name: Build Trackline Windows installer
on:
  push:
    branches: [main, fix/activitywatch-recovery, build/local-windows-installer, fix/agent-upload-timeouts, feat/upload-window, feat/agent-module-auto-updates, security/family-isolation-and-credentials]
    paths:
      - 'backend-v33/laptop-agent/**'
      - '.github/workflows/build-laptop-agent.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  installer:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend-v33/laptop-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build with the same script used on family laptops
        run: python build_installer.py
      - name: Read installer version
        id: version
        shell: pwsh
        run: |
          $versionLine = Select-String -Path 'TracklineAgentSetup.iss' -Pattern '^#define MyAppVersion "([^"]+)"'
          "version=$($versionLine.Matches[0].Groups[1].Value)" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@v4
        with:
          name: TracklineAgentSetup-${{ steps.version.outputs.version }}
          path: backend-v33/laptop-agent/local-build/package/installer_output/*
          if-no-files-found: error
      - name: Publish agent module to the latest GitHub release
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_tag="$(gh release view --json tagName --jq .tagName)"
          gh release upload "$release_tag" local-build/package/installer_output/TracklineAgentModule.zip --clobber

