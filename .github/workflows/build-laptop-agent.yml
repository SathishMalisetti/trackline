name: Build Trackline Windows installer
on:
  push:
    branches: [main, fix/activitywatch-recovery, build/local-windows-installer, fix/agent-upload-timeouts]
    paths:
      - 'backend-v33/laptop-agent/**'
      - '.github/workflows/build-laptop-agent.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  installer:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend-v33/laptop-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build with the same script used on family laptops
        run: python build_installer.py
      - uses: actions/upload-artifact@v4
        with:
          name: TracklineAgentSetup-1.1.1
          path: backend-v33/laptop-agent/local-build/package/installer_output/*
          if-no-files-found: error
