name: Security regression checks
on:
  pull_request:
    paths: ['api/**', 'app/**', 'admin/**', 'notifications/**', 'security/**', 'tests/security*', 'tests/admin*', '.github/workflows/security-checks.yml']
  push:
    branches: [main, security/family-isolation-and-credentials, feat/platform-admin]
    paths: ['api/**', 'app/**', 'admin/**', 'notifications/**', 'security/**', 'tests/security*', 'tests/admin*', '.github/workflows/security-checks.yml']
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm ci --prefix api
      - run: npm test --prefix api
      - run: node tests/security-isolation.cjs
      - run: node tests/admin-sql.cjs
      - run: node tests/admin-import-sql.cjs
      - run: node tests/security-push-sql.cjs
      - run: npx playwright install --with-deps chromium
      - run: node tests/admin-layout.cjs
      - run: node tests/security-keyboard.cjs
      - run: node tests/security-push-layout.cjs
