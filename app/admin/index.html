<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trackline · Platform administration</title>
<style>
:root{color-scheme:light;--bg:#f5f2e9;--panel:#fffdf8;--text:#203c34;--dim:#65736a;--line:#deded2;--accent:#477c6b;--ink:#203c34;--on:#fffdf8;--amber:#a86b1c;--error:#a73535;--focus:#a86b1c;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--bg:#17251f;--panel:#21332b;--text:#f5f2e9;--dim:#b6c4bb;--line:#425047;--accent:#639e88;--ink:#12251c;--amber:#edb561;--error:#f38d8d}}
:root[data-theme=dark]{color-scheme:dark;--bg:#17251f;--panel:#21332b;--text:#f5f2e9;--dim:#b6c4bb;--line:#425047;--accent:#639e88;--ink:#12251c;--amber:#edb561;--error:#f38d8d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-size:15px;line-height:1.5}button,input,select,textarea{font:inherit}button,a,input,textarea,select{outline-offset:4px}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--focus)}button{min-height:44px;padding:10px 16px;border:1px solid var(--line);border-radius:9px;background:var(--panel);color:var(--text);cursor:pointer;font-weight:650}button:hover{border-color:var(--accent)}button:disabled{opacity:.55;cursor:wait}.primary{background:var(--accent);color:white;border-color:var(--accent)}.danger{color:var(--error)}a{color:var(--accent)}h1,h2,h3{line-height:1.2;margin:0 0 12px}h1{font-size:30px;letter-spacing:-.7px}h2{font-size:21px}h3{font-size:17px}p{margin:0 0 16px}small,.muted{color:var(--dim)}.layout{display:grid;grid-template-columns:235px minmax(0,1fr);min-height:100vh}.sidebar{background:var(--ink);color:var(--on);padding:28px 18px;display:flex;flex-direction:column;gap:25px;position:sticky;top:0;height:100vh}.brand{font-size:28px;font-weight:750;letter-spacing:-1px}.sidebar small{color:#d4e1d8}.sidebar nav{display:grid;gap:7px}.sidebar nav button{text-align:left;background:transparent;color:var(--on);border-color:transparent}.sidebar nav button.active{background:#477c6b;color:white}.sidebar footer{margin-top:auto;display:grid;gap:9px}.sidebar footer button{background:transparent;color:var(--on);border-color:#748e7d}.sidebar a{color:#e1eee6}.main{padding:34px clamp(18px,3vw,46px);max-width:1500px;width:100%;margin:0 auto}.top{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:25px}.top p{color:var(--dim);max-width:70ch}.actions{display:flex;gap:8px;flex-wrap:wrap}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:23px;margin-bottom:20px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px}.metric{font-size:34px;font-weight:750;line-height:1.2}.tag{display:inline-block;font-size:13px;border:1px solid var(--line);border-radius:30px;padding:3px 10px;color:var(--dim);background:var(--bg)}.tag.published,.tag.completed,.tag.validated{color:var(--accent)}.tag.failed{color:var(--error)}.tag.queued,.tag.running{color:var(--amber)}.notice{padding:15px 18px;border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:8px;background:var(--panel);margin-bottom:20px}.notice.warning{border-left-color:var(--amber)}.notice.error{border-left-color:var(--error);color:var(--error)}.list{display:grid;gap:12px}.row{display:flex;justify-content:space-between;align-items:center;gap:16px;border-bottom:1px solid var(--line);padding:15px 0}.row:last-child{border:0}.row h3{margin:0 0 4px}.row p{margin:0;color:var(--dim);font-size:14px}.filters{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px}.filters select{width:auto;min-width:140px}label{display:block;font-weight:600;margin:0 0 7px}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--text);padding:11px 12px;min-height:44px}textarea{min-height:130px;resize:vertical}.field{margin-bottom:17px}.field small{display:block;margin-top:5px}.code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:13px;line-height:1.6;min-height:300px}.empty{padding:30px;text-align:center;color:var(--dim)}.login{max-width:460px;margin:8vh auto;padding:28px}.login .brand{margin-bottom:30px}.login h1{font-size:27px}.login button{width:100%}.login .actions button{width:auto;flex:1}.checkbox{display:flex;gap:10px;align-items:flex-start;font-weight:400}.checkbox input{width:20px;min-height:20px;margin-top:3px}.page-title{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.pagination{display:flex;gap:10px;justify-content:flex-end}.preview{white-space:pre-wrap;overflow-wrap:anywhere}.result-box{max-height:500px;overflow:auto}.kpi-grid .card{margin:0}dialog{border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--text);padding:25px;width:min(460px,calc(100vw - 32px))}dialog::backdrop{background:#11211980}#status:empty{display:none}#status{margin:0 0 20px;padding:14px 18px;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:8px}#status.error{border-left-color:var(--error);color:var(--error)}.busy{color:var(--dim);padding:24px}.note{font-size:14px;color:var(--dim)}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}.skill{border-top:1px solid var(--line);padding-top:20px;margin-top:20px}summary{cursor:pointer;min-height:44px;padding:10px 0;font-weight:600}pre{overflow-wrap:anywhere;white-space:pre-wrap}body.modal-open{overflow:hidden}
:root[data-theme=dark] .primary{color:var(--ink)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .primary{color:var(--ink)}}
.layout>*{min-width:0}.card,.row>div{min-width:0;overflow-wrap:anywhere}
@media(max-width:900px){.layout{grid-template-columns:minmax(0,1fr)}.sidebar{position:static;height:auto;padding:17px;gap:15px}.sidebar nav{display:flex;overflow:auto;gap:6px}.sidebar nav button{white-space:nowrap;flex-shrink:0}.sidebar footer{display:flex;flex-wrap:wrap;align-items:center;margin-top:0}.sidebar footer small{flex:1;min-width:100px}.sidebar footer a{display:none}.main{padding:24px 17px}.two{grid-template-columns:1fr}.grid{grid-template-columns:1fr 1fr}.top{flex-direction:column}.row{flex-wrap:wrap}.row .actions{width:100%}.row .actions button{flex:1}.login{margin:4vh auto}.metric{font-size:28px}}
@media(max-width:520px){.grid{grid-template-columns:1fr}.card{padding:18px}.filters select{flex:1}.actions button{flex:1}.main h1{font-size:26px}}
@media(max-width:520px){.actions button,.row .actions button{flex:1 1 140px;overflow-wrap:normal}.top .actions{width:100%}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style></head><body><div id="root"><main class="login"><div class="brand">Trackline</div><p role="status">Checking administrator access…</p></main></div>
<dialog id="verify-dialog"><form id="verify-form"><h2>Verify your password</h2><p class="muted">Publishing and administrator changes need recent password verification.</p><div class="field"><label for="verify-password">Current password</label><input id="verify-password" type="password" autocomplete="current-password" required maxlength="128"></div><p id="verify-error" role="alert" class="danger"></p><div class="actions"><button type="button" data-action="verify-cancel">Cancel</button><button class="primary" type="submit">Verify</button></div></form></dialog>
<script>
'use strict';
const $=id=>document.getElementById(id);
const escape=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tag=status=>`<span class="tag ${['draft','validated','published','archived','queued','running','completed','failed','cancelled'].includes(status)?status:''}">${escape(status)}</span>`;
const date=value=>value?new Date(value).toLocaleString():'—';
const S={admin:null,signedIn:false,unlocked:false,page:'overview',offset:0,units:[],versions:[],jobs:[],selectedUnit:null,version:null,subject:'',year:'',pending:false,poll:null};
let reauthResolve=null;
function announce(message,error=false){const node=$('status')||$('gate-status');if(node){node.className=error?'error':'';node.textContent=message;}}
async function api(path,options={}){
 const r=await fetch(path,{credentials:'same-origin',cache:'no-store',...options,headers:{'Content-Type':'application/json',...options.headers}});
 const raw=await r.text();let result;try{result=JSON.parse(raw);}catch{throw new Error(r.status===404?'The administrator API is unavailable (HTTP 404). Check that the latest deployment completed.':'The server returned an unexpected response (HTTP '+r.status+'). Please retry.');}
 if(!r.ok){const e=new Error(result.error||'Request failed.');e.status=r.status;if(r.status===401&&path!=='/api/platform-session'){S.signedIn=false;S.unlocked=false;gate();}else if(r.status===423){S.unlocked=false;gate();}throw e;}
 return result;
}
const post=(body)=>api('/api/platform-manage',{method:'POST',body:JSON.stringify(body)});
const sessionPost=body=>api('/api/platform-session',{method:'POST',body:JSON.stringify(body)});
async function securePost(body){try{return await post(body);}catch(e){if(e.status!==428)throw e;if(await verify())return post(body);throw Error('Action cancelled.');}}
function verify(){return new Promise(resolve=>{reauthResolve=resolve;$('verify-error').textContent='';$('verify-password').value='';$('verify-dialog').showModal();$('verify-password').focus();});}
function stopPoll(){if(S.poll){clearInterval(S.poll);S.poll=null;}}
function gate(){stopPoll();$('root').innerHTML=`<main class="login"><div class="brand">Trackline</div><section class="card"><span class="tag">Platform administration</span><h1 style="margin-top:20px">${S.signedIn?'Unlock administration':'Administrator sign in'}</h1><p class="muted">${S.signedIn?'Welcome back, '+escape(S.admin?.username)+'. Enter your PIN.':'Separate access for platform and curriculum management.'}</p><form id="gate-form">${S.signedIn?'<div class="field"><label for="pin">Administrator PIN</label><input id="pin" type="password" inputmode="numeric" pattern="[0-9]{4}" minlength="4" maxlength="4" autocomplete="off" required></div>':'<div class="field"><label for="username">Username</label><input id="username" autocomplete="username" pattern="[A-Za-z][A-Za-z0-9_-]{2,31}" required maxlength="32"></div><div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required maxlength="128"></div>'}<p id="gate-status" role="alert"></p><button class="primary" type="submit">${S.signedIn?'Unlock':'Continue'}</button></form>${S.signedIn?'<button style="margin-top:12px" data-action="signout">Use another administrator</button>':''}</section><p class="note">Administrator accounts are provisioned by the platform owner. Family accounts and PINs do not grant access here.</p><a href="/">Return to family app</a></main>`;$(S.signedIn?'pin':'username')?.focus();}
function shell(){stopPoll();$('root').innerHTML=`<div class="layout"><aside class="sidebar"><div><div class="brand">Trackline</div><small>Platform administration</small></div><nav aria-label="Admin navigation">${[['overview','Overview'],['curriculum','Curriculum'],['sources','VCAA imports'],['jobs','Generation jobs'],['families','Family support'],['admins','Administrators'],['audit','Audit history'],['settings','My account']].map(([key,label])=>`<button data-page="${key}" class="${key===S.page?'active':''}" ${key===S.page?'aria-current="page"':''}>${label}</button>`).join('')}</nav><footer><small>Signed in as<br><strong>${escape(S.admin?.username)}</strong></small><button data-action="theme">Switch theme</button><button data-action="lock">Lock admin</button><button data-action="signout">Sign out</button><a href="/">Family app</a></footer></aside><main class="main"><div id="status" role="status" aria-live="polite"></div><div id="content"><p class="busy" role="status">Loading…</p></div></main></div>`;}
function title(name,description,actions=''){return `<header class="top"><div><h1>${name}</h1><p>${description}</p></div><div class="actions">${actions}<button data-action="refresh">Refresh</button></div></header>`;}
function empty(text){return `<div class="empty">${text}</div>`;}
function pagination(size){return `<div class="pagination"><button data-action="prev" ${S.offset===0?'disabled':''}>Previous</button><button data-action="next" ${size<(S.page==='families'?25:50)?'disabled':''}>Next</button></div>`;}
async function navigate(page=S.page){S.page=page;S.offset=0;shell();await load();}
async function load(){if(!S.unlocked)return;try{
 const c=$('content');if(S.page==='overview'){
  const d=await api('/api/platform-manage?kind=overview');
  c.innerHTML=title('Platform overview','Prepare, review and publish shared learning material. Family learning remains separate.')+(!d.generationConfigured?'<div class="notice warning"><strong>AI generation needs setup.</strong><br>Configure the server AI key before generating lessons. Official VCAA imports work without an AI key. Configure the key when you want to generate original lessons.</div>':'')+(!d.workerConfigured?'<div class="notice warning">Background processing needs the worker secret and GitHub schedule. Use Process now on VCAA imports or Generation jobs while setting this up.</div>':'')+`<div class="grid kpi-grid">${[[d.units.filter(u=>!u.archived).length,'Curriculum units'],[d.versions.filter(v=>v.status==='draft'||v.status==='validated').length,'Drafts to review'],[d.versions.filter(v=>v.status==='published').length,'Published versions']].map(([n,label])=>`<section class="card"><div class="metric">${n}</div><p>${label}</p></section>`).join('')}</div><section class="card" style="margin-top:20px"><h2>Curriculum coverage</h2><p class="muted">Years 4 and 7 · Mathematics, English and Science</p><div class="two">${[4,7].map(y=>`<div><h3>Year ${y}</h3>${['Mathematics','English','Science'].map(sub=>`<div class="row"><span>${sub}</span><strong>${d.units.filter(u=>!u.archived&&u.year_level===y&&u.subject===sub).length} units</strong></div>`).join('')}</div>`).join('')}</div></section><section class="card"><h2>Preparation workflow</h2><p>Import official VCAA references → Generate or import drafts → Check structure → Review accuracy → Publish</p><div class="notice">VCAA imports preserve official descriptors and download provenance. Publishing lessons here does not replace existing child study plans.</div><div class="actions"><button class="primary" data-page="sources">Import from VCAA</button><button data-page="curriculum">Open curriculum</button></div></section><section class="card"><h2>Recent generation</h2>${d.jobs.length?d.jobs.map(j=>`<div class="row"><span>${escape(date(j.created_at))}</span>${tag(j.status)}</div>`).join(''):empty('No generation jobs yet.')}</section>`;
 }else if(S.page==='curriculum'){
  S.units=await api('/api/platform-manage?kind=units&offset='+S.offset+'&year='+encodeURIComponent(S.year)+'&subject='+encodeURIComponent(S.subject));renderCurriculum();
 }else if(S.page==='sources'){
  S.imports=await api('/api/platform-manage?kind=source-imports&offset='+S.offset);renderSources();if(!S.imports.some(j=>['queued','running'].includes(j.status)))stopPoll();else if(!S.poll)S.poll=setInterval(()=>{if(!S.pending&&S.unlocked&&S.page==='sources'&&!document.activeElement?.closest('#source-import-form')&&!$('source-items-panel')?.hasChildNodes()&&!$('content')?.querySelector('details[open]'))load().catch(()=>{});},10000);
 }else if(S.page==='jobs'){
  S.jobs=await api('/api/platform-manage?kind=jobs&offset='+S.offset);renderJobs();if(!S.poll)S.poll=setInterval(()=>{if(!S.pending&&S.unlocked&&S.page==='jobs')load().catch(()=>{});},10000);
 }else if(S.page==='families'){
  const search=S.familySearch||'',data=await api('/api/platform-manage?kind=families&offset='+S.offset+'&search='+encodeURIComponent(search));
  c.innerHTML=title('Family support','Read-only account summaries. Opening detailed family information is recorded in the audit history.')+`<form id="family-search" class="filters"><label class="sr-only" for="family-search-input">Search family name</label><input id="family-search-input" placeholder="Search family name" value="${escape(search)}" style="max-width:320px"><button>Search</button></form><section class="card">${data.length?data.map(f=>`<div class="row"><div><h3>${escape(f.name||'Unnamed family')}</h3><p>${escape(f.id)} · Updated ${escape(date(f.updated_at))}</p></div><button data-action="family-open" data-id="${escape(f.id)}">View details · audited</button></div>`).join(''):empty('No families found.')}</section><div id="family-details"></div>`+pagination(data.length);
 }else if(S.page==='admins'){
  const data=await api('/api/platform-manage?kind=admins');
  c.innerHTML=title('Administrators','Independent platform accounts. Password verification is required to add or change administrators.')+`<section class="card">${data.length?data.map(a=>`<div class="row"><div><h3>${escape(a.username)} ${a.id===S.admin.id?'<span class="tag">You</span>':''}</h3><p>${a.enabled?'Active':'Disabled'} · Created ${escape(date(a.created_at))}</p></div>${a.id!==S.admin.id?`<div class="actions"><button data-action="admin-toggle" data-id="${a.id}" data-enabled="${!a.enabled}">${a.enabled?'Disable':'Enable'}</button><button data-action="admin-reset" data-id="${a.id}" data-name="${escape(a.username)}">Reset credentials</button></div>`:''}</div>`).join(''):empty('No administrator accounts found.')}</section><section class="card"><h2>Add administrator</h2><p class="note">Share initial credentials yourself through your chosen secure channel. Trackline does not send invitations yet.</p><form id="admin-create"><div class="two"><div class="field"><label for="new-admin-user">Username</label><input id="new-admin-user" name="username" pattern="[A-Za-z][A-Za-z0-9_-]{2,31}" maxlength="32" required autocomplete="off"></div><div class="field"><label for="new-admin-password">Initial password</label><input id="new-admin-password" name="password" type="password" minlength="12" maxlength="128" required autocomplete="new-password"></div></div><div class="field"><label for="new-admin-pin">Initial 4-digit PIN</label><input id="new-admin-pin" name="pin" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" required autocomplete="off"></div><button class="primary">Create administrator</button></form></section><div id="account-reset"></div>`;
 }else if(S.page==='audit'){
  const data=await api('/api/platform-manage?kind=audit&offset='+S.offset);
  c.innerHTML=title('Audit history','Administrator sign-ins, detailed family access, account changes and content operations.')+`<section class="card">${data.length?data.map(a=>`<div class="row"><div><h3>${escape(a.action)}</h3><p>${escape(date(a.created_at))} · Admin ${escape(a.admin_id||'unknown')}</p><p>Target: ${escape(a.target_id||'—')}</p><small>${escape(JSON.stringify(a.details))}</small></div></div>`).join(''):empty('No audit entries yet.')}</section>`+pagination(data.length);
 }else if(S.page==='settings'){
  c.innerHTML=title('My account','Change your administrator password or PIN. Changing credentials signs out all devices.')+`<section class="card"><h2>${escape(S.admin.username)}</h2><form id="account-change"><div class="field"><label for="change-password">New password</label><input id="change-password" name="password" type="password" minlength="12" maxlength="128" autocomplete="new-password"><small>Leave blank to keep the current password.</small></div><div class="field"><label for="change-pin">New 4-digit PIN</label><input id="change-pin" name="pin" type="password" pattern="[0-9]{4}" maxlength="4" inputmode="numeric" autocomplete="off"><small>Leave blank to keep the current PIN.</small></div><button class="primary">Save credentials</button></form></section>`;
 }
 }catch(e){announce(e.message,true);if($('content')?.querySelector('.busy'))$('content').innerHTML='<section class="card"><h2>Could not load this page</h2><p>Check the setup and retry.</p><button data-action="refresh">Try again</button></section>';}}
function renderCurriculum(){const units=S.units.filter(u=>(!S.subject||u.subject===S.subject)&&(!S.year||String(u.year_level)===S.year));$('content').innerHTML=title('Curriculum library','Import official VCAA descriptors, inspect their sources and prepare reusable learning content.','<button class="primary" data-page="sources">Import from VCAA</button><button data-action="unit-new">Add manually</button><button data-action="import-show">Import JSON</button>')+`<div class="filters"><select id="year-filter" aria-label="Year level"><option value="">All year levels</option>${[4,7].map(y=>`<option ${S.year===String(y)?'selected':''}>${y}</option>`).join('')}</select><select id="subject-filter" aria-label="Subject"><option value="">All subjects</option>${['Mathematics','English','Science'].map(v=>`<option ${S.subject===v?'selected':''}>${v}</option>`).join('')}</select></div><div id="unit-editor"></div><section class="card">${units.length?units.map(u=>`<div class="row"><div><h3>${escape(u.title)} ${u.archived?tag('archived'):''}</h3><p>Year ${u.year_level} · ${escape(u.subject)} · ${escape(u.descriptor_code)}${u.source_import_id?' · VCAA import':''}${u.supersedes_unit_id?' · Updated source':''}${u.source_current===false?' · Historical reference':''}</p><small>${escape(u.curriculum_version)}</small></div><div class="actions"><button data-action="unit-open" data-id="${u.id}">Content & versions</button><button data-action="unit-edit" data-id="${u.id}" ${u.source_import_id?'disabled title="Imported official references are immutable"':''}>Edit reference</button><button data-action="unit-archive" data-id="${u.id}" data-archived="${!u.archived}">${u.archived?'Restore':'Archive'}</button></div></div>`).join(''):empty('No matching units. Add a curriculum reference or import a reviewed reference file.')}</section><div id="versions-panel"></div>`+pagination(S.units.length);}
function unitEditor(unit={}){$('unit-editor').innerHTML=`<section class="card"><h2>${unit.id?'Edit reference':'Add curriculum unit'}</h2><p class="note">Paste the actual curriculum descriptor. The source URL is a reference only; this phase does not fetch or extract it.</p><form id="unit-form"><input type="hidden" name="id" value="${escape(unit.id||'')}"><div class="two"><div class="field"><label for="unit-title">Unit title</label><input id="unit-title" name="title" maxlength="150" required value="${escape(unit.title||'')}"></div><div class="field"><label for="unit-code">Official descriptor code</label><input id="unit-code" name="descriptor_code" maxlength="80" required value="${escape(unit.descriptor_code||'')}"></div></div><div class="two"><div class="field"><label for="unit-year">Year level</label><select id="unit-year" name="year_level">${[4,7].map(y=>`<option ${unit.year_level===y?'selected':''}>${y}</option>`).join('')}</select></div><div class="field"><label for="unit-subject">Subject</label><select id="unit-subject" name="subject">${['Mathematics','English','Science'].map(v=>`<option ${unit.subject===v?'selected':''}>${v}</option>`).join('')}</select></div></div><div class="field"><label for="unit-version">Curriculum version</label><input id="unit-version" name="curriculum_version" maxlength="100" required value="${escape(unit.curriculum_version||'Victorian Curriculum F-10 Version 2.0')}"></div><div class="field"><label for="unit-source">Official VCAA URL</label><input id="unit-source" name="source_url" type="url" required value="${escape(unit.source_url||'https://f10.vcaa.vic.edu.au/')}"></div><div class="field"><label for="unit-descriptor">Official descriptor text</label><textarea id="unit-descriptor" name="descriptor_text" minlength="10" maxlength="10000" required>${escape(unit.descriptor_text||'')}</textarea></div><div class="actions"><button class="primary">Save reference</button><button type="button" data-action="editor-close">Cancel</button></div></form></section>`;$('unit-title').focus();}
async function openUnit(id){S.selectedUnit=S.units.find(u=>u.id===id);S.versions=await api('/api/platform-manage?kind=versions&unitId='+id);const u=S.selectedUnit;let source=null;if(u.source_import_id)source=(await api('/api/platform-manage?kind=source-imports&id='+u.source_import_id))[0];$('versions-panel').innerHTML=referencePanel(u,source)+`<section class="card"><h2>${escape(u.title)} · Content versions</h2><p class="note">Published versions are immutable. Generate a new version to make changes.</p><div class="actions"><button class="primary" data-action="queue" data-id="${id}" ${u.archived||u.source_current===false?'disabled':''}>Generate draft</button><button data-action="draft-import" data-id="${id}" ${u.archived?'disabled':''}>Import lesson JSON</button></div><div id="draft-import-panel"></div>${S.versions.length?S.versions.map(v=>`<div class="row"><div><h3>Version ${v.version} ${tag(v.status)}</h3><p>${escape(date(v.created_at))}</p></div><button data-action="version-open" data-id="${v.id}">Review content</button></div>`).join(''):empty('No content yet. Generate a draft or import reviewed lesson content.')}</section><div id="version-detail"></div>`;$('versions-panel').scrollIntoView({block:'start'});}
function preview(content){return(content.skills||[]).map(s=>`<section class="skill"><h3>${escape(s.title)}</h3><p class="note">Prerequisites: ${escape((s.prerequisites||[]).join(', ')||'None specified')}</p><div class="preview">${escape(s.lesson)}</div><h3 style="margin-top:18px">Worked examples</h3>${(s.worked_examples||[]).map(v=>`<p class="preview">${escape(v)}</p>`).join('')}<details><summary>${(s.questions||[]).length} questions and answers</summary>${(s.questions||[]).map((q,i)=>`<div class="card"><strong>${i+1}. ${escape(q.question)}</strong><p>${escape((q.options||[]).join(' / '))}</p><p>Answer: ${escape(q.answer)}</p><p>${escape(q.explanation)}</p><small>${escape(q.purpose)} · ${escape(q.difficulty)}</small></div>`).join('')}</details>${s.writing_rubric?.length?`<details><summary>Writing rubric</summary>${s.writing_rubric.map(r=>`<p><strong>${escape(r.criterion)} · ${r.weight}%</strong><br>${escape(r.description)}</p>`).join('')}</details>`:''}</section>`).join('');}
function openVersion(id){const v=S.versions.find(v=>v.id===id);S.version=v;const editable=['draft','validated'].includes(v.status);$('version-detail').innerHTML=`<section class="card"><h2>Version ${v.version} ${tag(v.status)}</h2><div class="notice">Structural checks do not prove educational accuracy. Review curriculum fit, examples, answer keys and age suitability before publishing.</div>${preview(v.content)}${editable?`<details><summary>Edit lesson JSON</summary><form id="version-form"><div class="field"><label for="version-json">Content JSON</label><textarea id="version-json" class="code" required></textarea></div><div class="field"><label for="review-notes">Review notes</label><textarea id="review-notes" maxlength="2000">${escape(v.review_notes)}</textarea></div><button class="primary">Save draft changes</button></form></details><div class="actions" style="margin-top:20px"><button data-action="validate" data-id="${v.id}">Check structure</button></div><label class="checkbox" style="margin-top:20px"><input id="review-confirmed" type="checkbox">I reviewed the curriculum fit, lesson accuracy, examples and answers.</label><div class="actions"><button class="primary" data-action="publish" data-id="${v.id}" ${v.status!=='validated'?'disabled':''}>Publish version</button><button data-action="version-archive" data-id="${v.id}">Archive draft</button></div>`:`<p class="note">This version cannot be edited. Generate a new draft to revise content.</p>${v.status==='published'?`<button class="danger" data-action="version-archive" data-id="${v.id}">Retire published version</button>`:''}`}</section>`;if(editable)$('version-json').value=JSON.stringify(v.content,null,2);$('version-detail').scrollIntoView({block:'start'});}
function renderJobs(){$('content').innerHTML=title('Generation jobs','Jobs and results are saved in the database. Automatic processing needs the scheduled worker; you can also process a queued job here.')+`<section class="card">${S.jobs.length?S.jobs.map(j=>`<div class="row"><div><h3>${escape(j.unit?.title||'Curriculum unit')} ${tag(j.status)}</h3><p>${escape(date(j.created_at))} · ${j.attempts} processing attempt${j.attempts===1?'':'s'}</p>${j.error?`<p class="danger">${escape(j.error)}</p>`:''}</div><div class="actions">${(j.status==='queued'||(j.status==='running'&&Date.parse(j.lease_until)<Date.now()))?`<button class="primary" data-action="job-run" data-id="${j.id}">Process now</button>`:''}${j.status==='failed'?`<button data-action="job-retry" data-id="${j.id}">Retry</button>`:''}${['queued','running'].includes(j.status)?`<button data-action="job-cancel" data-id="${j.id}">Cancel</button>`:''}${j.status==='completed'?`<button data-action="job-content" data-id="${j.unit_id}">View draft</button>`:''}</div></div>`).join(''):empty('No jobs yet. Open a curriculum unit and choose Generate draft.')}</section>`+pagination(S.jobs.length);}
function officialLink(url,label='Official VCAA source'){try{const u=new URL(url);if(u.protocol!=='https:'||u.username||u.password||!(u.hostname==='vcaa.vic.edu.au'||u.hostname.endsWith('.vcaa.vic.edu.au')))throw Error();return `<a href="${escape(u.href)}" target="_blank" rel="noopener noreferrer">${label}</a>`;}catch{return escape(url);}}
function saveDownload(name,data,type){const url=URL.createObjectURL(new Blob([data],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function renderSources(){const jobs=S.imports||[];$('content').innerHTML=title('VCAA source imports','Download official curriculum references and retain exactly where and when each source was retrieved.')+`<section class="card"><h2>Import Victorian Curriculum 2.0</h2><p>Mathematics and English use individual levels. Science uses the official Levels 3–4 and 7–8 bands; those labels are preserved.</p><p class="note">No AI key is needed. The scheduled worker processes queued imports, or use Process now. Importing references does not generate or publish lessons.</p><form id="source-import-form"><div class="two"><div class="field"><label for="source-subject">Subjects</label><select id="source-subject" name="subject"><option value="all">Maths, English and Science</option><option>Mathematics</option><option>English</option><option>Science</option></select></div><div class="field"><label for="source-years">Year levels</label><select id="source-years" name="years"><option value="both">Years 4 and 7</option><option value="4">Year 4</option><option value="7">Year 7</option></select></div></div><button class="primary">Start VCAA import</button></form><p class="note" style="margin-top:16px">Unchanged references are reused. Changed descriptors create a separate reference revision; existing lesson versions remain available.</p>${officialLink('https://f10.vcaa.vic.edu.au/download-curriculum','VCAA curriculum downloads')} · ${officialLink('https://f10.vcaa.vic.edu.au/copyright-statement','Source licence')}</section><section class="card"><h2>Import history</h2>${jobs.length?jobs.map(j=>`<article class="row"><div><h3>${escape(j.subject)} · Years ${escape(j.year_levels.join(', '))} ${tag(j.status)}</h3><p>Requested ${escape(date(j.created_at))} · ${j.attempts} processing attempts</p>${j.error?`<p class="danger">${escape(j.error)}</p>`:''}${j.status==='completed'?`<p>${j.summary.created||0} new · ${j.summary.revised||0} revised · ${j.summary.unchanged||0} unchanged${j.summary.not_present?' · '+j.summary.not_present+' no longer present':''}</p><p>Downloaded ${escape(date(j.source_fetched_at))} · ${Math.round(j.source_bytes/1024)} KB</p><details><summary>Source provenance</summary><p>${officialLink(j.source_url)}</p><p>SHA-256: <code>${escape(j.source_sha256)}</code></p><p>Parser ${escape(j.parser_version)} · Website build ${escape(j.source_build_id||'Not supplied')}</p><p>Last modified: ${escape(j.source_last_modified||'Not supplied')}</p><p>${escape(j.attribution)}</p>${officialLink(j.licence_url,'Licence terms')}</details>`:`<p>${officialLink(j.source_url)}</p>`}</div><div class="actions">${j.status==='queued'||(j.status==='running'&&Date.parse(j.lease_until)<Date.now())?`<button class="primary" data-action="source-run" data-id="${j.id}">Process now</button>`:''}${j.status==='failed'?`<button data-action="source-retry" data-id="${j.id}">Retry import</button>`:''}${['queued','running'].includes(j.status)?`<button data-action="source-cancel" data-id="${j.id}">Cancel</button>`:''}${j.status==='completed'?`<button data-action="source-items" data-id="${j.id}">View references</button><button data-action="source-download" data-id="${j.id}">Download source snapshot</button><button data-action="source-json" data-id="${j.id}">Export references JSON</button>`:''}</div></article>`).join(''):empty('No imports yet. Start an import to fill the curriculum library from VCAA.')}</section><div id="source-items-panel"></div>`+pagination(jobs.length);$('source-subject').value=S.sourceSubject||'all';$('source-years').value=S.sourceYears||'both';}
function referencePanel(u,source){const d=u.source_details||{};return `<section class="card"><h2>${escape(u.descriptor_code)} · Curriculum reference</h2><p>${escape(u.subject)} · ${escape(d.level_label||'Year '+u.year_level)}${d.strand?' · '+escape(d.strand):''}${d.substrand?' · '+escape(d.substrand):''}</p><p class="preview">${escape(u.descriptor_text)}</p><p>${officialLink(u.source_url)}</p>${source?`<p class="note">Downloaded ${escape(date(source.source_fetched_at))} · ${escape(source.parser_version)}</p><p class="note">Reference SHA-256: <code>${escape(u.source_record_hash)}</code></p><button data-action="source-download" data-id="${source.id}">Download original source snapshot</button>`:''}${u.source_current===false?'<div class="notice warning">Historical reference: this version is not in the latest VCAA import. Existing lessons are retained; use the current reference for new generation.</div>':''}${u.supersedes_unit_id?`<div class="notice" style="margin-top:16px">This official reference was revised. Earlier references and lessons remain available. <button data-action="import-unit" data-id="${u.supersedes_unit_id}">View previous reference</button></div>`:''}${d.elaborations?.length?`<details><summary>${d.elaborations.length} official elaborations</summary><ol>${d.elaborations.map(e=>`<li><p class="preview">${escape(e.text)}</p></li>`).join('')}</ol></details>`:''}${d.achievement_standard?`<details><summary>Official achievement standard · ${escape(d.level_label)}</summary><p class="preview">${escape(d.achievement_standard)}</p></details>`:''}${d.attribution?`<p class="note" style="margin-top:16px">${escape(d.attribution)} ${officialLink(d.licence_url,'Licence terms')}</p>`:''}</section>`;}
async function refreshVersion(id){const unit=S.selectedUnit.id;await openUnit(unit);if(id)openVersion(id);}
async function action(node){const a=node.dataset.action,id=node.dataset.id;
 if(a==='theme'){const dark=document.documentElement.dataset.theme==='dark'||(!document.documentElement.dataset.theme&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.dataset.theme=dark?'light':'dark';localStorage.setItem('trackline-admin-theme',dark?'light':'dark');return;}
 if(a==='verify-cancel'){$('verify-dialog').close();reauthResolve?.(false);reauthResolve=null;return;}
 if(a==='signout'){await api('/api/platform-session',{method:'DELETE'});S.signedIn=false;S.unlocked=false;S.admin=null;gate();return;}
 if(a==='lock'){await sessionPost({action:'lock'});S.unlocked=false;gate();return;}
 if(a==='refresh'){await load();return;}
 if(a==='next'||a==='prev'){S.offset=Math.max(0,S.offset+(a==='next'?1:-1)*(S.page==='families'?25:50));await load();return;}
 if(a==='unit-new'){unitEditor();return;}
 if(a==='unit-edit'){unitEditor(S.units.find(u=>u.id===id));return;}
 if(a==='editor-close'){$('unit-editor').innerHTML='';return;}
 if(a==='unit-open'){await openUnit(id);return;}
 if(a==='import-unit'){await navigate('curriculum');if(!S.units.some(u=>u.id===id))S.units.push(...await api('/api/platform-manage?kind=units&unitId='+id));await openUnit(id);return;}
 if(a.startsWith('source-')){
  if(a==='source-download'){const d=await api('/api/platform-manage?kind=import-source&id='+id);const bytes=Uint8Array.from(atob(d.source_archive_base64),c=>c.charCodeAt(0));saveDownload('VCAA-'+d.subject+'-'+id+'.html.gz',bytes,'application/gzip');announce('Original VCAA page snapshot downloaded as .html.gz.');return;}
  if(a==='source-json'||a==='source-items'){
   const rows=await api('/api/platform-manage?kind=import-items&id='+id);
   if(a==='source-json'){saveDownload('VCAA-references-'+id+'.json',JSON.stringify(rows,null,2),'application/json');announce('References exported.');return;}
   $('source-items-panel').innerHTML=`<section class="card"><h2>Imported references</h2>${rows.map(r=>`<div class="row"><div><h3>${escape(r.unit.descriptor_code)} · Year ${r.unit.year_level} ${tag(r.change_type)}</h3><p>${escape(r.unit.source_details?.level_label||'')} · ${escape(r.unit.title)}</p><p class="preview">${escape(r.unit.descriptor_text)}</p></div><button data-action="import-unit" data-id="${r.unit.id}">Open reference</button></div>`).join('')||empty('No imported references.')}</section>`;$('source-items-panel').scrollIntoView({block:'start'});return;
  }
  if(a==='source-cancel'&&!confirm('Cancel this source import? Saved references from earlier imports remain available.'))return;
  announce(a==='source-run'?'Downloading and importing the official VCAA source…':'Updating import…');
  const r=await post({action:({'source-run':'source-import-run','source-retry':'source-import-retry','source-cancel':'source-import-cancel'})[a],id});await load();announce(r.status==='failed'?'Import failed. See the error in import history.':'Import updated.',r.status==='failed');return;
 }
 if(a==='version-open'){openVersion(id);return;}
 if(a==='import-show'){$('unit-editor').innerHTML='<section class="card"><h2>Import curriculum references</h2><p class="note">Paste an array of unit objects: title, subject, year_level, curriculum_version, source_url, descriptor_code and descriptor_text. This imports metadata, not source extraction.</p><form id="units-import"><label for="import-json">Reference JSON</label><textarea id="import-json" class="code" required></textarea><button class="primary">Import references</button></form></section>';return;}
 if(a==='draft-import'){$('draft-import-panel').innerHTML='<form id="draft-import" class="card"><h3>Import lesson content</h3><p class="note">Use the documented skills/lesson/questions/rubric format.</p><label for="draft-json">Lesson JSON</label><textarea id="draft-json" class="code" required></textarea><button class="primary">Create draft version</button></form>';return;}
 if(a==='queue'){await post({action:'generation-queue',unitId:id});await navigate('jobs');announce('Generation queued.');return;}
 if(a==='validate'){await post({action:'version-validate',id});await refreshVersion(id);announce('Structural checks passed. Review educational accuracy before publishing.');return;}
 if(a==='publish'){if(!$('review-confirmed')?.checked)throw Error('Confirm your review before publishing.');await securePost({action:'version-publish',id,reviewConfirmed:true});await refreshVersion(id);announce('Version published. Existing family study plans were not changed.');return;}
 if(a==='version-archive'){if(!confirm('Archive this version? Its history will remain available.'))return;await securePost({action:'version-archive',id});await refreshVersion(id);announce('Version archived.');return;}
 if(a==='unit-archive'){await post({action:'unit-archive',id,archived:node.dataset.archived==='true'});await load();return;}
 if(a.startsWith('job-')){
  if(a==='job-content'){await navigate('curriculum');if(!S.units.some(u=>u.id===id)){const rows=await api('/api/platform-manage?kind=units&unitId='+id);S.units.push(...rows);}await openUnit(id);return;}
  if(a==='job-cancel'&&!confirm('Cancel this job? Any completed content versions remain available.'))return;
  announce(a==='job-run'?'Generating content. This can take up to 40 seconds…':'Updating job…');
  await post({action:({'job-run':'generation-run','job-retry':'generation-retry','job-cancel':'generation-cancel'})[a],id});await load();announce('Job updated.');return;
 }
 if(a==='family-open'){
  if(!confirm('Open this family’s detailed information? Access is read-only and will be audited.'))return;
  const d=await post({action:'family-open',familyId:id});
  const f=d.familyData||{},members=f.members||[],memberName=id=>members.find(m=>m.id===id)?.name||id||'Family';
  $('family-details').innerHTML=`<section class="card"><h2>${escape(f.family?.name||'Family details')} · Read-only</h2><p class="note">This access was recorded. Credentials are excluded. Recent study and task records are limited to 250 entries; shopping history to 50 lists.</p><div class="grid">${members.map(m=>`<div class="card"><h3>${escape(m.name)}</h3><p>${escape(m.role)}${m.yearLevel?' · Year '+escape(m.yearLevel):''}</p>${m.email?`<small>${escape(m.email)}</small>`:''}${m.phone?`<p>${escape(m.phone)}</p>`:''}</div>`).join('')}</div><h3>Tasks</h3>${(f.chores||[]).map(t=>`<div class="row"><strong>${escape(t.title)}</strong><span>${escape(memberName(t.memberId))} · ${escape(t.frequency||'')}</span></div>`).join('')||empty('No tasks.')}<h3 style="margin-top:20px">Schedule</h3>${(f.events||[]).map(v=>`<div class="row"><strong>${escape(v.title)}</strong><span>${escape(memberName(v.memberId))} · ${escape(v.date||v.recurrence||'')}</span></div>`).join('')||empty('No scheduled events.')}<h3 style="margin-top:20px">Study progress</h3>${d.studyProgress.map(p=>`<div class="row"><div><strong>${escape(memberName(p.member_id))}</strong><p>${escape(p.topic_id)}</p></div><span>${escape(p.status)} · ${p.exam_score??'—'}% · ${p.attempt_count??0} attempts</span></div>`).join('')||empty('No recorded study progress.')}<h3 style="margin-top:20px">Devices</h3>${d.devices.map(v=>`<div class="row"><div><strong>${escape(v.label||v.hostname)}</strong><p>${escape(memberName(v.member_id))}</p></div><span>${v.revoked?'Revoked':'Active'} · Last sync ${escape(date(v.last_sync_at))}</span></div>`).join('')||empty('No paired devices.')}<details><summary>Additional saved family information</summary><pre id="family-extra" class="code result-box"></pre></details></section>`;
  $('family-extra').textContent=JSON.stringify(d,null,2);$('family-details').scrollIntoView({block:'start'});return;
 }
 if(a==='admin-toggle'){if(!confirm('Change this administrator’s access? Existing sessions will be revoked.'))return;await securePost({action:'account-change',id,enabled:node.dataset.enabled==='true'});await load();return;}
 if(a==='admin-reset'){$('account-reset').innerHTML=`<section class="card"><h2>Reset ${escape(node.dataset.name)} credentials</h2><form id="admin-reset"><input name="id" type="hidden" value="${id}"><div class="field"><label for="reset-pass">New password</label><input id="reset-pass" name="password" type="password" minlength="12" maxlength="128" autocomplete="new-password"></div><div class="field"><label for="reset-pin">New PIN</label><input id="reset-pin" name="pin" type="password" pattern="[0-9]{4}" maxlength="4" inputmode="numeric" autocomplete="off"></div><button class="primary">Save and revoke sessions</button></form></section>`;return;}
}
document.addEventListener('click',async e=>{const node=e.target.closest('button[data-action],button[data-page]');if(!node)return;if(node.dataset.action==='verify-cancel'){await action(node);return;}if(S.pending)return;try{S.pending=true;node.disabled=true;if(node.dataset.page)await navigate(node.dataset.page);else await action(node);}catch(err){announce(err.message,true);}finally{S.pending=false;if(node.isConnected)node.disabled=false;}});
document.addEventListener('change',async e=>{if(e.target.id==='source-subject'){S.sourceSubject=e.target.value;return;}if(e.target.id==='source-years'){S.sourceYears=e.target.value;return;}if(e.target.id==='year-filter'||e.target.id==='subject-filter'){if(e.target.id==='year-filter')S.year=e.target.value;else S.subject=e.target.value;S.offset=0;await load();}});
document.addEventListener('submit',async e=>{e.preventDefault();const f=e.target;if(S.pending&&f.id!=='verify-form')return;const button=f.querySelector('button[type=submit],button.primary');if(button)button.disabled=true;try{
 if(f.id==='verify-form'){await sessionPost({action:'reauth',password:$('verify-password').value});$('verify-password').value='';$('verify-dialog').close();reauthResolve?.(true);reauthResolve=null;return;}
 S.pending=true;
 if(f.id==='gate-form'){await sessionPost(S.signedIn?{action:'pin',pin:$('pin').value}:{action:'login',username:$('username').value,password:$('password').value});await boot();return;}
 const fields=Object.fromEntries(new FormData(f));
 if(f.id==='source-import-form'){const r=await post({action:'source-import-queue',subjects:fields.subject==='all'?['Mathematics','English','Science']:[fields.subject],years:fields.years==='both'?[4,7]:[Number(fields.years)]});await load();announce(`${r.queued} imports queued${r.already_active?' · '+r.already_active+' subjects already have an active import':''}. Use Process now or wait for the worker.`);return;}
 if(f.id==='unit-form'){if(!fields.id)delete fields.id;await post({action:'unit-save',...fields});await load();announce('Curriculum reference saved.');}
 else if(f.id==='units-import'){await post({action:'units-import',units:JSON.parse($('import-json').value)});await load();announce('References imported.');}
 else if(f.id==='draft-import'){await post({action:'draft-create',unitId:S.selectedUnit.id,content:JSON.parse($('draft-json').value)});await openUnit(S.selectedUnit.id);announce('Draft version created.');}
 else if(f.id==='version-form'){await post({action:'version-save',id:S.version.id,content:JSON.parse($('version-json').value),review_notes:$('review-notes').value});await refreshVersion(S.version.id);announce('Draft saved. Repeat structural checks before publishing.');}
 else if(f.id==='family-search'){S.familySearch=$('family-search-input').value;S.offset=0;await load();}
 else if(f.id==='admin-create'){await securePost({action:'admin-create',...fields});await load();announce('Administrator created.');}
 else if(f.id==='account-change'||f.id==='admin-reset'){
  const body={action:'account-change',id:fields.id||S.admin.id};if(fields.password)body.password=fields.password;if(fields.pin)body.pin=fields.pin;
  const r=await securePost(body);if(r.signedOut){S.signedIn=false;S.unlocked=false;gate();announce('Credentials updated. Sign in with the new credentials.');}else{await load();announce('Credentials changed and sessions revoked.');}
 }
