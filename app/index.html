      ${quickAddChips? `<div class="quick-add-row"><div class="quick-add-label">Frequently bought:</div>${quickAddChips}</div>` : ''}
      <div class="modal-actions" style="margin-top:20px;">
        <div>${canEditMeta? `<button class="btn danger" onclick="deleteTrip('${trip.id}')">Delete trip</button>` : ''}</div>
        <div>${canEditMeta? `<button class="btn primary" onclick="toggleTripComplete('${trip.id}')">${trip.status==='completed'?'Reopen trip':'Mark trip complete'}</button>` : ''}</div>
      </div>
    </div>
  `;
}

function renderTripModal(){
  if(!ui.tripModalOpen) return '';
  const isEdit = !!ui.editingTripId;
  const editingTrip = isEdit ? (state.shoppingTrips||[]).find(t=>t.id===ui.editingTripId) : null;
  if(isEdit && !editingTrip) return '';

  const today = todayISO();
  const memberOptions = state.members.map(m=>`<option value="${m.id}" ${editingTrip && editingTrip.memberId===m.id?'selected':''}>${escapeHtml(m.name)}</option>`).join('');
  const choreOptions = state.chores.map(c=>`<option value="${c.id}" ${editingTrip && editingTrip.choreId===c.id?'selected':''}>${escapeHtml(c.title)}</option>`).join('');
  const nameVal = editingTrip ? editingTrip.name : '';
  const dateVal = editingTrip ? editingTrip.date : today;
  const timeVal = editingTrip ? (editingTrip.time||'') : '';

  const quickListItems = state.shoppingList || [];
  const prefillIds = ui.tripPrefillItemIds || [];
  const quickListPicker = (!isEdit && quickListItems.length>0) ? `
    <div class="field">
      <label>Add items from your Quick List (optional)</label>
      <div class="trip-quicklist-picker">
        ${quickListItems.map((item,idx)=>`
          <label class="trip-quicklist-check">
            <input type="checkbox" class="f_trip_quickitem" value="${idx}" ${prefillIds.includes(item.id)?'checked':''}>
            ${escapeHtml(item.name)}
          </label>`).join('')}
      </div>
    </div>` : '';
  return `
  <div class="overlay" onclick="if(event.target===this) closeTripModal()">
    <div class="modal">
      <h2>${isEdit? 'Edit trip' : 'New shopping trip'}</h2>
      <div class="field">
        <label>Trip name</label>
        <input type="text" id="f_trip_name" placeholder="e.g. Coles run" value="${escapeHtml(nameVal)}">
      </div>
      <div class="row2">
        <div class="field">
          <label>Date</label>
          <input type="date" id="f_trip_date" value="${dateVal}" min="${today}">
        </div>
        <div class="field">
          <label>Time (optional)</label>
          <input type="time" id="f_trip_time" value="${timeVal}">
        </div>
      </div>
      <div class="field">
        <label>Who's going</label>
        <select id="f_trip_member">${memberOptions}</select>
      </div>
      <p style="font-size:11.5px;color:#8a8468;margin:-8px 0 14px;">Set a time and this trip shows up on the Week Board calendar too, alongside activities and tasks — not just here.</p>
      <div class="field">
        <label>Link to an existing task (optional)</label>
        <select id="f_trip_chore">
          <option value="">— None —</option>
          ${choreOptions}
        </select>
        <p style="font-size:11.5px;color:#8a8468;margin:6px 0 0;">Linking just shows on the trip that it's tied to that task — marking the task done and completing the trip stay independent.</p>
      </div>
      ${quickListPicker}
      ${!isEdit ? `
      <div class="field">
        <label>Or add new items now (comma-separated, optional)</label>
        <input type="text" id="f_trip_new_items" placeholder="e.g. Strawberries, Chocolate, Toilet paper">
      </div>` : ''}
      <div class="modal-actions">
        <div></div>
        <div style="display:flex;gap:8px;">
          <button class="btn ghost" onclick="closeTripModal()">Cancel</button>
          <button class="btn primary" onclick="saveTrip()">${isEdit?'Save changes':'Create'}</button>
        </div>
      </div>
    </div>
  </div>`;
}

function renderChores(){
  const dateISO = selectedDateISO();
  const loggedInId = ui.profileId;

  const groups = state.members.map(m=>{
    const due = choresForDateMember(dateISO, m.id);
    if(due.length===0) return '';
    const rows = due.map(c=>{
      const log = choreLogFor(c.id, dateISO);
      const canAct = canMarkChoreDone(c);
      let action;
      if(log){
        action = canAct
          ? `<div class="chore-done-badge" onclick="undoChoreDone('${c.id}','${dateISO}')">✓ Done at ${escapeHtml(log.completedAt)}</div>`
          : `<div class="chore-done-badge" style="cursor:default;">✓ Done at ${escapeHtml(log.completedAt)}</div>`;
      } else {
        action = canAct
          ? `<button class="chore-pending-btn" onclick="openCompleteChore('${c.id}')">Mark done</button>`
          : `<span class="chore-locked-btn">${isLoggedIn()? 'Not yours':'Log in'}</span>`;
      }
      return `<div class="chore-row">
        <div class="chore-info" onclick="openChoreEdit('${c.id}')">
          <div class="chore-title">${escapeHtml(c.title)}</div>
          <div class="chore-freq">${frequencyLabel(c)}</div>
        </div>
        ${action}
      </div>`;
    }).join('');

    return `<div class="chore-group">
      <div class="chore-group-head"><span class="swatch" style="background:${m.color}"></span><span class="name">${escapeHtml(m.name)}</span></div>
      ${rows}
    </div>`;
  }).join('');

  const anyDue = state.members.some(m=>choresForDateMember(dateISO,m.id).length>0);

  return `
    ${renderWeekNav()}
    ${renderDayRow()}
    ${anyDue ? groups : `<div class="chore-empty-day">No tasks due on ${formatDateNice(dateISO)}.</div>`}
    <button class="fab" onclick="openChoreAdd()">+ Add task</button>
  `;
}

function renderParentView(){
  const dateISO = selectedDateISO();

  const tiles = state.members.map(m=>{
    // this person's activities + any transit blocks they're driving, merged and time-sorted
    const scheduleItems = [];
    eventsForDateMember(dateISO, m.id).forEach(e=>{
      scheduleItems.push({ start:e.start, end:e.end, title:e.title, location:e.location, kind:'event' });
    });
    transitBlocksForDateDriver(dateISO, m.id).forEach(t=>{
      scheduleItems.push({ start:t.start, end:t.end, title:t.label, location:'', kind:'transit' });
    });
    scheduleItems.sort((a,b)=>a.start-b.start);

    const scheduleHtml = scheduleItems.length===0
      ? `<div class="tile-empty">Nothing scheduled</div>`
      : scheduleItems.map(it=>`
        <div class="tile-sched-row">
          <span class="tile-sched-time">${minToShort(it.start)}–${minToShort(it.end)}</span>
          <span class="tile-sched-title">${it.kind==='transit'?'🚗 ':''}${escapeHtml(it.title)}${it.location?` · ${escapeHtml(it.location)}`:''}</span>
        </div>`).join('');

    // tasks due today for this person, with a quick-complete button right on the tile
    const dueTasks = m.role==='kid' ? choresForDateMember(dateISO, m.id) : [];
    const doneCount = dueTasks.filter(c=>choreLogFor(c.id, dateISO)).length;
    const pct = dueTasks.length ? Math.round((doneCount/dueTasks.length)*100) : 0;
    const taskRows = dueTasks.map(c=>{
      const log = choreLogFor(c.id, dateISO);
      if(log) return `<div class="tile-task-row tile-task-done">✓ ${escapeHtml(c.title)}</div>`;
      const overdue = c.dueTime && timeInputToMin(c.dueTime) < nowMinutesOfDay();
      return `<div class="tile-task-row ${overdue?'tile-task-overdue':''}" onclick="openCompleteChore('${c.id}')">
        <span>${overdue?'⚠ ':''}${escapeHtml(c.title)}</span>
        <span class="tile-task-mark">Mark done</span>
      </div>`;
    }).join('');
    const tasksSection = m.role==='kid' ? `
      <div class="tile-section">
        <div class="tile-section-head">
          <span>Tasks</span>
          ${dueTasks.length ? `<span class="tile-progress-label">${doneCount}/${dueTasks.length}</span>` : ''}
        </div>
        ${dueTasks.length ? `<div class="tile-progress-bar"><div class="tile-progress-fill" style="width:${pct}%;background:${m.color};"></div></div>` : ''}
        ${dueTasks.length ? taskRows : `<div class="tile-empty">No tasks today</div>`}
      </div>` : '';

    // Study assignments for this kid, today - same source as Kid View, plus overdue banner
    let studySection = '';
    if(m.role==='kid' && m.yearLevel){
      const studyToday = studyItemsForDate(m.id, dateISO);
      const overdue = ensureStudyOverdue(m.id);
      const overdueHtml = (overdue && overdue.length) ? `
        <div style="background:rgba(214,72,78,.12);border:1px solid #D6484E;border-radius:6px;padding:8px 10px;margin-bottom:8px;font-size:12px;color:#D6484E;cursor:pointer;" onclick="jumpToStudyTopic('${m.id}','${overdue[0].topicId}')">
          ⚠ ${overdue.length} pending from earlier
        </div>` : '';
      if(studyToday===null){
        studySection = `<div class="tile-section"><div class="tile-section-head"><span>Study</span></div>${overdueHtml}<div class="tile-empty">Loading…</div></div>`;
      } else {
        const doneStudyCount = studyToday.filter(it=>topicStatus(m.id,it.topicId)==='completed').length;
        const studyPct = studyToday.length ? Math.round((doneStudyCount/studyToday.length)*100) : 0;
        const studyRows = studyToday.map(it=>{
          const status = topicStatus(m.id, it.topicId);
          const done = status==='completed';
          if(done) return `<div class="tile-task-row tile-task-done">✓ ${escapeHtml(it.subjectName)}: ${escapeHtml(it.topicName)}</div>`;
          return `<div class="tile-task-row ${status==='reassigned'?'tile-task-overdue':''}" onclick="jumpToStudyTopic('${m.id}','${it.topicId}')">
            <span>${status==='reassigned'?'⚠ ':''}${escapeHtml(it.subjectName)}: ${escapeHtml(it.topicName)}</span>
            <span class="tile-task-mark">Start</span>
          </div>`;
        }).join('');
        studySection = `
          <div class="tile-section">
            <div class="tile-section-head">
              <span>Study</span>
              ${studyToday.length ? `<span class="tile-progress-label">${doneStudyCount}/${studyToday.length}</span>` : ''}
            </div>
            ${overdueHtml}
            ${studyToday.length ? `<div class="tile-progress-bar"><div class="tile-progress-fill" style="width:${studyPct}%;background:${m.color};"></div></div>` : ''}
            ${studyToday.length ? studyRows : `<div class="tile-empty">Nothing assigned today</div>`}
          </div>`;
      }
    }

    // shopping trips assigned to this person today
    const myTrips = (state.shoppingTrips||[]).filter(t=>t.memberId===m.id && t.date===dateISO && !t.pendingApproval);
    const tripsSection = myTrips.length ? `
      <div class="tile-section">
        <div class="tile-section-head"><span>Shopping</span></div>
        ${myTrips.map(t=>{
          const items = t.items||[];
          const bought = items.filter(i=>i.status==='bought').length;
          return `<div class="tile-sched-row" style="cursor:pointer;" onclick="jumpToTripFromElsewhere('${t.id}')">
            <span class="tile-sched-time">🛒</span>
            <span class="tile-sched-title">${escapeHtml(t.name)} · ${bought}/${items.length} bought</span>
          </div>`;
        }).join('')}
      </div>` : '';

    const needsAttention = dueTasks.some(c=>!choreLogFor(c.id,dateISO) && c.dueTime && timeInputToMin(c.dueTime) < nowMinutesOfDay());

    return `
      <div class="person-tile ${needsAttention?'person-tile-attention':''}" style="border-top-color:${m.color};">
        <div class="tile-header">
          <span class="profile-avatar" style="background:${m.color};width:38px;height:38px;font-size:14px;">${initials(m.name)}</span>
          <div>
            <div class="tile-name">${escapeHtml(m.name)}</div>
            <div class="tile-role">${m.role==='parent'?'Parent':'Kid'}</div>
          </div>
        </div>
        <div class="tile-section">
          <div class="tile-section-head"><span>Today</span></div>
          ${scheduleHtml}
        </div>
        ${tasksSection}
        ${studySection}
        ${tripsSection}
      </div>`;
  }).join('');

  return `
    ${renderWeekNav()}
    ${renderDayRow()}
    <div class="person-tiles-grid">
      ${tiles}
    </div>
  `;
}

function nowMinutesOfDay(){
  const n = new Date();
  return n.getHours()*60 + n.getMinutes();
}

function jumpToTripFromElsewhere(tripId){
  ui.tab = 'shopping';
  ui.shoppingMode = 'trip-detail';
  ui.viewingTripId = tripId;
  render();
}

function renderKidView(){
  const kids = state.members.filter(m=>m.role==='kid');
  const selectBtns = kids.map(k=>`<button class="kid-select-btn ${ui.kidId===k.id?'active':''}" style="border-color:${k.color};${ui.kidId===k.id?'background:'+k.color+';':''}" onclick="setKid('${k.id}')">${escapeHtml(k.name)}</button>`).join('');
  const dateISO = selectedDateISO();
  const kid = memberById(ui.kidId);
  let items = '';
  let plain = '';
  let taskItems = '';
  let studyItems = '';
  if(kid){
    const evs = eventsForDateMember(dateISO, kid.id).slice().sort((a,b)=>a.start-b.start);
    if(evs.length===0){
      items = `<div class="kid-empty">Nothing scheduled for ${formatDateNice(dateISO)}. Free day 🎉</div>`;
      plain = kid.name + ' schedule — ' + formatDateNice(dateISO) + '\nNothing scheduled. Free day!';

      items = evs.map(e=>`
        <div class="kid-item">
          <div class="kid-time">${minToShort(e.start)}–${minToShort(e.end)}</div>
          <div>
            <div class="kid-title">${escapeHtml(e.title)}</div>
            ${e.location?`<div class="kid-loc">${escapeHtml(e.location)}</div>`:''}
            ${e.notes?`<div class="kid-loc" style="font-style:italic;">${escapeHtml(e.notes)}</div>`:''}
          </div>
        </div>`).join('');
      plain = kid.name + ' schedule — ' + formatDateNice(dateISO) + '\n' + evs.map(e=>`${minToShort(e.start)}–${minToShort(e.end)}  ${e.title}${e.location? ' ('+e.location+')':''}${e.notes? ' — '+e.notes:''}`).join('\n');
    }

    const dueTasks = choresForDateMember(dateISO, kid.id);
    if(dueTasks.length>0){
      const canAct = ui.profileId===kid.id || isParentLoggedIn();
      const rows = dueTasks.map(c=>{
        const log = choreLogFor(c.id, dateISO);
        let action;
        if(log){
          action = canAct
            ? `<div class="chore-done-badge" onclick="undoChoreDone('${c.id}','${dateISO}')">✓ Done at ${escapeHtml(log.completedAt)}</div>`
            : `<div class="chore-done-badge" style="cursor:default;">✓ Done at ${escapeHtml(log.completedAt)}</div>`;
        } else {
          action = canAct
            ? `<button class="chore-pending-btn" onclick="openCompleteChore('${c.id}')">Mark done</button>`
            : `<span class="chore-locked-btn">${isLoggedIn()? 'Not yours':'Log in'}</span>`;
        }
        return `<div class="chore-row">
          <div class="chore-info" onclick="openChoreEdit('${c.id}')">
            <div class="chore-title">${escapeHtml(c.title)}</div>
            <div class="chore-freq">${frequencyLabel(c)}</div>
          </div>
          ${action}
        </div>`;
      }).join('');
      taskItems = `<div class="kid-big" style="margin-top:18px;">
        <h2 style="font-size:19px;">${escapeHtml(kid.name)}'s tasks</h2>
        <div class="kd">${formatDateNice(dateISO)}</div>
        ${rows}
      </div>`;

      const taskPlain = dueTasks.map(c=>{
        const log = choreLogFor(c.id, dateISO);
        return `- ${c.title}${log? ' (done at '+log.completedAt+')' : ' (not done yet)'}`;
      }).join('\n');
      plain += '\n\nTasks:\n' + taskPlain;
    }

    // Study assignments for this date, plus anything overdue from earlier
    const studyDayItems = kid.yearLevel ? studyItemsForDate(kid.id, dateISO) : [];
    const overdueForBanner = kid.yearLevel ? renderOverdueBanner(kid) : '';
    if(kid.yearLevel && studyDayItems===null){
      studyItems = `<div class="kid-big" style="margin-top:18px;">
        <h2 style="font-size:19px;">${escapeHtml(kid.name)}'s study</h2>
        ${overdueForBanner}
        <div class="chore-empty-day">Loading…</div>
      </div>`;
    } else if(kid.yearLevel && studyDayItems && studyDayItems.length>0){
      const canAct = ui.profileId===kid.id || isParentLoggedIn();
      const rows = studyDayItems.map(it=>{
        const status = topicStatus(kid.id, it.topicId);
        const done = status==='completed';
        const label = {not_started:'Not started', studying:'Study in progress', exam_ready:'Ready for exam', completed:'✓ Completed', reassigned:'Needs practice'}[status];
        return `<div class="chore-row">
          <div class="chore-info" onclick="jumpToStudyTopic('${kid.id}','${it.topicId}')">
            <div class="chore-title">${escapeHtml(it.subjectName)}: ${escapeHtml(it.topicName)}</div>
            <div class="chore-freq">${label}</div>
          </div>
          ${done
            ? `<div class="chore-done-badge" style="cursor:default;">✓ Done</div>`
            : (canAct ? `<button class="chore-pending-btn" onclick="jumpToStudyTopic('${kid.id}','${it.topicId}')">Start</button>` : `<span class="chore-locked-btn">${isLoggedIn()? 'Not yours':'Log in'}</span>`)}
        </div>`;
      }).join('');
      studyItems = `<div class="kid-big" style="margin-top:18px;">
        <h2 style="font-size:19px;">${escapeHtml(kid.name)}'s study</h2>
        <div class="kd">${formatDateNice(dateISO)}</div>
        ${overdueForBanner}
        ${rows}
      </div>`;
    } else if(kid.yearLevel){
      studyItems = overdueForBanner ? `<div class="kid-big" style="margin-top:18px;">
        <h2 style="font-size:19px;">${escapeHtml(kid.name)}'s study</h2>
        ${overdueForBanner}
      </div>` : '';
    }
  } // closes if(kid){
  kidPlainText = plain;

  // shopping trips assigned specifically to this kid, for the selected date
  let tripItems = '';
  if(kid){
    const kidTrips = (state.shoppingTrips||[]).filter(t=>t.memberId===kid.id && t.date===dateISO);
    if(kidTrips.length>0){
      const rows = kidTrips.map(t=>{
        const items2 = t.items||[];
        const bought = items2.filter(i=>i.status==='bought').length;
        return `<div class="trip-row" onclick="jumpToTripFromElsewhere('${t.id}')">
          <div>
            <div class="trip-title">${escapeHtml(t.name)}${t.status==='completed'?' <span class="trip-done-badge">Done</span>':''}${t.pendingApproval?' <span class="trip-pending-badge">Pending</span>':''}</div>
            <div class="trip-meta">${bought}/${items2.length} bought</div>
          </div>
          <span class="trip-chevron">›</span>
        </div>`;
      }).join('');
      tripItems = `<div class="kid-big" style="margin-top:18px;">
        <h2 style="font-size:19px;">${escapeHtml(kid.name)}'s shopping trips</h2>
        <div class="kd">${formatDateNice(dateISO)}</div>
        ${rows}
      </div>`;
    }
  }

  return `
    <div class="kid-select">${selectBtns}</div>
    ${renderWeekNav()}
    ${renderDayRow()}
    <div class="kid-big">
      <h2>${kid?escapeHtml(kid.name):'—'}'s day</h2>
      <div class="kd">${formatDateNice(dateISO)}</div>
      ${items}
      <div class="copybar">
        <button class="btn primary" onclick="copySchedule()">Copy schedule to send</button>
        ${ui.copiedFlash? '<span class="copied">Copied ✓ — paste into an email or text</span>':''}
      </div>
      <div class="hint">This app can't send email directly — tap "copy" and paste the text into an email, text, or chat to the laptop. Or just bookmark this Kid View tab on the laptop and check it each morning.</div>
    </div>
    ${taskItems}
    ${studyItems}
    ${tripItems}
  `;
}

function renderStudyTab(){
  const kids = state.members.filter(m=>m.role==='kid');
  if(!kids.length){
    return `<div class="chore-empty-day">Add a kid profile in Settings to start tracking study progress.</div>`;
  }
  const kid = memberById(ui.kidId) || kids[0];
  if(ui.studyLoading && ui.studySubjects===null){
    return `<div class="chore-empty-day">Loading study content…</div>`;
  }
  const kidSwitcher = kids.length>1 ? `
    <div class="filter-chips">
      ${kids.map(k=>`<div class="filter-chip ${ui.kidId===k.id?'':'filter-chip-off'}" onclick="setStudyKid('${k.id}')">
        <span class="dot" style="background:${k.color||'#8C8676'}"></span>${escapeHtml(k.name)}
      </div>`).join('')}
    </div>` : '';
  if(!kid.yearLevel){
    return `${kidSwitcher}<div class="chore-empty-day">Set ${escapeHtml(kid.name)}'s year level in Settings to load their curriculum (Prep–8 supported).</div>`;
  }
  if(ui.studyError && (!ui.studySubjects || !ui.studySubjects.length)){
    return `${kidSwitcher}<div class="chore-empty-day">${escapeHtml(ui.studyError)}</div>
      <button class="btn ghost" style="margin-top:10px;" onclick="fetchStudyTopics()">Try again</button>`;
  }
  if(ui.studyView==='exam') return kidSwitcher + renderStudyExamView();
  if(ui.studyView==='study' && ui.studySelectedTopicId) return kidSwitcher + renderStudyTopicDetail(kid);
  return kidSwitcher + renderStudyAssignmentsPanel(kid) + `<div style="margin:26px 0 14px;font-family:'Archivo Narrow',sans-serif;font-weight:800;font-size:14px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-dim);">Browse all topics</div>` + renderStudySubjectsAndTopics(kid);
}

function renderOverdueBanner(kid){
  const overdue = ensureStudyOverdue(kid.id);
  if(!overdue || !overdue.length) return '';
  return `<div style="background:rgba(214,72,78,.12);border:1px solid #D6484E;border-radius:8px;padding:12px 14px;margin-bottom:14px;">
    <div style="font-weight:700;font-size:13px;color:#D6484E;margin-bottom:6px;">⚠ ${overdue.length} study ${overdue.length===1?'task':'tasks'} from earlier still pending</div>
    ${overdue.map(o=>`<div style="font-size:13px;padding:4px 0;cursor:pointer;" onclick="jumpToStudyTopic('${kid.id}','${o.topicId}')">
      ${escapeHtml(o.subjectName)}: ${escapeHtml(o.topicName)} ${o.date?`<span style="color:var(--text-dim);font-family:'IBM Plex Mono',monospace;font-size:11px;">(assigned ${escapeHtml(o.date)})</span>`:''}
    </div>`).join('')}
  </div>`;
}

function renderStudyAssignmentsPanel(kid){
  const key = weekCacheKey(kid.id, ui.studyWeekOffset);
  const days = getStudyWeekDays(kid.id, ui.studyWeekOffset);
  if(days===null && ui.studyWeekLoading[key]){
    return `<div class="chore-empty-day">Loading this week's assignments…</div>`;
  }
  const weekLabel = ui.studyWeekOffset===0 ? 'This week' : ui.studyWeekOffset===1 ? 'Next week' : `Week +${ui.studyWeekOffset}`;
  const rows = days || [];
  const totalPending = rows.reduce((sum,d)=>sum + d.items.filter(it=>topicStatus(kid.id,it.topicId)!=='completed').length, 0);
  const weekError = ui.studyWeekError[key];
  return `
    ${renderOverdueBanner(kid)}
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
      <div style="font-family:'Archivo Narrow',sans-serif;font-weight:800;font-size:16px;text-transform:uppercase;letter-spacing:.03em;">
        ${weekLabel}${totalPending>0 ? ` <span class="nav-badge">${totalPending} pending</span>` : ''}
      </div>
      <div style="display:flex;gap:6px;">
        <button class="btn ghost" style="padding:6px 12px;font-size:12px;" onclick="changeStudyWeek(-1)" ${ui.studyWeekOffset===0?'disabled':''}>← Prev</button>
        <button class="btn ghost" style="padding:6px 12px;font-size:12px;" onclick="changeStudyWeek(1)">Next →</button>
      </div>
    </div>

function renderScreenTimeCard(m){
  const myDevices = (ui.deviceInfoData||[]).filter(d=>d.memberId===m.id);
  const todayByDevice = todayUsageByDevice(m.id);
  const todayTotal = Object.values(todayByDevice).reduce((sum,v)=>sum+v,0);
  const trend = dailyTotalsForMember(m.id, ui.deviceUsageDays);
  const maxDay = Math.max(1, ...trend.map(t=>t.totalMinutes));
  const categoryBreakdown = todayCategoryBreakdown(m.id);

  const anyStale = myDevices.some(d=>deviceSyncStatus(d).status==='stale');

  const deviceRows = myDevices.length===0
    ? `<div class="tile-empty">No device paired yet</div>`
    : myDevices.map(d=>{
        const status = deviceSyncStatus(d);
        const todayMins = todayByDevice[d.hostname] || 0;
        const label = d.label || d.hostname || 'Device';
        const extra = (status.status!=='stale' && todayMins>0) ? ` — ${formatMinutesAsHM(todayMins)} today` : '';
        return `<div class="tile-task-row ${status.status==='stale'?'tile-task-overdue':''}" style="cursor:default;">
          <span>${status.status==='stale'?'⚠ ':'✓ '}${escapeHtml(label)}${extra}</span>
          <span class="tile-task-mark" style="${status.status==='stale'?'background:#D6484E;color:#fff;':''}">${escapeHtml(status.label)}</span>
        </div>`;
      }).join('');

  const categoryColors = { Study:'#3d7a4f', Games:'#C1555F', Uncategorized:'#8a8468' };
  const categoryTotal = Object.values(categoryBreakdown).reduce((sum,v)=>sum+v,0);
  const categorySection = categoryTotal===0 ? '' : `
      <div class="tile-section">
        <div class="tile-section-head"><span>Today's activity</span></div>
        ${Object.keys(categoryBreakdown).sort((a,b)=>categoryBreakdown[b]-categoryBreakdown[a]).map(cat=>{
          const mins = categoryBreakdown[cat];
          const pct = Math.round((mins/categoryTotal)*100);
          return `<div class="tile-sched-row">
            <span class="tile-sched-time">${formatMinutesAsHM(mins)}</span>
            <span class="tile-sched-title"><span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${categoryColors[cat]||'#8a8468'};margin-right:6px;"></span>${escapeHtml(cat)} (${pct}%)</span>
          </div>`;
        }).join('')}
      </div>`;

  const bars = trend.map(t=>{
    const pct = t.totalMinutes>0 ? Math.max(Math.round((t.totalMinutes / maxDay) * 100), 4) : 0;
    const d = fromISODate(t.date);
    const dayLabel = d.toLocaleDateString(undefined,{weekday:'narrow'});
    const clickable = t.totalMinutes > 0;
    return `<div class="screentime-bar-col" style="${clickable?'cursor:pointer;':''}" title="${formatDateNice(t.date)}: ${formatMinutesAsHM(t.totalMinutes)}${clickable?' — click for details':''}" ${clickable?`onclick="openDayDrill('${m.id}','${t.date}')"`:''}>
      <div class="screentime-bar-track"><div class="screentime-bar-fill" style="height:${pct}%;background:${m.color};"></div></div>
      <div class="screentime-bar-label">${dayLabel}</div>
    </div>`;
  }).join('');

  return `
    <div class="person-tile ${anyStale?'person-tile-attention':''}" style="border-top-color:${m.color};">
      <div class="tile-header">
        <span class="profile-avatar" style="background:${m.color};width:38px;height:38px;font-size:14px;">${initials(m.name)}</span>
        <div>
          <div class="tile-name">${escapeHtml(m.name)}</div>
          <div class="tile-role">Today: ${formatMinutesAsHM(todayTotal)}</div>
        </div>
      </div>
      <div class="tile-section">
        <div class="tile-section-head"><span>Devices</span></div>
        ${deviceRows}
      </div>
      ${categorySection}
      <div class="tile-section">
        <div class="tile-section-head"><span>Last ${ui.deviceUsageDays} days</span></div>
        <div class="screentime-bars">${bars}</div>
      </div>
    </div>`;
}

function renderPendingApprovals(){

  const itemRows = pendingShopItems.map(i=>{

        <button class="btn primary" style="padding:7px 12px;font-size:11.5px;" onclick="approvePendingShopItem('${i.id}')">Approve</button>
      </div>
    </div>`;
  }).join('');

  const tripRows = pendingTrips.map(t=>{
    const m = memberById(t.memberId);
    return `<div class="approval-row">
      <div>
        <div class="trip-title">${escapeHtml(t.name)} <span class="trip-pending-badge">Trip</span></div>
        <div class="trip-meta">${formatDateNice(t.date)} · ${m?escapeHtml(m.name):''} · ${(t.items||[]).length} item${(t.items||[]).length===1?'':'s'}</div>

      </div>
    </div>`;
  }).join('');

  return `

      <h3>Pending approval (${total})</h3>
      <p style="font-size:12.5px;color:#5c5847;margin-top:0;">Things kids have added, waiting for a parent to approve before they go live.</p>
      ${choreRows}${itemRows}${tripRows}
    </div>`;
}

  const recurrenceEndDate = editing? (editing.recurrenceEndDate || '') : '';
  const onceDate = editing? (editing.date || occurrenceDate) : occurrenceDate;
  const start = editing? editing.start : (pre.start!=null? pre.start : 540);

function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function initials(name){
  return (name||'?').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
}

async function fetchDeviceUsage(){
  if(!state.family) return;
  if(state.family.isExample){
    const demo = buildDefaultDeviceUsage();
    ui.deviceUsageData = demo.usage;
    ui.deviceInfoData = demo.devices;
    ui.categoryUsageData = demo.categoryUsage;
    ui.deviceUsageError = null;
    ui.deviceUsageLoading = false;
    render();
    return;
  }
  if(hasClaudeStorage){
    ui.deviceUsageData = [];
    ui.deviceInfoData = [];
    ui.categoryUsageData = [];
    ui.deviceUsageError = 'Screen time reporting needs the deployed backend — not available while running inside Claude.';
    render();
    return;
  }
  ui.deviceUsageLoading = true;
  ui.deviceUsageError = null;
  render();
  try{
    const res = await tracklineAuth.fetch(`${DEVICE_USAGE_ENDPOINT}?familyId=${encodeURIComponent(state.family.id)}&days=${ui.deviceUsageDays}`);
    if(!res.ok){
      const err = await res.json().catch(()=>({}));
      ui.deviceUsageError = err.error || 'Could not load screen time data.';
      ui.deviceUsageData = [];
      ui.deviceInfoData = [];
      ui.categoryUsageData = [];
    } else {
      const result = await res.json();
      ui.deviceUsageData = result.usage || [];
      ui.deviceInfoData = result.devices || [];
      ui.categoryUsageData = result.categoryUsage || [];
    }
  } catch(e){
    ui.deviceUsageError = 'Could not reach the server. Check your connection and try again.';
    ui.deviceUsageData = [];
    ui.deviceInfoData = [];
    ui.categoryUsageData = [];
  }
  ui.deviceUsageLoading = false;
  render();
}
function refreshDeviceUsage(){
  ui.deviceUsageData = null;
  fetchDeviceUsage();
}

// Curriculum content (subjects/topics/questions) is global — mirrors fetchDeviceUsage's
// shape exactly, including the same three fallback branches, since it's the same
// "shared/external data, not owned by one family" situation.
async function fetchStudyTopics(){
  if(hasClaudeStorage || (state.family && state.family.isExample)){
    ui.studySubjects = DEMO_STUDY_SUBJECTS;
    ui.studyTopics = DEMO_STUDY_TOPICS;
    ui.studyError = hasClaudeStorage ? 'Showing 6 pilot topics — full curriculum needs the deployed backend.' : null;
    ui.studyLoading = false;
    render();
    return;
  }
  ui.studyLoading = true;
  ui.studyError = null;
  render();
  try{
    const kid = memberById(ui.kidId);
    const yearLevel = kid ? kid.yearLevel : null;
    const res = await tracklineAuth.fetch(`${STUDY_TOPICS_ENDPOINT}?yearLevel=${encodeURIComponent(yearLevel||'')}`);
    if(!res.ok){
      const err = await res.json().catch(()=>({}));
      ui.studyError = err.error || 'Could not load study content.';
      ui.studySubjects = []; ui.studyTopics = [];
    } else {
      const result = await res.json();
      ui.studySubjects = result.subjects || [];
      ui.studyTopics = result.topics || [];
    }
  } catch(e){
    ui.studyError = 'Could not reach the server. Check your connection and try again.';
    ui.studySubjects = []; ui.studyTopics = [];
  }
  ui.studyLoading = false;
  render();
}

// Builds a demo week from the 6 pilot topics only - real weeks come from
// study_assignments rows generated by the term-wise algorithm server-side.
// Day pattern mirrors the agreed Term-planning pattern: Maths/English most days, Science 2-3x/week.
function demoWeekAssignments(kidId, weekOffset){
  const pattern = [['sub-math','sub-eng'],['sub-sci','sub-eng'],['sub-math','sub-sci'],['sub-eng','sub-math'],['sub-sci','sub-eng']];
  const monday = addDays(mondayOf(todayISO()), weekOffset*7);
  const cursor = {};
  return pattern.map((subjIds, i)=>{
    const date = toISODate(addDays(monday, i));
    const items = subjIds.map(subjId=>{
      const topics = DEMO_STUDY_TOPICS.filter(t=>t.subjectId===subjId);
      const idx = (cursor[subjId]||0) % topics.length;
      cursor[subjId] = (cursor[subjId]||0) + 1;
      const t = topics[idx];
      const subj = DEMO_STUDY_SUBJECTS.find(s=>s.id===subjId);
      return {subjectId:subjId, subjectName:subj.name, topicId:t.id, topicName:t.name, status:topicStatus(kidId,t.id)};
    });
    return {date, dayLabel:['Mon','Tue','Wed','Thu','Fri'][i], items};
  });
}
function demoOverdueForKid(kidId){
  // Demo stand-in: any pilot topic already marked 'reassigned' for this kid is
  // treated as "was assigned earlier, still not passed" - a real backend
  // computes this from assigned_date < today AND status != completed instead.
  return DEMO_STUDY_TOPICS
    .filter(t=>topicStatus(kidId, t.id)==='reassigned')
    .map(t=>{
      const subj = DEMO_STUDY_SUBJECTS.find(s=>s.id===t.subjectId);
      return {date:null, subjectName:subj.name, topicId:t.id, topicName:t.name, status:'reassigned'};

}
function weekCacheKey(kidId, weekOffset){ return kidId+'|'+weekOffset; }
function weekOffsetForDate(dateISO){
  const targetMonday = mondayOf(dateISO);
  const thisMonday = mondayOf(todayISO());
  return Math.round((new Date(targetMonday) - new Date(thisMonday)) / (7*86400000));
}
function getStudyWeekDays(kidId, weekOffset){

// Fetches one kid's one week of assignments (+ that kid's overdue list, which
// the backend always returns regardless of which week was requested) and
// writes both into the shared caches. Study tab, Kid View and Parent View all
// call this the same way - whichever view asks first populates it for the rest.
async function fetchStudyAssignments(kidId, weekOffset){
  if(!kidId) return;
  const key = weekCacheKey(kidId, weekOffset);
  if(ui.studyWeekLoading[key]) return;
  ui.studyWeekLoading[key] = true;
  ui.studyWeekError[key] = null;
  render();

  if(hasClaudeStorage || (state.family && state.family.isExample)){
    ui.studyWeekCache[key] = demoWeekAssignments(kidId, weekOffset);
    ui.studyOverdueByKid[kidId] = demoOverdueForKid(kidId);
    ui.studyWeekError[key] = hasClaudeStorage ? 'Showing a demo week from the 6 pilot topics — real term scheduling needs the deployed backend.' : null;
    ui.studyWeekLoading[key] = false;
    render();
    return;
  }
  try{
    const res = await tracklineAuth.fetch(`${STUDY_ASSIGNMENTS_ENDPOINT}?familyId=${encodeURIComponent(state.family.id)}&kidId=${encodeURIComponent(kidId)}&weekOffset=${weekOffset}`);
    if(!res.ok){
      const err = await res.json().catch(()=>({}));
      ui.studyWeekError[key] = err.error || 'Could not load this week\'s assignments.';
      ui.studyWeekCache[key] = [];
    } else {
      const result = await res.json();
      ui.studyWeekCache[key] = result.days || [];
      ui.studyOverdueByKid[kidId] = result.overdue || [];
    }
  } catch(e){
    ui.studyWeekError[key] = 'Could not reach the server. Check your connection and try again.';
    ui.studyWeekCache[key] = [];
  }
  ui.studyWeekLoading[key] = false;
  render();
}
// Called by Kid View / Parent View, which don't manage a week-offset selector
// themselves - they just want "whatever week this date falls in", fetching
// lazily and silently if it isn't cached yet (render() re-runs once it lands).
function ensureStudyWeekForDate(kidId, dateISO){
  if(!kidId) return null;
  const wOff = weekOffsetForDate(dateISO);
  const days = getStudyWeekDays(kidId, wOff);
  if(days===null && !ui.studyWeekLoading[weekCacheKey(kidId, wOff)]){
    fetchStudyAssignments(kidId, wOff);
  }
  return days;
}
function studyItemsForDate(kidId, dateISO){
  const days = ensureStudyWeekForDate(kidId, dateISO);
  if(!days) return null; // null = still loading, distinct from [] = loaded but empty
  const day = days.find(d=>d.date===dateISO);
  return day ? day.items : [];
}
function ensureStudyOverdue(kidId){
  if(!kidId) return null;
  if(ui.studyOverdueByKid[kidId]===undefined){
    // piggybacks on the current week's fetch, which always returns overdue too
    ensureStudyWeekForDate(kidId, todayISO());
    return null;
  }
  return ui.studyOverdueByKid[kidId];
}

// Jump into a topic's study/exam view from Kid View, Parent View, or an
// overdue banner - not just from inside the Study tab itself.
// Called from the "Save & generate schedule" button in Settings. Does the
// whole flow server-side in one call: saves year_level directly (bypassing
// the family-data blob, which is what was silently dropping it), wipes any
// existing schedule for this kid, and generates a fresh one - no manual
// curl/Postman step required.
async function saveYearLevelAndGenerate(kidId){
  if(!isParentLoggedIn()) return;
  const select = document.getElementById('yearlevel-select-'+kidId);
  const yearLevel = select ? select.value : null;
  if(!yearLevel){ showAlert('Choose a year level first.'); return; }
  const kid = memberById(kidId);
  if(!kid) return;

  if(hasClaudeStorage || (state.family && state.family.isExample)){
    // Demo mode has no real backend to call - just reflect the choice locally
    // so the Study tab picks it up, consistent with how the rest of demo mode works.
    updateMember(kidId, 'yearLevel', yearLevel);
    showAlert('Year level set locally. Schedule generation needs the deployed backend.');
    return;
  }

  ui.yearLevelSaving = kidId; render();
  try{
    const res = await tracklineAuth.fetch(STUDY_SET_YEAR_LEVEL_ENDPOINT, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        familyId: state.family.id, kidId, yearLevel,
        calendarYear: new Date().getFullYear(),
      })
    });
    const result = await res.json().catch(()=>({}));
    if(!res.ok){
      showAlert(result.error || 'Could not save year level or generate the schedule.');
    } else {
      kid.yearLevel = yearLevel; // reflect locally so the Study tab shows the right curriculum immediately
      // clear cached weeks/overdue for this kid so the Study tab, Kid View and
      // Parent View all re-fetch the freshly-generated schedule instead of
      // showing stale (possibly now-wrong) cached data
      Object.keys(ui.studyWeekCache).forEach(k => { if(k.startsWith(kidId+'|')) delete ui.studyWeekCache[k]; });
      delete ui.studyOverdueByKid[kidId];
      ui.studyWeekOffset = 0;
      // The endpoint has saved the year level and assignments. Do not issue a
      // full-family write that can race unrelated changes or overwrite study data.
      if(result.warning){
        showAlert(result.warning);
      } else {
        showAlert(`Year level saved. Generated ${result.assignmentsCreated} scheduled sessions for this year.`);
      }
    }
  } catch(e){
    showAlert('Could not reach the server. Check your connection and try again.');
  }
  ui.yearLevelSaving = null;
  render();
}

function upsertTopicProgress(kidId, topicId, patch){
  let p = topicProgressFor(kidId, topicId);

        .then(async response=>{ if(!response.ok){ const error=await response.json(); throw new Error(error.error || 'Could not save study progress.'); } })
        .catch(error=>showAlert(error.message));

  } else saveData();
}

async function startStudyExam(topicId){
  // Real backend: fetch a sampled question set server-side (STUDY_EXAM_START_ENDPOINT)
  // so answers are never present in client-visible network responses.
  // Demo mode: sample straight from the embedded question array.
  if(hasClaudeStorage || (state.family && state.family.isExample)){

    ui.studyView = 'exam';
    render();
    return;
  }
  try{
    const res = await tracklineAuth.fetch(STUDY_EXAM_START_ENDPOINT, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({familyId: state.family.id, kidId: ui.kidId, topicId})});
    const result = await res.json();
    if(!res.ok) throw new Error(result.error || 'Could not start exam');
    ui.studyExamAttempt = {attemptId: result.attemptId, topicId, questions: result.questions, answers:{}};

function setExamAnswer(questionId, optionValue){
  if(!ui.studyExamAttempt) return;
  ui.studyExamAttempt.answers[questionId] = optionValue;
  render();
}
async function submitStudyExam(){
  const attempt = ui.studyExamAttempt;
  if(!attempt || !ui.kidId) return;
  const unanswered = attempt.questions.filter(q=>!(q.id in attempt.answers));
  if(unanswered.length){ showAlert(`Answer all ${attempt.questions.length} questions before submitting.`); return; }
  ui.studyExamSubmitting = true; render();

  if(hasClaudeStorage || (state.family && state.family.isExample)){
    const topic = ui.studyTopics.find(t=>t.id===attempt.topicId);
    let correct = 0;
    topic.questions.forEach(q=>{ if(attempt.answers[q.id]===q.answer) correct++; });
    const score = Math.round((correct/topic.questions.length)*100);
    finishExamScoring(attempt.topicId, score, correct, topic.questions.length);
    return;
  }
  try{
    const res = await tracklineAuth.fetch(STUDY_EXAM_SUBMIT_ENDPOINT, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({familyId: state.family.id, kidId: ui.kidId, topicId: attempt.topicId, attemptId: attempt.attemptId, answers: attempt.answers})
    });
    const result = await res.json();
    if(!res.ok) throw new Error(result.error || 'Could not submit exam');
    finishExamScoring(attempt.topicId, result.score, result.correctCount, result.total);
  } catch(e){
    ui.studyExamSubmitting = false;
    showAlert('Could not submit the exam. Check your connection and try again.');
    render();
  }
}
function finishExamScoring(topicId, score, correctCount, total){
  // 70% threshold matches the reassignment logic agreed earlier — pure client logic
  // in demo mode; the real backend applies the same rule server-side.
  const newStatus = score >= 70 ? 'completed' : 'reassigned';
  upsertTopicProgress(ui.kidId, topicId, {
    status: newStatus, examScore: score, examCompletedAt: new Date().toISOString(),
    attemptCount: (topicProgressFor(ui.kidId, topicId)?.attemptCount||0) + 1
  });
  ui.studyExamResult = {score, correctCount, total, passed: score>=70};
  ui.studyExamSubmitting = false;
  ui.studyView = 'topics';
  render();
}

const SYNC_STALE_THRESHOLD_MINUTES = 90; // agent syncs every 30 min per design; this allows a couple of missed cycles before flagging

function deviceSyncStatus(device){
  if(!device.lastSyncAt) return { status:'never', label:'Never synced yet' };
  const lastSync = new Date(device.lastSyncAt);
  const minutesAgo = (Date.now() - lastSync.getTime()) / 60000;
  if(minutesAgo > SYNC_STALE_THRESHOLD_MINUTES){
    return { status:'stale', label:`No data since ${formatSyncTimeLabel(lastSync)}`, minutesAgo };
  }
  return { status:'ok', label:`Synced ${minutesAgoLabel(minutesAgo)}`, minutesAgo };
}
function minutesAgoLabel(minutesAgo){
  if(minutesAgo < 1) return 'just now';
  if(minutesAgo < 60) return `${Math.round(minutesAgo)} min ago`;
  return `${Math.round(minutesAgo/60)}h ago`;
}
function formatSyncTimeLabel(dateObj){
  const iso = toISODate(dateObj);
  return `${formatDateNice(iso)}, ${minToLabel(dateObj.getHours()*60 + dateObj.getMinutes())}`;
}

function dailyTotalsForMember(memberId, days){
  const totals = {};
  deviceUsageForMember(memberId).forEach(u=>{ totals[u.date] = (totals[u.date]||0) + u.minutesUsed; });
  const result = [];

  if(m===0) return `${h}h`;
  return `${h}h ${m}m`;
}

function submitLogin(){
  const m = memberById(ui.loginMemberId);
  if(!m) return;

  const attempt = ui.loginAttempts[m.id] || {count:0, lockedUntil:null};
  if(attempt.lockedUntil && Date.now() < attempt.lockedUntil){
    const secondsLeft = Math.ceil((attempt.lockedUntil - Date.now())/1000);
    ui.loginError = `Too many incorrect attempts. Try again in ${secondsLeft}s.`;
    render();
    return;
  }

  const pin = (document.getElementById('pin_input').value||'').trim();

  if(!/^\d{4}$/.test(pin)){
    ui.loginError = 'PIN must be exactly 4 digits.';
    render();
    return;
  }

  if(ui.loginMode==='create'){
    const confirm = (document.getElementById('pin_confirm').value||'').trim();
    if(pin !== confirm){
      ui.loginError = 'PINs don\u2019t match. Try again.';
      render();
      return;
    }
    m.pinHash = simpleHash(pin);
    saveData();
  } else {
    if(simpleHash(pin) !== m.pinHash){
      attempt.count = (attempt.count||0) + 1;
      if(attempt.count >= 5){
        const lockSeconds = Math.min(30 * Math.pow(2, attempt.count-5), 300);
        attempt.lockedUntil = Date.now() + lockSeconds*1000;
        ui.loginError = `Too many incorrect attempts. Locked for ${lockSeconds}s.`;
      } else {
        ui.loginError = `Incorrect PIN. ${5-attempt.count} attempt${5-attempt.count===1?'':'s'} left before a short lockout.`;
      }
      ui.loginAttempts[m.id] = attempt;
      render();
      return;
    }
  }

  // success — reset the attempt counter for this member
  ui.loginAttempts[m.id] = {count:0, lockedUntil:null};

  ui.profileId = m.id;
  ui.authenticated = true;
  ui.loginOpen = false;
  ui.loginError = null;
  if(m.role==='kid'){
    ui.kidId = m.id;
    ui.tab = 'kid'; // kids land on their own day, not the board/parent view
  } else {
    ui.tab = 'parent'; // parents land on Parent View, not the generic Week Board
  }
  render();
}

async function submitJoinFamily(){
  const familyId = (document.getElementById('jf_familyId').value||'').trim().toUpperCase();
  const password = document.getElementById('jf_password').value||'';

  if(!familyId || !password){
    ui.joinError = 'Enter both the Family ID and the family password.';
    render();
    return;
  }

  if(hasClaudeStorage){
    ui.joinError = 'Joining another family isn\u2019t applicable while running inside Claude — each Claude account already has its own separate space.';
    render();
    return;
  }

  ui.joinError = null;
  render(); // clear any previous error while the lookup runs

  try{
    const res = await tracklineAuth.fetch(JOIN_FAMILY_ENDPOINT, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ familyId, passwordHash: simpleHash(password) })
    });
    if(!res.ok){
      const err = await res.json().catch(()=>({}));
      ui.joinError = err.error || 'No family found with that ID. Double-check it and try again.';
      render();
      return;
    }
    const data = await res.json();
    if(!data || !data.family){
      ui.joinError = 'No family found with that ID. Double-check it and try again.';
      render();
      return;
    }

    // success — link this browser to that family and load its data
    window.localStorage.setItem(LOCAL_FAMILY_ID_KEY, familyId);
    state = data;
    ui.joinFamilyMode = false;
    ui.joinError = null;
    render();
  } catch(e){
    ui.joinError = 'Can\u2019t reach the server right now — check your internet connection and try again.';
    render();
  }
}

function render(){
  // Every render() call fully replaces root.innerHTML — including <main>,
  // the app's one scroll container — so a brand-new <main> always starts
  // at scrollTop 0. Without this, any action that re-renders (which is
  // nearly everything — clicking Apply in Settings, adding a member,
  // anything) silently snaps the page back to the top. Capturing and
  // restoring scroll position around the render, rather than inside it,
  // means every current AND future early-return branch in _renderInner
  // is covered automatically, with zero changes needed to any of them.
  const prevMain = document.querySelector('main');
  const prevScrollTop = prevMain ? prevMain.scrollTop : 0;
  _renderInner();
  const newMain = document.querySelector('main');
  if(newMain) newMain.scrollTop = prevScrollTop;

    const p = memberById(ui.profileId);

  }

function colClick(evt, memberId){
  if(evt.target.closest('.block')) return; // clicked an existing block, ignore
  if(!requireAuth()) return;
  const rect = evt.currentTarget.getBoundingClientRect();
  const y = evt.clientY - rect.top;
  let mins = DAY_START + Math.round((y/PX_PER_MIN)/15)*15;
  mins = Math.max(DAY_START, Math.min(mins, DAY_END-30));
  openAdd({memberId, start:mins});
}

function saveEvent(){
  if(!isParentLoggedIn()) return;
  if(ui.editingId && !isParentLoggedIn()) return; // editing existing: parent only
  if(!ui.editingId && !isLoggedIn()) return; // creating new: must be logged in
  const title = document.getElementById('f_title').value.trim() || 'Untitled';
  const memberId = document.getElementById('f_member').value;
  const recurrence = currentRecurMode();
  const start = timeInputToMin(document.getElementById('f_start').value);
  let end = timeInputToMin(document.getElementById('f_end').value);
  const location = document.getElementById('f_location').value.trim();
  const notes = document.getElementById('f_notes').value.trim();
  const needsDrive = document.getElementById('f_needsDrive').checked;
  const driverId = needsDrive? document.getElementById('f_driver').value : null;
  const travelMin = needsDrive? parseInt(document.getElementById('f_travel').value||'0',10) : 0;
  const color = document.getElementById('f_color').value;

  if(end<=start){ end = start+30; }

  let days, date, recurrenceEndDate;
  if(recurrence==='weekly'){
    days = [];
    document.querySelectorAll('.f_activity_day').forEach(cb=>{ if(cb.checked) days.push(parseInt(cb.value,10)); });
    if(days.length===0) days = [dowMonIndexed(selectedDateISO())]; // safety net — never save a weekly activity with no days selected
    date = null;
    const endVal = document.getElementById('f_recurrenceEndDate').value;
    recurrenceEndDate = endVal || null;
  } else {
    date = document.getElementById('f_date').value;
    days = [dowMonIndexed(date)];
    recurrenceEndDate = null;
  }

  if(ui.editingId){
    const ev = state.events.find(e=>e.id===ui.editingId);
    Object.assign(ev, {title,memberId,recurrence,days,date,start,end,location,notes,needsDrive,driverId,travelMin,color,recurrenceEndDate});
    delete ev.day; // clear the legacy single-day field so eventDayList() reads the new `days` array, not a stale single value
    if(recurrence==='once'){ ev.skipDates = []; }
  } else {
    state.events.push({id:cid(), title,memberId,recurrence,days,date,skipDates:[],start,end,location,notes,needsDrive,driverId,travelMin,color,recurrenceEndDate});
  }
  addToActivityLibrary(title);
  saveData();
  closeModal();
}
function deleteEvent(){
  if(!isParentLoggedIn()) return;
  const removed = state.events.find(e=>e.id===ui.editingId);
  state.events = state.events.filter(e=>e.id!==ui.editingId);
  saveData();
  closeModal();
  if(removed){
    showUndoToast(`"${removed.title}" deleted.`, ()=>{
      state.events.push(removed);
      saveData();
      render();
    });
  }
}
function skipOccurrence(){
  if(!isParentLoggedIn()) return;
  const ev = state.events.find(e=>e.id===ui.editingId);
  if(ev && ui.editingOccurrenceDate){
    ev.skipDates = ev.skipDates || [];
    if(!ev.skipDates.includes(ui.editingOccurrenceDate)) ev.skipDates.push(ui.editingOccurrenceDate);
    saveData();
  }
  closeModal();
}

function renderRescheduleModal(){
  if(!ui.rescheduleModalOpen) return '';
  const ev = state.events.find(e=>e.id===ui.editingId);
  if(!ev) return '';
  const originalDate = ui.editingOccurrenceDate;
  return `
  <div class="overlay" onclick="if(event.target===this) closeReschedule()">
    <div class="modal" style="max-width:360px;">
      <h2>Reschedule this occurrence</h2>
      <p style="font-size:13px;color:#5c5847;margin:0 0 16px;">Moves just ${formatDateNice(originalDate)}'s "${escapeHtml(ev.title)}" — the rest of the series is unaffected.</p>
      <div class="field">
        <label>New date</label>
        <input type="date" id="f_resched_date" value="${originalDate}">
      </div>
      <div class="row2">
        <div class="field">
          <label>New start</label>
          <input type="time" id="f_resched_start" value="${minToTimeInput(ev.start)}">
        </div>
        <div class="field">
          <label>New end</label>
          <input type="time" id="f_resched_end" value="${minToTimeInput(ev.end)}">
        </div>
      </div>
      <div class="modal-actions">
        <div></div>
        <div style="display:flex;gap:8px;">
          <button class="btn ghost" onclick="closeReschedule()">Cancel</button>
          <button class="btn primary" onclick="saveReschedule()">Move it</button>
        </div>
      </div>
    </div>
  </div>`;
}
function saveReschedule(){
  if(!isParentLoggedIn()) return;
  const ev = state.events.find(e=>e.id===ui.editingId);
  if(!ev) return;
  const originalDate = ui.editingOccurrenceDate;
  const newDate = document.getElementById('f_resched_date').value || originalDate;
  let newStart = timeInputToMin(document.getElementById('f_resched_start').value);
  let newEnd = timeInputToMin(document.getElementById('f_resched_end').value);
  if(newEnd<=newStart) newEnd = newStart+30;

  ev.skipDates = ev.skipDates || [];
  if(!ev.skipDates.includes(originalDate)) ev.skipDates.push(originalDate);

  ev.occurrenceOverrides = ev.occurrenceOverrides || [];
  ev.occurrenceOverrides.push({id:cid(), originalDate, newDate, newStart, newEnd});

  saveData();
  closeReschedule();
  closeModal();
}
function cancelReschedule(overrideId){
  if(!isParentLoggedIn()) return;
  const ev = state.events.find(e=>e.id===ui.editingId);
  if(!ev) return;
  const override = (ev.occurrenceOverrides||[]).find(o=>o.id===overrideId);
  if(!override) return;
  ev.occurrenceOverrides = (ev.occurrenceOverrides||[]).filter(o=>o.id!==overrideId);
  ev.skipDates = (ev.skipDates||[]).filter(d=>d!==override.originalDate);
  saveData();
  closeModal();
}

function saveTrip(){
  if(!isLoggedIn()) return;
  const isEdit = !!ui.editingTripId;
  if(!isEdit && !isParentLoggedIn() && !kidsCanAddShopping()){
    showAlert('Adding shopping trips is currently turned off for kids — ask a parent to add this, or to turn it back on in Settings.');
    return;
  }
  if(isEdit && !isParentLoggedIn()) return; // editing is parent-only

  const name = document.getElementById('f_trip_name').value.trim() || 'Shopping trip';
  const date = document.getElementById('f_trip_date').value || todayISO();
  const time = document.getElementById('f_trip_time').value || null;
  const memberId = document.getElementById('f_trip_member').value;
  const choreId = document.getElementById('f_trip_chore').value || null;

  if(isEdit){
    const trip = (state.shoppingTrips||[]).find(t=>t.id===ui.editingTripId);
    if(!trip) return;
    Object.assign(trip, {name, date, time, memberId, choreId});
    saveData();
    pushTrip(trip);
    closeTripModal();
    render();
    return;
  }

  const items = [];
  const addedNames = new Set();
  document.querySelectorAll('.f_trip_quickitem').forEach(cb=>{
    if(cb.checked){
      const idx = parseInt(cb.value,10);
      const src = (state.shoppingList||[])[idx];
      if(src && !addedNames.has(src.name.toLowerCase())){
        items.push({id:cid(), name: src.name, status:'pending'});
        addedNames.add(src.name.toLowerCase());
      }
    }
  });
  const newItemsRaw = (document.getElementById('f_trip_new_items').value||'').trim();
  if(newItemsRaw){
    newItemsRaw.split(',').map(s=>s.trim()).filter(Boolean).forEach(itemName=>{
      if(!addedNames.has(itemName.toLowerCase())){
        items.push({id:cid(), name: itemName, status:'pending'});
        addedNames.add(itemName.toLowerCase());
        addToShoppingItemLibrary(itemName);
      }
    });
  }

  const pendingApproval = !isParentLoggedIn();
  const trip = {id:cid(), choreId, name, date, time, memberId, status:'open', pendingApproval, items, createdBy: ui.profileId, createdAt: new Date().toISOString()};
  state.shoppingTrips = state.shoppingTrips || [];
  state.shoppingTrips.push(trip);
  saveData();
  pushTrip(trip);
  ui.quickListSelectMode = false;
  ui.selectedQuickListIds = [];
  closeTripModal();
  openTripDetail(trip.id);
}
function addToShoppingItemLibrary(name){
  const exists = (state.shoppingItemLibrary||[]).some(n=>n.toLowerCase()===name.toLowerCase());
  if(!exists){
    state.shoppingItemLibrary = state.shoppingItemLibrary || [];
    state.shoppingItemLibrary.push(name);
  }
}
function addTripItem(tripId){
  if(!isParentLoggedIn()) return;
  const input = document.getElementById('newTripItem');
  const name = (input.value||'').trim();
  if(!name) return;
  const trip = (state.shoppingTrips||[]).find(t=>t.id===tripId);
  if(!trip) return;
  trip.items = trip.items || [];
  trip.items.push({id:cid(), name, status:'pending'});
  addToShoppingItemLibrary(name);
  saveData();
  pushTrip(trip);
  render();
  const el = document.getElementById('newTripItem');

}

function cycleTripItemStatus(tripId, itemId){
  if(!isParentLoggedIn()) return;
  const trip = (state.shoppingTrips||[]).find(t=>t.id===tripId);
  if(!trip) return;
  const item = (trip.items||[]).find(i=>i.id===itemId);
  if(!item) return;
  const order = ['pending','bought','unavailable'];
  const idx = order.indexOf(item.status||'pending');
  item.status = order[(idx+1)%order.length];
  saveData();
  pushTrip(trip);
  render();

async function saveChore(){
  if(ui.editingChoreId && !isParentLoggedIn()) return; // editing existing: parent only
  if(!ui.editingChoreId && !isLoggedIn()) return; // creating new: must be logged in
  if(!ui.editingChoreId && !isParentLoggedIn() && !kidsCanAddTasks()){
    showAlert('Adding tasks is currently turned off for kids — ask a parent to add this, or to turn it back on in Settings.');
    return;
  }

  const today = todayISO();
  const title = document.getElementById('f_chore_title').value.trim() || 'Untitled task';
  const memberId = document.getElementById('f_chore_member').value;
  const frequency = document.getElementById('f_chore_frequency').value;
  let days = [];
  if(frequency==='weekly' || frequency==='fortnightly'){
    document.querySelectorAll('.f_chore_day').forEach(cb=>{ if(cb.checked) days.push(parseInt(cb.value,10)); });
  }
  const dayOfMonth = frequency==='monthly' ? Math.min(31, Math.max(1, parseInt(document.getElementById('f_chore_dayOfMonth').value||'1',10))) : null;

  let startDate = null, dueDate = null;
  if(frequency==='daily' || frequency==='weekly' || frequency==='fortnightly' || frequency==='monthly'){
    startDate = document.getElementById('f_chore_startDate').value || today;
    if(startDate < today) startDate = today; // never allow a past start date, regardless of what the field held
  }
  if(frequency==='once'){
    dueDate = document.getElementById('f_chore_dueDate').value || today;
    if(dueDate < today) dueDate = today; // a one-off task can't be due in the past either
  }
  const dueTime = document.getElementById('f_chore_dueTime').value || null;
  const points = Math.max(0, Math.min(100, parseInt(document.getElementById('f_chore_points').value||'0',10) || 0));

  if(!isParentLoggedIn()){
    if(ui.savingChildTask) return;
    ui.savingChildTask = true;
    try {
      const response = await tracklineAuth.fetch(API_BASE+'/api/child-task', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({familyId:state.family.id, title, frequency, days, dayOfMonth, startDate, dueDate, dueTime})});
      const result = await response.json();
      if(!response.ok) throw new Error(result.error || 'Could not save your task.');
      state.chores.push(result.task);
      closeChoreModal();
    } catch(error){ showAlert(error.message); }
    finally { ui.savingChildTask = false; }
    return;
  }

  if(ui.editingChoreId){
    const c = state.chores.find(c=>c.id===ui.editingChoreId);
    Object.assign(c, {title, memberId, frequency, days, dayOfMonth, startDate, dueDate, dueTime, points, active:true});
  } else {
    const pendingApproval = !isParentLoggedIn(); // kid-created tasks wait for a parent to approve
    state.chores.push({id:cid(), title, memberId, frequency, days, dayOfMonth, startDate, dueDate, dueTime, points, active:true, pendingApproval});
  }
  addToChoreLibrary(title);
  saveData();
  closeChoreModal();
}
function deleteChore(){
  if(!isParentLoggedIn()) return;
  const removedChore = state.chores.find(c=>c.id===ui.editingChoreId);
  const removedLogs = state.choreLogs.filter(l=>l.choreId===ui.editingChoreId);
  state.chores = state.chores.filter(c=>c.id!==ui.editingChoreId);
  state.choreLogs = state.choreLogs.filter(l=>l.choreId!==ui.editingChoreId);
  saveData();
  removedLogs.forEach(l => deleteChoreLog(state.family.id, l.choreId, l.date));
  closeChoreModal();
  if(removedChore){
    showUndoToast(`"${removedChore.title}" deleted.`, ()=>{
      state.chores.push(removedChore);
      state.choreLogs.push(...removedLogs);
      saveData();
      removedLogs.forEach(l => pushChoreLog({familyId: state.family.id, ...l}));
      render();
    });
  }
}

function triggerCSVImport(type){
  if(!isParentLoggedIn()) return;
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.csv';
  input.onchange = function(e){
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = function(ev){ processCSVImport(type, ev.target.result); };
    reader.readAsText(file);
  };
  input.click();
}
function processCSVImport(type, text){
  const rows = csvRowsToObjects(parseCSV(text));
  const validator = type==='task' ? validateTaskImportRow : validateActivityImportRow;
  const results = rows.map(function(row){
    const r = validator(row, state.members);
    r.row = row;
    return r;
  });
  ui.csvImportType = type;
  ui.csvImportResults = results;
  ui.csvImportOpen = true;
  render();
}
function closeCSVImport(){
  ui.csvImportOpen = false;
  ui.csvImportResults = null;
  ui.csvImportType = null;
  render();
}
function confirmCSVImport(){
  if(!isParentLoggedIn()) return;
  const type = ui.csvImportType;
  const validResults = (ui.csvImportResults||[]).filter(function(r){ return r.valid; });
  validResults.forEach(function(r){
    if(type==='task'){
      state.chores.push(Object.assign({id:cid(), active:true, pendingApproval:false}, r.data));
      addToChoreLibrary(r.data.title);
    } else {
      state.events.push(Object.assign({id:cid(), skipDates:[]}, r.data));
      addToActivityLibrary(r.data.title);
    }
  });
  saveData();
  const count = validResults.length;
  const label = type==='task' ? (count===1?'task':'tasks') : (count===1?'activity':'activities');
  closeCSVImport();
  showAlert('Imported '+count+' '+label+'.');
}

  return '<div class="overlay" onclick="if(event.target===this) closeCSVImport()">'
    + '<div class="modal" style="max-width:460px;">'

    + '</p>'

    + '<div class="modal-actions" style="margin-top:6px;">'
    + '<button class="btn ghost" onclick="closeCSVImport()">Cancel</button>'

      <div class="modal-actions" style="margin-top:16px;">
        <div></div>
        <div style="display:flex;gap:8px;">
          <button class="btn ghost" onclick="closeExportModal()">Cancel</button>
          <button class="btn primary" onclick="submitExport()">Export</button>
        </div>
      </div>
    </div>
  </div>`;
}
function downloadExportFile(data){
  const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'trackline-backup.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
async function submitExport(){
  const pwd = (document.getElementById('f_export_password').value||'').trim();
  if(!pwd){ ui.exportError = 'Enter the family password.'; render(); return; }

  if(hasClaudeStorage){
    // No standalone backend endpoint exists in Claude-testing mode — fall back
    // to a direct export, still sanitized client-side for consistency.
    if(simpleHash(pwd) !== (state.family && state.family.passwordHash)){
      ui.exportError = 'Incorrect family password.';
      render();
      return;
    }
    const sanitized = JSON.parse(JSON.stringify(state));
    if(sanitized.family) delete sanitized.family.passwordHash;
    if(Array.isArray(sanitized.members)) sanitized.members.forEach(m=>{ delete m.pinHash; });
    downloadExportFile(sanitized);
    closeExportModal();
    return;
  }

  try{
    const res = await tracklineAuth.fetch(`${API_BASE}/api/export-family`, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ familyId: state.family.id, passwordHash: simpleHash(pwd) })
    });
    if(!res.ok){
      const err = await res.json().catch(()=>({}));
      ui.exportError = err.error || 'Export failed — check the password and try again.';
      render();
      return;
    }
    const result = await res.json();
    downloadExportFile(result.data);
    closeExportModal();
  } catch(e){
    ui.exportError = 'Could not reach the server. Check your connection and try again.';
    render();
  }
}
function importData(evt){
  if(!isParentLoggedIn()) return;
  const file = evt.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const parsed = JSON.parse(reader.result);
      if(parsed.members && parsed.events){
        parsed.events.forEach(e=>{
          if(!e.recurrence) e.recurrence = 'weekly';
          if(!('date' in e)) e.date = null;
          if(!e.skipDates) e.skipDates = [];
          if(!('notes' in e)) e.notes = '';
          if(!('occurrenceOverrides' in e)) e.occurrenceOverrides = [];
        });
        parsed.members.forEach(m=>{
          if(!('pinHash' in m)) m.pinHash = null;
          if(!('canAddTasks' in m)) m.canAddTasks = true;
          if(!('canAddShopping' in m)) m.canAddShopping = true;
          if(!('email' in m)) m.email = '';
          if(!('phone' in m)) m.phone = '';
          if(!('yearLevel' in m)) m.yearLevel = null;
        });
        if(!parsed.topicProgress) parsed.topicProgress = [];
        if(!parsed.family){ parsed.family = state.family || {id:cid(), name:'My Family', primaryHolderName:'', primaryHolderEmail:'', primaryHolderPhone:''}; }
        if(!parsed.chores) parsed.chores = [];
        parsed.chores.forEach(c=>{
          if(!('anchorDate' in c)) c.anchorDate = null;
          if(!('startDate' in c)) c.startDate = null; // null = unrestricted, preserves behavior for tasks that existed before this field
          if(!('dueDate' in c)) c.dueDate = null;
          if(!('dueTime' in c)) c.dueTime = null;
          if(!('points' in c)) c.points = 0;
        });
        if(!parsed.choreLogs) parsed.choreLogs = [];
        if(!parsed.choreLibrary){
          const fromExisting = [...new Set(parsed.chores.map(c=>c.title))];
          parsed.choreLibrary = fromExisting.length ? fromExisting : [];
        }
        if(!parsed.shoppingList) parsed.shoppingList = [];
        if(!parsed.shoppingTrips) parsed.shoppingTrips = [];
        if(!parsed.shoppingItemLibrary) parsed.shoppingItemLibrary = [];
        if(!parsed.activityLibrary) parsed.activityLibrary = [];
        state = parsed;
        ui.profileId = null; ui.authenticated = false; // PIN set may have changed — log out to be safe
        saveData();
        render();
        showAlert('Import complete. Please log in again.');
      } else {
        showAlert('This file does not look like a Trackline backup.');
      }
    }catch(e){ showAlert('Could not read that file.'); }
  };
  reader.readAsText(file);
}
function resetDefaults(){
  if(!isParentLoggedIn()) return;
  showConfirm('Reset to the example data? This replaces your current schedule and clears all PINs.', ()=>{
    state = {
      family: {id:genFamilyId(), name:'Example Family', primaryHolderName:'', primaryHolderEmail:'', primaryHolderPhone:'', passwordHash: simpleHash('demo1234'), isExample:true},
      members: JSON.parse(JSON.stringify(DEFAULT_MEMBERS)),
      events: JSON.parse(JSON.stringify(DEFAULT_EVENTS)),
      chores: JSON.parse(JSON.stringify(DEFAULT_CHORES)),
      choreLogs: [],
      choreLibrary: JSON.parse(JSON.stringify(DEFAULT_CHORE_LIBRARY)),
      shoppingList: JSON.parse(JSON.stringify(DEFAULT_SHOPPING_LIST)),
      shoppingTrips: buildDefaultShoppingTrips(),
      shoppingItemLibrary: JSON.parse(JSON.stringify(DEFAULT_SHOPPING_ITEM_LIBRARY)),
      activityLibrary: JSON.parse(JSON.stringify(DEFAULT_ACTIVITY_LIBRARY)),
      topicProgress: []
    };
    ui.profileId = null; ui.authenticated = false;
    saveData();
    render();
  }, {danger:true});
}

applyDayModeClass();
tracklineAuth.init();
setInterval(()=>{ if(ui.tab==='board' && !ui.modalOpen) render(); }, 60000); // refresh now-line each minute — skipped while a modal is open, since a full render would silently wipe whatever's being typed into an open form
setInterval(checkAndFireNotificationReminders, 60000); // independent of tab/modal state — a reminder should fire even if you're not currently looking at the board
</script>
</body>

DEPLOYMENT NOTES — read this when you're ready to host Trackline outside Claude

WHAT WORKS AS-IS RIGHT NOW:
This file is fully self-contained (HTML + CSS + JS, no build step, no dependencies).
Drop it on Azure Web App, Azure Static Web Apps, Netlify, GitHub Pages, or any
static host, and it will run immediately. Once window.storage isn't available
(i.e. you're no longer inside a Claude artifact), it automatically falls back to
the browser's localStorage — no code changes required to go live.

THE ONE REAL LIMITATION OF localStorage HOSTING:
localStorage is per-browser, per-device. If you open this on the family tablet
AND on a kid's laptop, they will NOT see the same schedule — each device keeps
its own separate copy. For a single shared tablet used by the whole family,
that's often fine. For "everyone's device shows the same live schedule," it isn't.

WHAT'S NEEDED FOR TRUE MULTI-DEVICE SYNC (the next real step, if you want it):
 1. A backend API (e.g. Azure Functions, or a small Node/Express app on Azure
    Web App) with endpoints like GET/POST /api/family-data.
 2. A real database behind it (Azure SQL, Cosmos DB, or even Azure Table Storage
    for something this simple) instead of localStorage.
 3. Swap storageGet/storageSet (see top of the <script> block) to call that API
    with fetch() instead of localStorage — everything else in this file (all the
    UI, scheduling logic, permissions) stays the same, since it already only
    talks to storage through those two functions.
 4. Real login would move from the current PIN-in-the-browser model to actual
    server-side authentication (hashed + salted, checked server-side, session
    tokens) — the current PIN system is a lightweight device lock, not this.
 5. Actual email/SMS sending needs a provider wired into that same backend
    (e.g. SendGrid or Azure Communication Services for email, Twilio or Azure
    Communication Services for SMS) triggered from server-side code — never
    from the browser, since that would expose provider API keys publicly.

If/when you want to take that step, come back and I can help scaffold the
