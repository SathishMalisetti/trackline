const DEMO_STUDY_TOPICS = [
  { id:"t-math-01", subjectId:"sub-math", name:"Place value to tens of thousands", vcaaCode:"VCMNA152",
    studyContent:"Our number system is built on place value: each digit's position tells you its value. In 46,382 the 4 means 4 ten-thousands (40,000), the 6 means 6 thousands (6,000), and so on. You can compare numbers by looking at the biggest place value first - whichever number has more ten-thousands is bigger, and only if those match do you look at the next column.",
    questions:[{id:'q1',q:"In 58,204, what does the 5 represent?",options:["5 ten-thousands", "5 thousands", "5 hundreds", "5 ones"],answer:"5 ten-thousands"},{id:'q2',q:"Which number is largest?",options:["47,650", "46,999", "47,099", "46,850"],answer:"47,650"},{id:'q3',q:"What is 30,000 + 5,000 + 200 + 7 written as a number?",options:["35,207", "3,527", "35,270", "352,07"],answer:"35,207"},{id:'q4',q:"How many thousands are in 62,000?",options:["62", "6.2", "620", "6200"],answer:"62"},{id:'q5',q:"Order from smallest to largest: 12,450 / 12,045 / 12,504",options:["12,045, 12,450, 12,504", "12,450, 12,045, 12,504", "12,504, 12,450, 12,045", "12,045, 12,504, 12,450"],answer:"12,045, 12,450, 12,504"},{id:'q6',q:"What is the value of the 0 in 40,516?",options:["0 thousands", "0 hundreds", "0 tens", "0 ones"],answer:"0 thousands"}] },
  { id:"t-math-02", subjectId:"sub-math", name:"Decimal fractions: tenths and hundredths", vcaaCode:"VCMNA159",
    studyContent:"Numbers don't stop at the ones column! Just like 10 ones make a ten, we can split 1 whole into 10 equal pieces. Each piece is called a TENTH, and we write it as 0.1. If we split 1 whole into 100 equal pieces, each piece is a HUNDREDTH, written as 0.01. The dot is called a decimal point - it separates whole numbers from parts of a number. So 0.7 means 7 tenths (like 7 slices out of a pizza cut into 10 pieces), and the fraction 7/10 is exactly the same amount as the decimal 0.7. You can line decimals up in a place value grid: Ones . Tenths Hundredths - so 3.45 means 3 ones, 4 tenths, and 5 hundredths.",
    questions:[{id:'q1',q:"What is 3/10 written as a decimal?",options:["0.3", "0.03", "3.0", "30"],answer:"0.3"},{id:'q2',q:"In the number 5.62, what does the digit 6 represent?",options:["6 tenths", "6 hundredths", "6 ones", "6 tens"],answer:"6 tenths"},{id:'q3',q:"Which decimal is the same as 1/4?",options:["0.4", "0.25", "0.14", "0.40"],answer:"0.25"},{id:'q4',q:"Write 45 hundredths as a decimal.",options:["0.45", "4.5", "0.045", "45.0"],answer:"0.45"},{id:'q5',q:"Order from smallest to largest: 0.6, 0.06, 0.66",options:["0.06, 0.6, 0.66", "0.6, 0.06, 0.66", "0.66, 0.6, 0.06", "0.06, 0.66, 0.6"],answer:"0.06, 0.6, 0.66"},{id:'q6',q:"A ribbon is 0.8 metres long. What fraction of a metre is that?",options:["8/10", "8/100", "1/8", "8/1"],answer:"8/10"},{id:'q7',q:"What is 2 wholes and 3 tenths written as a decimal?",options:["2.3", "23.0", "0.23", "2.03"],answer:"2.3"},{id:'q8',q:"Which is larger: 0.5 or 0.45?",options:["0.5", "0.45", "They are equal", "Cannot tell"],answer:"0.5"},{id:'q9',q:"How many hundredths make one tenth?",options:["10", "100", "1", "5"],answer:"10"},{id:'q10',q:"Write 6/10 as a decimal.",options:["0.6", "0.06", "6.0", "0.16"],answer:"0.6"},{id:'q11',q:"A recipe uses 0.75 of a cup of flour. Write this as a fraction.",options:["75/100", "7/5", "3/4 is also correct - is it the same value?", "None of these"],answer:"75/100"},{id:'q12',q:"What is the value of the 4 in 12.45?",options:["4 tenths", "4 hundredths", "4 tens", "4 ones"],answer:"4 tenths"},{id:'q13',q:"Which fraction equals 0.2?",options:["1/5", "1/2", "2/100", "1/20"],answer:"1/5"}] },
  { id:"t-math-03", subjectId:"sub-math", name:"Simple equivalent fractions", vcaaCode:"VCMNA157",
    studyContent:"Equivalent fractions look different but represent the same amount - like 1/2 and 2/4, both mean 'half'. You can find an equivalent fraction by multiplying the top and bottom number by the same amount. Picture a pizza cut into 2 slices vs one cut into 4 slices - eating 1 of 2 slices is the same amount as eating 2 of 4 slices.",
    questions:[{id:'q1',q:"Which fraction is equivalent to 1/2?",options:["2/4", "1/4", "3/4", "1/3"],answer:"2/4"},{id:'q2',q:"Which fraction is equivalent to 2/3?",options:["4/6", "2/6", "3/6", "4/3"],answer:"4/6"},{id:'q3',q:"1/4 is equivalent to how many eighths?",options:["2/8", "1/8", "3/8", "4/8"],answer:"2/8"},{id:'q4',q:"Which pair is NOT equivalent?",options:["1/3 and 2/5", "1/3 and 2/6", "1/2 and 3/6", "2/3 and 4/6"],answer:"1/3 and 2/5"},{id:'q5',q:"If you cut a cake into 8 pieces and eat 4, what simpler fraction did you eat?",options:["1/2", "1/4", "3/8", "1/8"],answer:"1/2"},{id:'q6',q:"3/4 is equivalent to how many eighths?",options:["6/8", "5/8", "4/8", "3/8"],answer:"6/8"}] },
  { id:"t-math-04", subjectId:"sub-math", name:"Counting by halves, thirds, quarters", vcaaCode:"VCMNA158",
    studyContent:"You can count using fractions just like whole numbers. Counting by halves: 1/2, 1, 1 1/2, 2, 2 1/2... Counting by quarters: 1/4, 1/2, 3/4, 1, 1 1/4... These fit on a number line the same way whole numbers do - between 0 and 1 there's room for 1/4, 1/2, and 3/4, all in order.",
    questions:[{id:'q1',q:"What comes next: 1/4, 1/2, 3/4, ___?",options:["1", "1 1/4", "5/4", "2/4"],answer:"1"},{id:'q2',q:"What comes next counting by halves: 1/2, 1, 1 1/2, ___?",options:["2", "2 1/2", "1 3/4", "3"],answer:"2"},{id:'q3',q:"Which is bigger: 2/3 or 1/3?",options:["2/3", "1/3", "They are equal", "Cannot tell"],answer:"2/3"},{id:'q4',q:"On a number line between 0 and 1, where does 3/4 sit?",options:["Closer to 1 than to 0", "Exactly in the middle", "Closer to 0 than to 1", "At 0"],answer:"Closer to 1 than to 0"},{id:'q5',q:"Counting by thirds from 0: 1/3, 2/3, ___?",options:["1", "3/3", "4/3", "2"],answer:"1"},{id:'q6',q:"Which fraction sits exactly halfway between 0 and 1?",options:["1/2", "1/4", "3/4", "1/3"],answer:"1/2"}] },
  { id:"t-math-05", subjectId:"sub-math", name:"Odd/even numbers and multiple patterns (3,4,6,7,8,9)", vcaaCode:"VCMNA151,VCMNA154",
    studyContent:"Even numbers can be split into two equal groups with nothing left over (2, 4, 6, 8...); odd numbers always have one left over (1, 3, 5, 7...). A quick check: even numbers always end in 0, 2, 4, 6, or 8. Multiples follow patterns too - multiples of 3 are 3, 6, 9, 12...; multiples of 4 are 4, 8, 12, 16... Spotting these patterns helps with multiplication.",
    questions:[{id:'q1',q:"Which of these is an even number?",options:["48", "47", "53", "61"],answer:"48"},{id:'q2',q:"Which of these is odd?",options:["37", "36", "40", "22"],answer:"37"},{id:'q3',q:"What is the next multiple of 3 after 12?",options:["15", "14", "16", "13"],answer:"15"},{id:'q4',q:"Which number is a multiple of both 3 and 4?",options:["12", "9", "8", "10"],answer:"12"},{id:'q5',q:"What do all even numbers have in common?",options:["They can be split into two equal groups", "They always end in 5", "They are always bigger than 10", "They are always odd"],answer:"They can be split into two equal groups"},{id:'q6',q:"Which of these numbers is NOT a multiple of 6?",options:["16", "18", "24", "30"],answer:"16"}] },
  { id:"t-math-06", subjectId:"sub-math", name:"Multiplication facts to 10x10", vcaaCode:"VCMNA155",
    studyContent:"Multiplication is a fast way of adding the same number lots of times. 4 x 7 means '4 groups of 7' or '7 groups of 4' - either way, the answer is 28. Once you know a multiplication fact, you already know a division fact too! If 4 x 7 = 28, then 28 divided by 7 = 4, and 28 divided by 4 = 7. This is called a 'fact family'. Some tricks: multiplying by 10 just adds a zero (7 x 10 = 70). Multiplying by 9 - try the '10s trick': 9 x 6 is the same as (10 x 6) - 6 = 60 - 6 = 54. Doubling helps too: if you know 5 x 6 = 30, then 10 x 6 is just double that = 60.",
    questions:[{id:'q1',q:"What is 6 x 7?",options:["42", "36", "48", "40"],answer:"42"},{id:'q2',q:"What is 9 x 8?",options:["72", "81", "64", "63"],answer:"72"},{id:'q3',q:"If 5 x 6 = 30, what is 30 ÷ 6?",options:["5", "6", "24", "36"],answer:"5"},{id:'q4',q:"What is 8 x 8?",options:["64", "72", "56", "81"],answer:"64"},{id:'q5',q:"A box holds 7 apples. How many apples in 9 boxes?",options:["63", "56", "72", "16"],answer:"63"},{id:'q6',q:"What is 10 x 4?",options:["40", "14", "400", "4"],answer:"40"},{id:'q7',q:"What is 45 ÷ 9?",options:["5", "9", "4", "6"],answer:"5"},{id:'q8',q:"What is 7 x 7?",options:["49", "42", "56", "48"],answer:"49"},{id:'q9',q:"3 teams have 9 players each. How many players in total?",options:["27", "18", "12", "36"],answer:"27"},{id:'q10',q:"What is 9 x 9?",options:["81", "72", "90", "99"],answer:"81"},{id:'q11',q:"What is 6 x 6?",options:["36", "12", "42", "30"],answer:"36"},{id:'q12',q:"72 lollies are shared equally among 8 friends. How many each?",options:["9", "8", "7", "10"],answer:"9"}] },
  { id:"t-math-07", subjectId:"sub-math", name:"Related division facts", vcaaCode:"VCMNA155",
    studyContent:"Every multiplication fact has two matching division facts - together they're called a 'fact family'. If 6 x 4 = 24, then 24 ÷ 4 = 6 and 24 ÷ 6 = 4. Knowing your times tables well makes division much faster, because you're really just asking 'what do I multiply to get this number?'",
    questions:[{id:'q1',q:"If 7 x 8 = 56, what is 56 ÷ 8?",options:["7", "8", "48", "64"],answer:"7"},{id:'q2',q:"What is 45 ÷ 9?",options:["5", "6", "9", "4"],answer:"5"},{id:'q3',q:"What is 64 ÷ 8?",options:["8", "7", "9", "6"],answer:"8"},{id:'q4',q:"36 lollies shared equally among 6 friends - how many each?",options:["6", "5", "7", "36"],answer:"6"},{id:'q5',q:"If 9 x 6 = 54, which of these is also true?",options:["54 ÷ 6 = 9", "54 ÷ 6 = 8", "54 ÷ 9 = 5", "54 ÷ 6 = 10"],answer:"54 ÷ 6 = 9"},{id:'q6',q:"What is 81 ÷ 9?",options:["9", "8", "7", "11"],answer:"9"}] },
  { id:"t-math-08", subjectId:"sub-math", name:"Purchases and change (money)", vcaaCode:"VCMNA160",
    studyContent:"When you buy something, you often pay with more money than the price and get change back. To work out change, subtract the price from the amount you paid. For example, if something costs $3.65 and you pay with a $5 note, your change is $5.00 - $3.65 = $1.35. Adding up several prices before paying works the same way as regular addition, just with dollars and cents.",
    questions:[{id:'q1',q:"An item costs $2.50. You pay with $5. What is your change?",options:["$2.50", "$2.00", "$3.00", "$1.50"],answer:"$2.50"},{id:'q2',q:"Two items cost $1.20 and $2.35. What is the total?",options:["$3.55", "$3.45", "$3.65", "$3.05"],answer:"$3.55"},{id:'q3',q:"An item costs $6.80. You pay with $10. What is your change?",options:["$3.20", "$3.80", "$4.20", "$2.20"],answer:"$3.20"},{id:'q4',q:"You have $8.00 and buy something for $5.45. How much is left?",options:["$2.55", "$2.45", "$3.55", "$2.65"],answer:"$2.55"},{id:'q5',q:"Which combination makes exactly $1.00?",options:["50c + 20c + 20c + 10c", "50c + 20c + 10c", "20c + 20c + 20c", "$1 coin only is the only way"],answer:"50c + 20c + 20c + 10c"},{id:'q6',q:"An item costs $4.15. Which coins/notes could you use to pay exactly?",options:["A $5 note and get $0.85 change is one way, or exact coins totalling $4.15", "Only a $5 note works", "Only exact $4 notes work", "It cannot be paid exactly"],answer:"A $5 note and get $0.85 change is one way, or exact coins totalling $4.15"}] },
  { id:"t-math-09", subjectId:"sub-math", name:"Number patterns and simple algorithms", vcaaCode:"VCMNA161,VCMNA164",
    studyContent:"A number pattern follows a rule that tells you how to get from one number to the next. In 5, 10, 15, 20... the rule is 'add 5'. In 100, 90, 80... the rule is 'subtract 10'. Once you spot the rule, you can predict what comes next, or work backwards to find missing numbers earlier in the pattern.",
    questions:[{id:'q1',q:"What is the rule for 3, 6, 9, 12?",options:["Add 3", "Add 4", "Multiply by 2", "Subtract 3"],answer:"Add 3"},{id:'q2',q:"What comes next: 40, 35, 30, 25, ___?",options:["20", "15", "22", "24"],answer:"20"},{id:'q3',q:"What is the missing number: 7, 14, __, 28?",options:["21", "20", "22", "24"],answer:"21"},{id:'q4',q:"What is the rule for 2, 4, 8, 16?",options:["Multiply by 2", "Add 2", "Add 4", "Multiply by 4"],answer:"Multiply by 2"},{id:'q5',q:"What comes next: 100, 90, 80, ___?",options:["70", "75", "65", "60"],answer:"70"},{id:'q6',q:"What is the 6th number in the pattern starting 5, 10, 15...?",options:["30", "25", "35", "20"],answer:"30"}] },
  { id:"t-math-10", subjectId:"sub-math", name:"Measuring length, mass, capacity with scaled instruments", vcaaCode:"",
    studyContent:"We measure length with rulers or tape measures (in mm, cm, m), mass with scales (in g, kg), and capacity - how much liquid something holds - with measuring jugs (in mL, L). Reading a scaled instrument means finding where the pointer or line lands and reading the nearest marked value, just like reading a number line.",
    questions:[{id:'q1',q:"Which unit would you use to measure the mass of an apple?",options:["Grams", "Metres", "Litres", "Kilometres"],answer:"Grams"},{id:'q2',q:"Which unit would you use to measure how much water is in a bottle?",options:["Millilitres", "Grams", "Centimetres", "Kilograms"],answer:"Millilitres"},{id:'q3',q:"How many centimetres are in 1 metre?",options:["100", "10", "1000", "50"],answer:"100"},{id:'q4',q:"How many grams are in 1 kilogram?",options:["1000", "100", "10", "10000"],answer:"1000"},{id:'q5',q:"Which is the better tool to measure the length of your classroom?",options:["A tape measure", "A measuring jug", "Kitchen scales", "A thermometer"],answer:"A tape measure"},{id:'q6',q:"A jug shows 750mL. How many more mL to reach 1 litre?",options:["250mL", "150mL", "350mL", "500mL"],answer:"250mL"}] },
  { id:"t-math-11", subjectId:"sub-math", name:"Time: reading and converting units", vcaaCode:"",
    studyContent:"Time is measured in seconds, minutes, hours, days, weeks, months and years. There are 60 seconds in a minute, 60 minutes in an hour, and 24 hours in a day. Reading a clock means understanding both the hour hand (short) and minute hand (long), and being able to tell time to the nearest 5 minutes or minute.",
    questions:[{id:'q1',q:"How many minutes are in 1 hour?",options:["60", "100", "30", "24"],answer:"60"},{id:'q2',q:"How many hours are in 1 day?",options:["24", "12", "60", "365"],answer:"24"},{id:'q3',q:"How many minutes are in 2 hours?",options:["120", "100", "90", "60"],answer:"120"},{id:'q4',q:"A movie starts at 3:45pm and runs for 90 minutes. What time does it finish?",options:["5:15pm", "5:00pm", "4:45pm", "5:30pm"],answer:"5:15pm"},{id:'q5',q:"How many days are in a fortnight?",options:["14", "7", "10", "21"],answer:"14"},{id:'q6',q:"How many seconds are in 1 minute?",options:["60", "100", "30", "120"],answer:"60"}] },
  { id:"t-math-12", subjectId:"sub-math", name:"Area of rectangles", vcaaCode:"",
    studyContent:"Area is the amount of flat space a shape covers, measured in square units like cm² or m². For a rectangle, area = length x width. If a rectangle is 5cm long and 3cm wide, its area is 5 x 3 = 15 square centimetres. You can also find area by counting how many equal squares fit inside the shape.",
    questions:[{id:'q1',q:"A rectangle is 4cm long and 3cm wide. What is its area?",options:["12 cm²", "7 cm²", "14 cm²", "10 cm²"],answer:"12 cm²"},{id:'q2',q:"What is the formula for the area of a rectangle?",options:["length x width", "length + width", "2 x (length + width)", "length - width"],answer:"length x width"},{id:'q3',q:"A square has sides of 6cm. What is its area?",options:["36 cm²", "24 cm²", "12 cm²", "30 cm²"],answer:"36 cm²"},{id:'q4',q:"A rectangle has an area of 20cm² and a length of 5cm. What is its width?",options:["4cm", "5cm", "10cm", "15cm"],answer:"4cm"},{id:'q5',q:"What units is area measured in?",options:["Square units, like cm²", "Just centimetres", "Kilograms", "Litres"],answer:"Square units, like cm²"},{id:'q6',q:"A rectangle is 8m long and 2m wide. What is its area?",options:["16 m²", "10 m²", "20 m²", "14 m²"],answer:"16 m²"}] },
  { id:"t-math-13", subjectId:"sub-math", name:"2D shape properties", vcaaCode:"",
    studyContent:"2D shapes are described by their properties: number of sides, number of corners (vertices), and whether the sides are equal length or the angles are equal. A square has 4 equal sides and 4 right angles; a rectangle has 4 sides with opposite sides equal; a triangle has 3 sides. Naming a shape correctly means checking these properties, not just its general look.",
    questions:[{id:'q1',q:"How many sides does a hexagon have?",options:["6", "5", "7", "8"],answer:"6"},{id:'q2',q:"What makes a square different from a rectangle?",options:["A square has 4 equal sides", "A square has more sides", "A square has no right angles", "A square has 3 sides"],answer:"A square has 4 equal sides"},{id:'q3',q:"How many vertices (corners) does a triangle have?",options:["3", "4", "2", "5"],answer:"3"},{id:'q4',q:"Which shape has 5 sides?",options:["Pentagon", "Hexagon", "Square", "Triangle"],answer:"Pentagon"},{id:'q5',q:"What is true about all the angles in a square?",options:["They are all right angles (90°)", "They are all different", "They are all obtuse", "They add up to 180°"],answer:"They are all right angles (90°)"},{id:'q6',q:"A shape has 4 sides but they are not all equal, and opposite sides are equal length. What shape is it likely to be?",options:["Rectangle", "Triangle", "Pentagon", "Circle"],answer:"Rectangle"}] },
  { id:"t-math-14", subjectId:"sub-math", name:"Symmetry", vcaaCode:"",
    studyContent:"A shape has symmetry (is symmetrical) if you can fold it in half and both sides match exactly - that fold line is called the line of symmetry. Some shapes have more than one line of symmetry (a square has 4), and some shapes have none at all (like most irregular shapes).",
    questions:[{id:'q1',q:"What is a line of symmetry?",options:["A line where a shape can be folded so both halves match", "Any line drawn through a shape", "The longest side of a shape", "A line that touches a shape's corner"],answer:"A line where a shape can be folded so both halves match"},{id:'q2',q:"How many lines of symmetry does a square have?",options:["4", "1", "2", "0"],answer:"4"},{id:'q3',q:"How many lines of symmetry does a circle have?",options:["Infinite (every line through the centre)", "0", "1", "4"],answer:"Infinite (every line through the centre)"},{id:'q4',q:"Which letter of the alphabet has a vertical line of symmetry?",options:["A", "F", "R", "P"],answer:"A"},{id:'q5',q:"How many lines of symmetry does a regular (equal-sided) triangle have?",options:["3", "1", "0", "2"],answer:"3"},{id:'q6',q:"Does a scalene triangle (all sides different lengths) usually have a line of symmetry?",options:["No", "Yes, always one", "Yes, always three", "Yes, always two"],answer:"No"}] },
  { id:"t-math-15", subjectId:"sub-math", name:"Angle types", vcaaCode:"",
    studyContent:"An angle measures how much something has turned, measured in degrees. A right angle is exactly 90° (like the corner of a square). An angle smaller than 90° is called acute; an angle bigger than 90° but smaller than 180° is called obtuse; a straight line is 180°.",
    questions:[{id:'q1',q:"How many degrees is a right angle?",options:["90°", "45°", "180°", "60°"],answer:"90°"},{id:'q2',q:"What is an angle smaller than 90° called?",options:["Acute", "Obtuse", "Straight", "Reflex"],answer:"Acute"},{id:'q3',q:"What is an angle bigger than 90° but less than 180° called?",options:["Obtuse", "Acute", "Right", "Straight"],answer:"Obtuse"},{id:'q4',q:"How many degrees is a straight line?",options:["180°", "90°", "360°", "270°"],answer:"180°"},{id:'q5',q:"Which everyday object shows a right angle?",options:["The corner of a book", "A slice of pizza", "A rainbow", "A ball"],answer:"The corner of a book"},{id:'q6',q:"An angle measures 120°. What type of angle is it?",options:["Obtuse", "Acute", "Right", "Reflex"],answer:"Obtuse"}] },
  { id:"t-math-16", subjectId:"sub-math", name:"Collecting and interpreting data (graphs)", vcaaCode:"",
    studyContent:"Collecting data means gathering information, like counting how many classmates like each fruit. Once collected, data can be shown in a table, a column graph (bars), or a picture graph. Reading a graph means checking the axis labels and the scale, then comparing the heights or lengths of the bars to answer questions about the data.",
    questions:[{id:'q1',q:"What is the purpose of a column graph?",options:["To visually compare amounts of data", "To measure temperature", "To tell the time", "To show a map"],answer:"To visually compare amounts of data"},{id:'q2',q:"On a graph, what do you check first to understand it?",options:["The axis labels and scale", "The colours used", "The title font", "The paper size"],answer:"The axis labels and scale"},{id:'q3',q:"If a bar for 'Apples' is taller than the bar for 'Bananas', what does that mean?",options:["More people chose apples", "Apples are bigger fruit", "Bananas are more popular", "Nothing can be concluded"],answer:"More people chose apples"},{id:'q4',q:"What is the first step in creating a graph from data you collected?",options:["Organise the data into a table first", "Draw the bars randomly", "Skip straight to colouring", "Guess the totals"],answer:"Organise the data into a table first"},{id:'q5',q:"A picture graph uses pictures where each picture represents a set number of items. What is this called?",options:["A key or legend", "A title", "An axis", "A scale-free graph"],answer:"A key or legend"},{id:'q6',q:"Why might you choose a graph instead of a table to show data?",options:["It makes comparisons easier to see at a glance", "Tables are never useful", "Graphs use less data", "Graphs are always more accurate"],answer:"It makes comparisons easier to see at a glance"}] },
  { id:"t-math-17", subjectId:"sub-math", name:"Chance experiments and likelihood language", vcaaCode:"",
    studyContent:"Chance describes how likely something is to happen. We use words like 'impossible', 'unlikely', 'even chance', 'likely', and 'certain' to describe this. A chance experiment - like flipping a coin or rolling a dice - lets us test predictions and record outcomes to see how often each result actually happens.",
    questions:[{id:'q1',q:"What word describes an event that will definitely happen?",options:["Certain", "Impossible", "Unlikely", "Even chance"],answer:"Certain"},{id:'q2',q:"What word describes an event that can never happen?",options:["Impossible", "Certain", "Likely", "Even chance"],answer:"Impossible"},{id:'q3',q:"When flipping a fair coin, what is the chance of landing on heads?",options:["Even chance", "Certain", "Impossible", "Unlikely"],answer:"Even chance"},{id:'q4',q:"Rolling a standard dice, what is the chance of rolling a 7?",options:["Impossible", "Certain", "Unlikely", "Even chance"],answer:"Impossible"},{id:'q5',q:"If a bag has 9 red balls and 1 blue ball, picking blue without looking is:",options:["Unlikely", "Likely", "Certain", "Even chance"],answer:"Unlikely"},{id:'q6',q:"What is a 'chance experiment'?",options:["An activity to test and record how likely outcomes are", "A test with only one possible result", "A science experiment about weather", "An experiment with no clear result"],answer:"An activity to test and record how likely outcomes are"}] },
  { id:"t-eng-01", subjectId:"sub-eng", name:"Standard Australian English and language variation", vcaaCode:"VCELA303",
    studyContent:"Standard Australian English is the form of English used in most school writing, news, and formal situations - but it's just one of many ways people speak English. Families, friend groups, and different regions often use their own dialects and slang, which are equally valid ways of communicating, just suited to different situations. Knowing when to use Standard Australian English (like in a school report) versus casual language (like texting a friend) is an important skill.",
    questions:[{id:'q1',q:"What is Standard Australian English mainly used for?",options:["Formal writing and school work", "Only texting friends", "Only spoken conversation", "Nothing in particular"],answer:"Formal writing and school work"},{id:'q2',q:"Is slang or a regional dialect 'wrong' English?",options:["No, it's a valid way of speaking suited to certain situations", "Yes, it is always incorrect", "Yes, only adults can use it correctly", "No dialects exist in English"],answer:"No, it's a valid way of speaking suited to certain situations"},{id:'q3',q:"Which situation calls for Standard Australian English?",options:["Writing a school report", "Texting a close friend", "Chatting casually with family", "Playing a game with friends"],answer:"Writing a school report"},{id:'q4',q:"What does it mean to 'code-switch' between dialects?",options:["Changing how you speak depending on the situation", "Speaking a foreign language", "Making up new words", "Never changing how you talk"],answer:"Changing how you speak depending on the situation"},{id:'q5',q:"Why might a letter to a principal use more formal language than a note to a friend?",options:["Formal situations usually call for Standard English", "Formal letters must be shorter", "Friends prefer formal language too", "There is no difference needed"],answer:"Formal situations usually call for Standard English"}] },
  { id:"t-eng-02", subjectId:"sub-eng", name:"Language of opinion vs factual reporting", vcaaCode:"VCELA305",
    studyContent:"Factual language reports things that can be checked and proven true, like 'The library opens at 9am.' Opinion language expresses feelings or beliefs, like 'The library is the best place in town.' Words such as 'I think', 'best', 'worst', 'amazing', or 'boring' are clues that you're reading an opinion rather than a fact.",
    questions:[{id:'q1',q:"Which sentence is a fact?",options:["The library opens at 9am.", "The library is the best place ever.", "Libraries are boring.", "Everyone should love libraries."],answer:"The library opens at 9am."},{id:'q2',q:"Which sentence is an opinion?",options:["This is the most exciting book I've read.", "The book has 200 pages.", "The book was published in 2020.", "The book is in the library."],answer:"This is the most exciting book I've read."},{id:'q3',q:"Which word is a clue that a sentence is an opinion?",options:["Amazing", "Measured", "Published", "Located"],answer:"Amazing"},{id:'q4',q:"Can a fact be checked to see if it's true?",options:["Yes", "No", "Only sometimes", "Facts don't need checking"],answer:"Yes"},{id:'q5',q:"'I think dogs make the best pets' is an example of:",options:["Opinion", "Fact", "A measurement", "A definition"],answer:"Opinion"},{id:'q6',q:"Why is it useful to tell fact from opinion when reading?",options:["To understand what is proven versus what is someone's view", "Facts are always more interesting", "Opinions are always false", "There is no real difference"],answer:"To understand what is proven versus what is someone's view"}] },
  { id:"t-eng-03", subjectId:"sub-eng", name:"Sentence structure and complex sentences", vcaaCode:"VCELA292",
    studyContent:"A simple sentence has one main idea: 'The dog barked.' A compound sentence joins two ideas with a word like 'and', 'but', or 'so': 'The dog barked and the cat ran.' A complex sentence adds extra information with words like 'because', 'although', or 'when': 'The dog barked because a stranger walked past.' Using a mix of sentence types makes writing more interesting to read.",
    questions:[{id:'q1',q:"Which is a simple sentence?",options:["The dog barked.", "The dog barked and the cat ran.", "The dog barked because it heard a noise.", "Although tired, the dog barked."],answer:"The dog barked."},{id:'q2',q:"Which word could join two ideas into a compound sentence?",options:["And", "Because", "Although", "When"],answer:"And"},{id:'q3',q:"Which word often starts a complex sentence, adding a reason?",options:["Because", "And", "But", "Or"],answer:"Because"},{id:'q4',q:"'Although it was raining, we went outside.' - what type of sentence is this?",options:["Complex", "Simple", "Just a list", "Not a sentence"],answer:"Complex"},{id:'q5',q:"Why do writers use a mix of simple and complex sentences?",options:["To make writing more interesting to read", "Because simple sentences are wrong", "Because complex sentences must always be used", "To make writing shorter"],answer:"To make writing more interesting to read"},{id:'q6',q:"'The sun was setting and the birds flew home.' - what type of sentence is this?",options:["Compound", "Simple", "Complex only", "Not a sentence"],answer:"Compound"}] },
  { id:"t-eng-04", subjectId:"sub-eng", name:"Punctuation conventions", vcaaCode:"VCELA291",
    studyContent:"Punctuation helps a reader understand your writing. A full stop ends a sentence. A comma creates a short pause or separates items in a list. Question marks end questions, exclamation marks show strong feeling, and quotation marks (\" \") show exactly what someone said.",
    questions:[{id:'q1',q:"Which punctuation mark ends a question?",options:["Question mark (?)", "Full stop (.)", "Comma (,)", "Exclamation mark (!)"],answer:"Question mark (?)"},{id:'q2',q:"Which punctuation shows exactly what someone said?",options:["Quotation marks", "Commas", "Full stops", "Question marks"],answer:"Quotation marks"},{id:'q3',q:"What is the purpose of a comma in a list?",options:["To separate items", "To end the sentence", "To show strong feeling", "To ask a question"],answer:"To separate items"},{id:'q4',q:"'Watch out!' uses which punctuation to show strong feeling?",options:["Exclamation mark", "Question mark", "Comma", "Full stop"],answer:"Exclamation mark"},{id:'q5',q:"Which sentence uses commas correctly in a list?",options:["I like apples, bananas and grapes.", "I like apples bananas, and, grapes.", "I, like apples bananas and grapes.", "I like, apples, bananas, and, grapes."],answer:"I like apples, bananas and grapes."},{id:'q6',q:"What does a full stop signal to the reader?",options:["The end of a sentence", "A pause mid-sentence", "A question is being asked", "Strong emotion"],answer:"The end of a sentence"}] },
  { id:"t-eng-05", subjectId:"sub-eng", name:"Identifying text purpose (inform, persuade, entertain)", vcaaCode:"VCELA277",
    studyContent:"Every text is written for a purpose. Informative texts share facts and information, like a science report. Persuasive texts try to convince you of something, like an advertisement or opinion piece. Entertaining texts aim to amuse or engage you emotionally, like a story or joke. Spotting clues in the language helps you identify which purpose a text has.",
    questions:[{id:'q1',q:"What is the purpose of a weather report?",options:["To inform", "To persuade", "To entertain", "To confuse"],answer:"To inform"},{id:'q2',q:"What is the purpose of an advertisement?",options:["To persuade", "To inform only", "To entertain only", "To describe weather"],answer:"To persuade"},{id:'q3',q:"What is the main purpose of a funny short story?",options:["To entertain", "To persuade", "To give instructions", "To report facts"],answer:"To entertain"},{id:'q4',q:"Which clue suggests a text is persuasive?",options:["Strong opinions and words like 'should' or 'must'", "Lots of dates and facts", "A funny made-up character", "Step-by-step instructions"],answer:"Strong opinions and words like 'should' or 'must'"},{id:'q5',q:"A recipe with numbered steps is mainly which purpose?",options:["To inform (instruct)", "To persuade", "To entertain", "To express opinion only"],answer:"To inform (instruct)"},{id:'q6',q:"Why is it useful to identify a text's purpose before reading it closely?",options:["It helps you know what to expect and how to read it", "It changes the actual words in the text", "It is not useful at all", "It only matters for essays"],answer:"It helps you know what to expect and how to read it"}] },
  { id:"t-eng-06", subjectId:"sub-eng", name:"Sharing responses to literary texts", vcaaCode:"VCELT306",
    studyContent:"After reading a story or poem, sharing your response means explaining what you thought and felt about it, and why. A good response goes beyond 'I liked it' - it explains which part stood out, how a character made you feel, or what the story reminded you of. Listening to others' different responses to the same text can show you new ways of understanding it.",
    questions:[{id:'q1',q:"What makes a strong response to a story, beyond just 'I liked it'?",options:["Explaining which part stood out and why", "Just naming the title again", "Copying a sentence from the book", "Saying nothing more is needed"],answer:"Explaining which part stood out and why"},{id:'q2',q:"Why might two people have different responses to the same story?",options:["People bring different experiences and feelings to reading", "Only one response can ever be correct", "Stories only have one meaning", "Responses must always match"],answer:"People bring different experiences and feelings to reading"},{id:'q3',q:"When sharing a response, what is helpful to include?",options:["A reason or example supporting your view", "Only a one-word answer", "A summary with no opinion", "Someone else's opinion only"],answer:"A reason or example supporting your view"},{id:'q4',q:"What can you learn from hearing someone else's response to a story you've read?",options:["A new way of understanding the story", "Nothing new, since you already read it", "That your own response was wrong", "That stories have only one meaning"],answer:"A new way of understanding the story"},{id:'q5',q:"Which is an example of sharing a personal response?",options:["\"The ending made me feel hopeful because the character never gave up.\"", "\"The book has 120 pages.\"", "\"The author was born in 1990.\"", "\"The book is on the top shelf.\""],answer:"\"The ending made me feel hopeful because the character never gave up.\""}] },
  { id:"t-eng-07", subjectId:"sub-eng", name:"Reading comprehension: literal and inferred meaning", vcaaCode:"VCELY288",
    studyContent:"Literal meaning is exactly what the text states - information you can point to directly. Inferred meaning is what you work out using clues, even though it isn't stated outright. If a story says 'Sam grabbed an umbrella and ran outside,' you can infer it's probably raining, even though the text never says so directly.",
    questions:[{id:'q1',q:"What is 'literal meaning'?",options:["Exactly what the text states", "A guess based on clues", "The opposite of what is written", "A made-up meaning"],answer:"Exactly what the text states"},{id:'q2',q:"What does it mean to 'infer' something while reading?",options:["Work out something using clues, not stated directly", "Copy the exact words from the text", "Ignore the text completely", "Ask the author directly"],answer:"Work out something using clues, not stated directly"},{id:'q3',q:"'Sam grabbed an umbrella and ran outside.' What can you infer?",options:["It's probably raining", "Sam is going to school", "Sam lost the umbrella", "Sam doesn't like rain"],answer:"It's probably raining"},{id:'q4',q:"If a text says 'The character's hands were shaking as she opened the letter,' what might you infer?",options:["She feels nervous or anxious", "She is very calm", "She is angry", "She is asleep"],answer:"She feels nervous or anxious"},{id:'q5',q:"Why is inferring an important reading skill?",options:["Not everything in a story is stated directly", "It replaces the need to read carefully", "It is only used in non-fiction", "Texts never need inference"],answer:"Not everything in a story is stated directly"},{id:'q6',q:"A question asking 'What colour was the character's coat?' (stated in the text) is testing:",options:["Literal meaning", "Inferred meaning", "Opinion", "Persuasive technique"],answer:"Literal meaning"}] },
  { id:"t-eng-08", subjectId:"sub-eng", name:"Writing narratives", vcaaCode:"VCELT297,VCELT298",
    studyContent:"A narrative is a story with a beginning, middle, and end. Every good narrative needs: a SETTING (where and when it happens), CHARACTERS (who it happens to), a PROBLEM or event that starts the action, and a RESOLUTION (how it gets sorted out). Start by picturing your setting clearly - is it a spooky forest, a busy school, outer space? Give your main character a want or a problem. Then build up what happens step by step, using time words like 'first', 'suddenly', 'after that', 'finally' to guide your reader through events in order.",
    questions:[{id:'q1',q:"Which part of a narrative introduces where and when the story happens?",options:["Setting", "Resolution", "Dialogue", "Title"],answer:"Setting"},{id:'q2',q:"Which word would best start a sentence showing something unexpected happened?",options:["Suddenly", "Also", "Then", "And"],answer:"Suddenly"},{id:'q3',q:"What is the 'resolution' of a story?",options:["How the problem gets sorted out at the end", "The first sentence", "A character's name", "The title"],answer:"How the problem gets sorted out at the end"},{id:'q4',q:"'The rusty gate creaked open in the moonlight' mainly describes the story's:",options:["Setting", "Resolution", "Character's name", "Moral"],answer:"Setting"},{id:'q5',q:"Which sentence best shows a character's problem?",options:["Jack couldn't find his way home before dark.", "It was a sunny day.", "The park had swings.", "Trees were green."],answer:"Jack couldn't find his way home before dark."},{id:'q6',q:"Time connectives (like 'first', 'after that') mainly help the reader understand:",options:["The order events happen in", "The character's name", "The title", "The setting only"],answer:"The order events happen in"},{id:'q7',q:"A narrative always needs a beginning, middle and:",options:["End", "Question", "Diagram", "Index"],answer:"End"},{id:'q8',q:"Which is an example of a character's 'want'?",options:["Mia wanted to find the hidden treasure.", "The sky was blue.", "It was Tuesday.", "The room was cold."],answer:"Mia wanted to find the hidden treasure."},{id:'q9',q:"Why do writers build up events 'step by step' in a narrative?",options:["So the reader can follow what happens in order", "To make the story shorter", "To avoid using characters", "To skip the setting"],answer:"So the reader can follow what happens in order"}] },
  { id:"t-eng-09", subjectId:"sub-eng", name:"Writing persuasive texts", vcaaCode:"VCELY299",
    studyContent:"A persuasive text tries to convince the reader to agree with a point of view. It usually states the opinion clearly, gives reasons to support it, and often uses persuasive words like 'should', 'clearly', or 'importantly'. Strong persuasive writing backs up each reason with an example or explanation, not just a bare claim.",
    questions:[{id:'q1',q:"What is the main goal of a persuasive text?",options:["To convince the reader of a point of view", "To simply describe an event", "To entertain with a made-up story", "To give step-by-step instructions"],answer:"To convince the reader of a point of view"},{id:'q2',q:"Which word signals persuasive writing?",options:["Should", "Yesterday", "Meanwhile", "Once upon a time"],answer:"Should"},{id:'q3',q:"What should follow a reason in a persuasive text to make it stronger?",options:["An example or explanation", "Nothing else is needed", "A random fact unrelated to it", "Just another opinion word"],answer:"An example or explanation"},{id:'q4',q:"Which sentence is persuasive?",options:["Schools should have longer lunch breaks because students need more time to relax.", "The lunch break is 30 minutes long.", "Lunch is eaten in the cafeteria.", "The bell rings at 12:30pm."],answer:"Schools should have longer lunch breaks because students need more time to relax."},{id:'q5',q:"Where does a persuasive text usually state its main opinion?",options:["Near the beginning, clearly", "Only at the very end, hidden", "Never stated directly", "Only in the title"],answer:"Near the beginning, clearly"}] },
  { id:"t-eng-10", subjectId:"sub-eng", name:"Writing informative reports", vcaaCode:"VCELY299",
    studyContent:"An informative report presents facts about a topic in an organised way, usually grouped under headings. Unlike a persuasive text, a report doesn't try to convince you of an opinion - it just presents accurate information clearly, often starting with a general statement about the topic before giving specific details.",
    questions:[{id:'q1',q:"What is the main purpose of an informative report?",options:["To present facts clearly", "To convince the reader of an opinion", "To tell an entertaining story", "To ask questions"],answer:"To present facts clearly"},{id:'q2',q:"How are informative reports often organised?",options:["Under headings, grouping related facts", "Randomly, with no structure", "Only as one long paragraph", "As a list of opinions"],answer:"Under headings, grouping related facts"},{id:'q3',q:"Which sentence fits a report about koalas?",options:["Koalas mainly eat eucalyptus leaves.", "Koalas are the cutest animal ever!", "Everyone should love koalas.", "I think koalas are amazing."],answer:"Koalas mainly eat eucalyptus leaves."},{id:'q4',q:"What usually comes first in an informative report?",options:["A general statement introducing the topic", "A strong opinion", "A joke", "A question to the reader"],answer:"A general statement introducing the topic"},{id:'q5',q:"How is a report different from a persuasive text?",options:["A report presents facts rather than trying to convince", "A report always uses 'should'", "A report has no headings", "A report and persuasive text are the same"],answer:"A report presents facts rather than trying to convince"}] },
  { id:"t-eng-11", subjectId:"sub-eng", name:"Editing and revising own writing", vcaaCode:"VCELY300",
    studyContent:"Good writers don't just write once and stop - they REREAD their work and make it better. Editing means checking your writing and asking: Does this sentence make sense? Is there a word I could add to make it clearer? Is there a word I don't need? Should I move this sentence somewhere else? Three simple editing moves: ADD a describing word or detail that's missing. DELETE a word or sentence that repeats itself or doesn't help. MOVE a sentence or word group to a better spot, like putting the most important idea first.",
    questions:[{id:'q1',q:"What does 'editing' mean when you write a story?",options:["Rereading and improving your writing", "Writing the story for the first time", "Drawing a picture", "Choosing a title only"],answer:"Rereading and improving your writing"},{id:'q2',q:"'The the cat sat down.' - what editing move fixes this sentence?",options:["Delete the repeated word 'the'", "Add a new character", "Move the sentence to the end", "Change the setting"],answer:"Delete the repeated word 'the'"},{id:'q3',q:"Which is an example of ADDING detail to improve a sentence?",options:["'The fast, brown dog ran.' instead of 'The dog ran.'", "Deleting the word 'dog'", "Making the sentence shorter", "Removing all describing words"],answer:"'The fast, brown dog ran.' instead of 'The dog ran.'"},{id:'q4',q:"Why might a writer MOVE a sentence during editing?",options:["To put ideas in a clearer or more logical order", "To make the story longer", "To remove the setting", "To avoid using punctuation"],answer:"To put ideas in a clearer or more logical order"},{id:'q5',q:"Which question should you ask yourself while editing?",options:["Does this sentence make sense?", "What is my favourite colour?", "How many pages did I write?", "What time is it?"],answer:"Does this sentence make sense?"},{id:'q6',q:"'I like dogs. Dogs are good pets. I like dogs a lot.' What editing move improves this most?",options:["Delete the repeated idea about liking dogs", "Add more repeated sentences", "Move the first sentence to last", "Nothing needs to change"],answer:"Delete the repeated idea about liking dogs"},{id:'q7',q:"Editing mainly helps improve a piece of writing's:",options:["Content and structure", "Handwriting only", "Page colour", "Font size"],answer:"Content and structure"}] },
  { id:"t-eng-12", subjectId:"sub-eng", name:"Handwriting fluency (joined letters)", vcaaCode:"VCELY301",
    studyContent:"Joined (cursive) handwriting connects letters within a word using small linking strokes, which can make writing faster once you're comfortable with it. Fluency means writing smoothly and consistently without having to think hard about each letter shape - it comes with regular practice, focusing on consistent letter size and spacing.",
    questions:[{id:'q1',q:"What does 'joined handwriting' mean?",options:["Letters within a word are connected by linking strokes", "Every letter is written separately", "Only capital letters are used", "Writing without any spaces between words"],answer:"Letters within a word are connected by linking strokes"},{id:'q2',q:"What is one benefit of fluent joined handwriting?",options:["It can make writing faster", "It makes reading harder", "It removes the need for spelling", "It only works for short words"],answer:"It can make writing faster"},{id:'q3',q:"What helps develop handwriting fluency?",options:["Regular practice with consistent letter size", "Writing only once a year", "Avoiding handwriting altogether", "Changing letter shapes every time"],answer:"Regular practice with consistent letter size"},{id:'q4',q:"What is important for handwriting to look neat and consistent?",options:["Consistent letter size and spacing", "Random letter sizes", "No spacing between words", "Using a different style each time"],answer:"Consistent letter size and spacing"}] },
  { id:"t-eng-13", subjectId:"sub-eng", name:"Using software to construct and publish text", vcaaCode:"VCELY302",
    studyContent:"Word processing software (like a document editor) lets you type, edit, and format written text - changing font size, adding headings, fixing spelling, and moving paragraphs around easily. Publishing means preparing a finished piece to share with others, checking that it's well organised and free of errors before sharing it.",
    questions:[{id:'q1',q:"What is word processing software used for?",options:["Typing, editing and formatting written text", "Only drawing pictures", "Only playing games", "Measuring distances"],answer:"Typing, editing and formatting written text"},{id:'q2',q:"What does 'publishing' a piece of writing mean?",options:["Preparing a finished piece to share with others", "Deleting the writing completely", "Writing the very first rough draft", "Reading someone else's work only"],answer:"Preparing a finished piece to share with others"},{id:'q3',q:"Which of these is an editing task in word processing software?",options:["Fixing spelling and moving paragraphs", "Only choosing a font colour", "Printing the document only", "Closing the document"],answer:"Fixing spelling and moving paragraphs"},{id:'q4',q:"Why check writing carefully before publishing it?",options:["To make sure it's well organised and free of errors", "Checking isn't necessary before publishing", "Only the title needs checking", "Errors don't matter once published"],answer:"To make sure it's well organised and free of errors"}] },
  { id:"t-eng-14", subjectId:"sub-eng", name:"Oral presentations", vcaaCode:"VCELY308",
    studyContent:"An oral presentation means speaking to an audience to inform, persuade, or entertain them. Good presentations are planned in advance (knowing what you'll say and in what order), rehearsed so you're comfortable with the content, and delivered clearly - speaking at a good pace, making eye contact, and using a confident voice.",
    questions:[{id:'q1',q:"What are the three main steps in preparing an oral presentation?",options:["Plan, rehearse, deliver", "Just deliver, with no planning", "Only rehearse, nothing else", "Write it and never say it aloud"],answer:"Plan, rehearse, deliver"},{id:'q2',q:"Why is rehearsing a presentation helpful?",options:["It builds comfort and confidence with the content", "It makes the presentation shorter automatically", "It removes the need for planning", "It is not helpful at all"],answer:"It builds comfort and confidence with the content"},{id:'q3',q:"What helps a presentation sound clear and confident?",options:["Speaking at a good pace and making eye contact", "Speaking as fast as possible", "Reading with your head down the whole time", "Whispering quietly"],answer:"Speaking at a good pace and making eye contact"},{id:'q4',q:"An oral presentation can be given for which purposes?",options:["To inform, persuade, or entertain", "Only to entertain", "Only to persuade", "It has no real purpose"],answer:"To inform, persuade, or entertain"}] },
  { id:"t-sci-01", subjectId:"sub-sci", name:"Living, once-living and non-living classification", vcaaCode:"VCSSU057",
    studyContent:"Living things grow, reproduce, need food/energy, and respond to their environment (like plants, animals, and people). Once-living things were alive but no longer are, like a dead leaf or a piece of wood. Non-living things were never alive, like a rock or a plastic toy. Classifying helps scientists group and compare things based on shared characteristics.",
    questions:[{id:'q1',q:"Which of these is a living thing?",options:["A tree", "A rock", "A plastic chair", "A dead branch"],answer:"A tree"},{id:'q2',q:"Which of these is 'once-living'?",options:["A dead leaf", "A river stone", "A metal spoon", "A cloud"],answer:"A dead leaf"},{id:'q3',q:"Which of these is non-living and was never alive?",options:["A plastic toy", "A dog", "A flower", "A dried leaf"],answer:"A plastic toy"},{id:'q4',q:"What is one characteristic all living things share?",options:["They need food or energy to survive", "They are all the same colour", "They never move", "They are all plants"],answer:"They need food or energy to survive"},{id:'q5',q:"Why is wood classified as 'once-living' rather than 'living'?",options:["It came from a tree but is no longer growing", "Wood was never part of a living thing", "Wood is a non-living material only", "Wood can still grow"],answer:"It came from a tree but is no longer growing"}] },
  { id:"t-sci-02", subjectId:"sub-sci", name:"Life cycles of plants and animals", vcaaCode:"VCSSU058",
    studyContent:"Every living thing goes through a life cycle - a series of changes from the start of its life to when it can have offspring of its own. Animals like butterflies go through big changes: egg, caterpillar (larva), chrysalis (pupa), then adult butterfly - this is called metamorphosis. Other animals, like dogs, look similar to their parents from birth and just grow bigger. Plants also have a life cycle: seed, then a young seedling sprouts, it grows into a mature plant, the plant flowers, and produces new seeds - and the cycle starts again. Living things depend on their environment (like sunlight, water, and other living things) at every stage of their life cycle to survive and grow.",
    questions:[{id:'q1',q:"What is a life cycle?",options:["The stages a living thing goes through from start of life to producing offspring", "A type of plant", "A kind of rock", "A weather pattern"],answer:"The stages a living thing goes through from start of life to producing offspring"},{id:'q2',q:"What is the correct order of a butterfly's life cycle?",options:["Egg, caterpillar, chrysalis, butterfly", "Butterfly, egg, chrysalis, caterpillar", "Caterpillar, butterfly, egg, chrysalis", "Chrysalis, egg, caterpillar, butterfly"],answer:"Egg, caterpillar, chrysalis, butterfly"},{id:'q3',q:"What is the term for a caterpillar's big change into a butterfly?",options:["Metamorphosis", "Germination", "Photosynthesis", "Pollination"],answer:"Metamorphosis"},{id:'q4',q:"What is the first stage in a plant's life cycle?",options:["Seed", "Flower", "Mature plant", "Seedling"],answer:"Seed"},{id:'q5',q:"How is a puppy's growth different from a caterpillar's?",options:["A puppy looks similar to its parents from birth; a caterpillar looks very different from the adult", "A puppy has a chrysalis stage", "A puppy is not a living thing", "There is no difference"],answer:"A puppy looks similar to its parents from birth; a caterpillar looks very different from the adult"},{id:'q6',q:"What does a young frog (tadpole) eventually grow into?",options:["An adult frog", "A fish", "A butterfly", "A bird"],answer:"An adult frog"},{id:'q7',q:"What do living things need from their environment at every life cycle stage?",options:["Things like sunlight, water and other living things", "Nothing - they don't depend on the environment", "Only sunlight", "Only water"],answer:"Things like sunlight, water and other living things"},{id:'q8',q:"After a plant flowers, what does it typically produce to continue its life cycle?",options:["New seeds", "A chrysalis", "A tadpole", "Fur"],answer:"New seeds"}] },
  { id:"t-sci-03", subjectId:"sub-sci", name:"Parent-offspring similarities and differences", vcaaCode:"VCSSU058",
    studyContent:"Offspring (baby animals or plants) often look similar to their parents but aren't identical - a puppy might have different colouring than its mother. As living things grow through different stages, they can change quite a lot, like a caterpillar becoming a butterfly, while still being part of the same life cycle.",

function isLoggedIn(){ return !!tracklineAuth.user && !!tracklineAuth.membership && ui.authenticated && !!ui.profileId; }
function currentMember(){ return ui.profileId ? memberById(ui.profileId) : null; }
function isParentLoggedIn(){ const m = currentMember(); return isLoggedIn() && m && m.role==='parent' && tracklineAuth.membership.role==='parent'; }

async function loadData(){
  const accountRevision = tracklineAuth.revision || 0;
  try{
    const r = await storageGet('trackline-data');
    if(accountRevision !== (tracklineAuth.revision || 0)) return;
    if(r && r.value){
      const parsed = JSON.parse(r.value);
      if(parsed.members && parsed.events){
        // migrate old events (no recurrence field) to weekly recurrence
        parsed.events.forEach(e=>{
          if(!e.recurrence) e.recurrence = 'weekly';
          if(!('date' in e)) e.date = null;
          if(!e.skipDates) e.skipDates = [];
        });
        parsed.members.forEach(m=>{
          if(!('pinHash' in m)) m.pinHash = null;
          if(!('canAddTasks' in m)) m.canAddTasks = true;
          if(!('canAddShopping' in m)) m.canAddShopping = true;
          if(!('email' in m)) m.email = '';
          if(!('phone' in m)) m.phone = '';
          if(!('yearLevel' in m)) m.yearLevel = null; // 'Prep','1'..'8' — set for kids via Settings, drives the Study tab
        });
        if(!parsed.topicProgress) parsed.topicProgress = [];
        // anyone with data saved before family setup existed gets a default family wrapper
        // so they aren't unexpectedly dropped back into onboarding
        if(!parsed.family){
          parsed.family = {id:cid(), name:'My Family', primaryHolderName:'', primaryHolderEmail:'', primaryHolderPhone:''};
        }
        if(!parsed.chores) parsed.chores = [];
        parsed.chores.forEach(c=>{
          if(!('anchorDate' in c)) c.anchorDate = null;
          if(!('startDate' in c)) c.startDate = null; // null = unrestricted, preserves behavior for tasks that existed before this field
          if(!('dueDate' in c)) c.dueDate = null;
          if(!('dueTime' in c)) c.dueTime = null;
          if(!('points' in c)) c.points = 0;
        });
        if(!parsed.choreLogs) parsed.choreLogs = [];
        if(!parsed.choreLibrary){
          const fromExisting = [...new Set(parsed.chores.map(c=>c.title))];
          parsed.choreLibrary = fromExisting.length ? fromExisting : [];
        }
        if(!parsed.shoppingList) parsed.shoppingList = [];
        if(!parsed.shoppingTrips) parsed.shoppingTrips = [];
        if(!parsed.shoppingItemLibrary) parsed.shoppingItemLibrary = [];
        if(!parsed.activityLibrary) parsed.activityLibrary = [];
        parsed.events.forEach(e=>{ if(!('notes' in e)) e.notes = ''; });
        parsed.events.forEach(e=>{ if(!('occurrenceOverrides' in e)) e.occurrenceOverrides = []; });
        state = parsed;
      }
    }
  }catch(e){ /* no saved data yet — fresh install, onboarding will show */ }
  ui.loaded = true;
  if(!ui.kidId){
    const firstKid = state.members.find(m=>m.role==='kid');
    ui.kidId = firstKid ? firstKid.id : null;
  }
  const access = tracklineAuth.membership;
  if(access){
    const member = memberById(access.member_id);
    if(member){ member.role = access.role; ui.profileId = member.id; ui.kidId = access.role==='kid' ? member.id : ui.kidId; ui.tab = access.role==='parent' ? 'parent' : 'kid'; }
  }
  render();
}
async function saveData(){
  if(tracklineAuth.membership && tracklineAuth.membership.role==='kid'){
    // Child completion and exam submissions use their scoped endpoints.
    // A child account cannot replace the family's complete state.
    return;
  }
  try{ await storageSet('trackline-data', JSON.stringify(state)); }
  catch(e){ console.error('save failed', e); showAlert('Changes were not saved to the database. '+e.message); }
}

function memberById(id){ return state.members.find(m=>m.id===id); }

// Normalizes an event's weekly recurrence days to an array, regardless of
// whether it's an OLD event (single `day` field, e.g. real existing family
// data) or a NEW one (`days` array, from the multi-day picker). Nothing
// ever gets rewritten/migrated — every place that needs to know which
// weekdays an event repeats on goes through this instead, so old data
// keeps working forever without a migration pass that could risk
// corrupting real, already-deployed family schedules.
function eventDayList(e){
  if(Array.isArray(e.days)) return e.days;
  if(e.day!=null) return [e.day];
  return [];
}
// True if dateISO falls within an event's optional recurrence bounds.
// recurrenceStartDate/recurrenceEndDate are both optional — omitted means
// unbounded in that direction, matching today's existing "runs forever"
// default behavior exactly when neither is set.
function withinRecurrenceBounds(e, dateISO){
  if(e.recurrenceStartDate && dateISO < e.recurrenceStartDate) return false;
  if(e.recurrenceEndDate && dateISO > e.recurrenceEndDate) return false;
  return true;
}

function eventsForDate(dateISO){
  const dow = dowMonIndexed(dateISO);
  const weekly = state.events.filter(e=>
    e.recurrence==='weekly' && eventDayList(e).includes(dow) &&
    withinRecurrenceBounds(e, dateISO) &&
    !(e.skipDates||[]).includes(dateISO)
  );
  const once = state.events.filter(e=> e.recurrence==='once' && e.date===dateISO);
  // occurrences that were rescheduled TO this date from elsewhere in the series
  const movedIn = [];
  state.events.forEach(e=>{
    (e.occurrenceOverrides||[]).forEach(o=>{
      if(o.newDate===dateISO){
        movedIn.push(Object.assign({}, e, {
          start: o.newStart, end: o.newEnd,
          _movedOccurrence: true, _originalDate: o.originalDate, _overrideId: o.id
        }));
      }
    });
  });
  return weekly.concat(once).concat(movedIn);
}
function eventsForDateMember(dateISO, memberId){
  return eventsForDate(dateISO).filter(e=>e.memberId===memberId);
}
function transitBlocksForDateDriver(dateISO, driverId){
  const blocks = [];
  eventsForDate(dateISO).filter(e=>e.needsDrive && e.driverId===driverId).forEach(e=>{
    const t = e.travelMin||0;
    if(t>0){
      blocks.push({kind:'transit', label:'Drive: '+e.title+' (there)', start:e.start-t, end:e.start, sourceId:e.id});
      blocks.push({kind:'transit', label:'Drive: '+e.title+' (back)', start:e.end, end:e.end+t, sourceId:e.id});
    }
  });
  return blocks;
}

// ---- chores (recurring checklist items, separate from time-blocked activities) ----
function choreDue(chore, dateISO){
  if(!chore.active) return false;
  if(chore.pendingApproval) return false; // waits for a parent to approve before it's a real, active task
  // Never show a task as due before it actually started existing — prevents
  // a newly-created weekly/daily task from retroactively appearing on past dates.
  if(chore.startDate && dateISO < chore.startDate) return false;
  if(chore.frequency==='daily') return true;
  if(chore.frequency==='weekly') return (chore.days||[]).includes(dowMonIndexed(dateISO));
  if(chore.frequency==='fortnightly'){
    if(!(chore.days||[]).includes(dowMonIndexed(dateISO))) return false;
    const anchorMonday = mondayOf(chore.startDate || chore.anchorDate || dateISO);
    const thisMonday = mondayOf(dateISO);
    const weeksDiff = Math.round((thisMonday.getTime() - anchorMonday.getTime()) / (7*24*60*60*1000));
    return ((weeksDiff % 2) + 2) % 2 === 0; // works for negative diffs too
  }
  if(chore.frequency==='monthly'){
    const d = fromISODate(dateISO);
    const daysInMonth = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
    const targetDay = Math.min(chore.dayOfMonth||1, daysInMonth);
    return d.getDate() === targetDay;
  }
  if(chore.frequency==='once') return chore.dueDate === dateISO;
  return false;
}
function choresForDate(dateISO){
  return state.chores.filter(c=> choreDue(c, dateISO));
}
function choresForDateMember(dateISO, memberId){
  return choresForDate(dateISO).filter(c=>c.memberId===memberId);
}
function choreLogFor(choreId, dateISO){
  return state.choreLogs.find(l=>l.choreId===choreId && l.date===dateISO) || null;
}
function canMarkChoreDone(chore){
  if(!isLoggedIn()) return false;
  return isParentLoggedIn() || currentMember().id === chore.memberId;
}
function totalPointsForMember(memberId){
  let total = 0;
  (state.choreLogs||[]).forEach(log=>{
    const chore = state.chores.find(c=>c.id===log.choreId);
    if(chore && chore.memberId===memberId) total += (chore.points||0);
  });
  return total;
}

function frequencyLabel(chore){
  let base = '';
  if(chore.frequency==='daily') base = 'Daily';
  else if(chore.frequency==='monthly') base = 'Monthly (day '+(chore.dayOfMonth||1)+')';
  else if(chore.frequency==='weekly'){
    base = (!chore.days || chore.days.length===0) ? 'Weekly' : chore.days.slice().sort().map(d=>DAYS[d]).join('/');
  }
  else if(chore.frequency==='fortnightly'){
    const dayPart = (!chore.days || chore.days.length===0) ? '' : ' ('+chore.days.slice().sort().map(d=>DAYS[d]).join('/')+')';
    base = 'Fortnightly'+dayPart;
  }
  else if(chore.frequency==='once'){
    base = chore.dueDate ? 'Once — '+formatDateNice(chore.dueDate) : 'Just once';
  }
  if(chore.dueTime) base += ' · by ' + minToLabel(timeInputToMin(chore.dueTime));
  return base;
}

function clampRange(s,e){
  return [Math.max(s,DAY_START), Math.min(e,DAY_END)];
}

function renderTimeAxis(){
  let ticks = '';
  for(let m=DAY_START; m<=DAY_END; m+=60){
    const top = (m-DAY_START)*PX_PER_MIN;
    ticks += `<div class="tick" style="top:${top}px">${minToLabel(m).replace(':00','')}</div>`;
  }
  // The invisible header spacer below MUST match .col-head exactly (same
  // class, same markup shape) — every day column has a real header row
  // (avatar + name) that pushes its grid content down; without a matching
  // spacer here, the time labels start higher than the actual grid,
  // making every block and the now-line appear to sit lower than the
  // time it's actually at.
  return `<div class="time-axis">
    <div class="col-head" style="visibility:hidden;"><span class="swatch"></span><span class="name">&nbsp;</span></div>
    <div class="time-axis-ticks" style="position:relative;height:${RANGE*PX_PER_MIN}px;">${ticks}</div>
  </div>`;
}

function renderGridlines(){
  let lines = '';
  for(let m=DAY_START; m<=DAY_END; m+=30){
    const top=(m-DAY_START)*PX_PER_MIN;
    const isHour = m%60===0;
    lines += `<div class="gridline ${isHour?'hour':''}" style="top:${top}px"></div>`;
  }
  return lines;
}

function renderNowLine(dateISO){
  if(dateISO !== todayISO()) return '';
  const now = new Date();
  const mins = now.getHours()*60+now.getMinutes();
  if(mins<DAY_START || mins>DAY_END) return '';
  const top=(mins-DAY_START)*PX_PER_MIN;
  return `<div class="nowline" style="top:${top}px"></div>`;
}

function renderMonthGrid(){
  const cursor = fromISODate(ui.monthCursor);
  const year = cursor.getFullYear(), month = cursor.getMonth();
  const firstOfMonth = new Date(year, month, 1);
  const lastOfMonth = new Date(year, month+1, 0);
  const gridStart = mondayOf(toISODate(firstOfMonth));
  const gridEndSunday = addDays(mondayOf(toISODate(lastOfMonth)), 6);
  const totalDays = Math.round((gridEndSunday.getTime()-gridStart.getTime())/(24*60*60*1000)) + 1;

  const weeks = [];
  let cursorDate = gridStart;
  for(let w=0; w<totalDays/7; w++){
    const week = [];
    for(let d=0; d<7; d++){
      week.push(toISODate(cursorDate));
      cursorDate = addDays(cursorDate, 1);
    }
    weeks.push(week);
  }

  const dayHeaderRow = DAYS.map(d=>`<div class="month-daylabel">${d}</div>`).join('');

  const weekRows = weeks.map(week=>{
    const cells = week.map(dateISO=>{
      const d = fromISODate(dateISO);
      const inMonth = d.getMonth()===month;
      const isToday = dateISO===todayISO();
      const dayEvents = eventsForDate(dateISO);
      const seen = new Set();
      const memberDots = [];
      dayEvents.forEach(e=>{
        if(seen.has(e.memberId)) return;
        seen.add(e.memberId);
        const m = memberById(e.memberId);
        if(m) memberDots.push(m.color);
      });
      const dotsHtml = memberDots.slice(0,4).map(c=>`<span class="month-dot" style="background:${c}"></span>`).join('')
        + (memberDots.length>4 ? `<span class="month-more">+${memberDots.length-4}</span>` : '');
      const hasTasks = choresForDate(dateISO).length>0;
      const hasTrips = (state.shoppingTrips||[]).some(t=>t.date===dateISO && !t.pendingApproval);
      return `<div class="month-cell ${inMonth?'':'month-cell-out'} ${isToday?'month-cell-today':''}" onclick="jumpToDayFromMonth('${dateISO}')">
        <div class="month-daynum">${d.getDate()}</div>
        <div class="month-dots">${dotsHtml}</div>
        <div class="month-ticks">
          ${hasTasks? '<span class="month-task-tick" title="Tasks due">✓</span>' : ''}
          ${hasTrips? '<span class="month-trip-tick" title="Shopping trip">🛒</span>' : ''}
        </div>
      </div>`;
    }).join('');
    return `<div class="month-week">${cells}</div>`;
  }).join('');

  return `<div class="month-grid"><div class="month-week month-header">${dayHeaderRow}</div>${weekRows}</div>`;
}

function renderWeekNav(){
  const wkEnd = addDays(ui.weekStart,6);
  const label = formatDateNice(ui.weekStart) + ' – ' + formatDateNice(toISODate(wkEnd));
  return `<div class="week-nav">
    <button class="arrow" onclick="shiftWeek(-1)">‹</button>
    <span class="label">${label}</span>
    <button class="arrow" onclick="shiftWeek(1)">›</button>

function renderDayRow(){
  const pills = DAYS.map((d,i)=>{
    const dateISO = toISODate(addDays(ui.weekStart,i));
    const cls = ['day-pill'];
    if(i===ui.selectedOffset) cls.push('active');
    if(dateISO===todayISO()) cls.push('today');
    return `<div class="${cls.join(' ')}" onclick="setDay(${i})">
      <span class="dname">${d}</span>
      <span class="dnum">${formatDateNice(dateISO)}</span>
    </div>`;
  }).join('');
  return `<div class="day-row">${pills}</div>`;
}

function layoutItems(items){
  // items: [{start,end,...}] -> assigns _col (0-based lane) and _cols (total lanes needed)
  // classic calendar-style greedy column packing, plus a real overlap flag per item
  const sorted = items.slice().sort((a,b)=> a.start-b.start || a.end-b.end);
  const colEndTimes = [];
  sorted.forEach(it=>{
    let placed = -1;
    for(let i=0;i<colEndTimes.length;i++){
      if(colEndTimes[i] <= it.start){ placed = i; break; }
    }
    if(placed === -1){ placed = colEndTimes.length; colEndTimes.push(it.end); }
    else { colEndTimes[placed] = it.end; }
    it._col = placed;
  });
  const totalCols = colEndTimes.length;
  sorted.forEach(it=>{
    it._cols = totalCols;
    it._conflict = items.some(o => o!==it && o.start < it.end && it.start < o.end);
  });
  return sorted;
}

function renderBoard(){
  if(ui.boardViewMode==='month'){
    return `
      ${renderBoardViewToggle()}
      ${renderMonthNav()}
      ${renderMonthGrid()}
    `;
  }

  const dateISO = selectedDateISO();
  const hidden = ui.hiddenBoardMembers || [];
  const visibleMembers = state.members.filter(m => !hidden.includes(m.id));

  const filterChips = state.members.length>1 ? `
    <div class="filter-chips">
      ${state.members.map(m=>{
        const isHidden = hidden.includes(m.id);
        return `<button class="filter-chip ${isHidden?'filter-chip-off':''}" onclick="toggleBoardMemberFilter('${m.id}')">
          <span class="dot" style="background:${m.color}"></span>${escapeHtml(m.name)}
        </button>`;
      }).join('')}
    </div>` : '';

  const cols = visibleMembers.map(m=>{
    const realItems = eventsForDateMember(dateISO, m.id).map(e=>({
      kind:'event', id:e.id, title:e.title, start:e.start, end:e.end,
      location:e.location, recurrence:e.recurrence, color:e.color||m.color,
      moved: !!e._movedOccurrence
    }));
    const transitItems = transitBlocksForDateDriver(dateISO, m.id).map(t=>({
      kind:'transit', id:t.sourceId+'_'+t.start, sourceId:t.sourceId, label:t.label, start:t.start, end:t.end
    }));
    // tasks with a due time show on the calendar too, not just the Tasks tab —
    // given a fixed short visual duration since tasks don't have a real end time
    const taskItems = choresForDateMember(dateISO, m.id)
      .filter(c => c.dueTime)
      .map(c => {
        const startMin = timeInputToMin(c.dueTime);
        return { kind:'task', id:c.id, title:c.title, start:startMin, end:startMin+20, color: m.color };
      });
    // shopping trips with a time set show here too, same reasoning
    const tripItemsForBoard = (state.shoppingTrips||[])
      .filter(t => t.memberId===m.id && t.date===dateISO && t.time && !t.pendingApproval)
      .map(t => {
        const startMin = timeInputToMin(t.time);
        return { kind:'trip', id:t.id, title:t.name, start:startMin, end:startMin+45, color: m.color };
      });
    const laidOut = layoutItems(realItems.concat(transitItems).concat(taskItems).concat(tripItemsForBoard));

    const blocks = laidOut.map(it=>{
      const [s,en] = clampRange(it.start,it.end);
      if(en<=s) return '';
      const top=(s-DAY_START)*PX_PER_MIN;
      const h=Math.max((en-s)*PX_PER_MIN, it.kind==='transit'?18:22);
      const widthPct = 100/it._cols;
      const leftPct = it._col*widthPct;
      const gutter = it._cols>1 ? 3 : 4;
      const posStyle = `top:${top}px;height:${h}px;left:calc(${leftPct}% + ${gutter}px);width:calc(${widthPct}% - ${gutter*2}px);`;

      if(it.kind==='transit'){
        const cls = it._conflict ? 'block transit conflict' : 'block transit';
        return `<div class="${cls}" style="${posStyle}" onclick="openEdit('${it.sourceId}','${dateISO}')">
          <div class="t">${it._conflict?'⚠ ':''}🚗 ${escapeHtml(it.label)}</div>
          <div class="m">${minToShort(it.start)}–${minToShort(it.end)}</div>
        </div>`;
      }
      if(it.kind==='task'){
        const cls = it._conflict ? 'block task-block conflict' : 'block task-block';
        return `<div class="${cls}" style="${posStyle}background:${it.color};" onclick="openChoreEdit('${it.id}')">
          <div class="t">${it._conflict?'⚠ ':''}✓ ${escapeHtml(it.title)}</div>
          <div class="m">${minToShort(it.start)}</div>
        </div>`;
      }
      if(it.kind==='trip'){
        const cls = it._conflict ? 'block trip-block conflict' : 'block trip-block';
        return `<div class="${cls}" style="${posStyle}background:${it.color};" onclick="jumpToTripFromElsewhere('${it.id}')">
          <div class="t">${it._conflict?'⚠ ':''}🛒 ${escapeHtml(it.title)}</div>
          <div class="m">${minToShort(it.start)}</div>
        </div>`;
      }
      const badge = it.moved ? ' <span style="opacity:.8">·moved</span>' : (it.recurrence==='weekly' ? '' : ' <span style="opacity:.7">·once</span>');
      const cls = it._conflict ? 'block conflict' : (it.moved ? 'block block-moved' : 'block');
      const bg = `background:${it.color};`;
      return `<div class="${cls}" style="${posStyle}${bg}" onclick="openEdit('${it.id}','${dateISO}')">
        <div class="t">${it._conflict?'⚠ ':''}${escapeHtml(it.title)}${badge}</div>
        <div class="m">${minToShort(it.start)}–${minToShort(it.end)}${it.location? ' · '+escapeHtml(it.location):''}</div>
      </div>`;
    }).join('');

    const isMe = m.id===ui.profileId;
    return `<div class="col">
      <div class="col-head" style="${isMe?'background:'+m.color+'22;':''}"><span class="swatch" style="background:${m.color}"></span><span class="name">${escapeHtml(m.name)}${isMe?' <span style="opacity:.6">· you</span>':''}</span></div>
      <div class="col-body" style="height:${RANGE*PX_PER_MIN}px" data-member="${m.id}" onclick="colClick(event,'${m.id}')">
        ${renderGridlines()}
        ${renderNowLine(dateISO)}
        ${blocks}
      </div>
    </div>`;
  }).join('');

  return `
    ${renderBoardViewToggle()}
    ${renderWeekNav()}
    ${renderDayRow()}
    ${filterChips}
    <div class="board-wrap">
      ${renderTimeAxis()}
      <div class="columns">${cols || '<div style="padding:40px;text-align:center;color:var(--text-dim);">All family members are hidden — tap a name above to show their column.</div>'}</div>
    </div>
    <button class="fab fab-secondary" onclick="openChoreAdd()">+ Add task</button>
    <button class="fab" onclick="openAdd(null)">+ Add activity</button>
  `;
}

function renderTripDetail(tripId){

  }

  const canEditItems = isParentLoggedIn();

  const statusLabel = {pending:'Pending', bought:'Bought', unavailable:'Unavailable'};

    <div class="trip-item-row ${statusClass[it.status]||''}">

          <div class="kd">${formatDateNice(trip.date)}${trip.time? ' · '+minToLabel(timeInputToMin(trip.time)):''} · ${member?escapeHtml(member.name):'Unassigned'}${trip.choreId?' · linked to a task':''}</div>
        </div>
        ${canEditMeta? `<button class="btn ghost" style="flex:none;" onclick="openTripEditModal('${trip.id}')">Edit</button>` : ''}
