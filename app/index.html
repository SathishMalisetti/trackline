<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Trackline — Family Schedule</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#181C2A;
    --ink-2:#232840;
    --ink-3:#2E3454;
    --line:#3A4066;
    --paper:#ECE7DA;
    --paper-dim:#D9D3C2;
    --amber:#E8A33D;
    --text-on-ink:#ECE9DD;
    --text-dim:#9AA0C0;
    --transit:#8C8676;
    --radius:10px;
    /* --ink is used in two very different ways throughout this file: as the
       dark TEXT color on light paper/amber surfaces (modals, buttons, forms —
       the majority of its uses), and — separately — as the app's dark
       BACKGROUND chrome (just body, the undo-toast, and the shop-add-bar
       input). Day mode only needs to flip the second kind. --chrome exists
       specifically for that, so --ink itself can stay fixed as "dark text"
       everywhere else, in both modes. */
    --chrome:#181C2A;
  }
  /* DAY MODE — the dark app-chrome background (header, board, tabs, month
     view, tiles) flips to a light, warm tone. Modals/cards/buttons are
     deliberately untouched here — they already use --paper (light) with
     --ink (dark text), which is correct in both modes and never needs to
     change. */
  body.day-mode{
    --ink-2:#EDE7D6;
    --ink-3:#DFD8C0;
    --line:#B8AF92;
    --text-on-ink:#1E1B0F;
    --text-dim:#4A4530;
    --chrome:#F7F3E8;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;}
  body{
    background:var(--chrome);
    color:var(--text-on-ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    -webkit-tap-highlight-color:transparent;
  }
  .app{max-width:1400px;margin:0 auto;height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;}

  /* HEADER / BOARD MASTHEAD */
  header.board{
    padding:22px 20px 16px;
    border-bottom:1px solid var(--line);
    display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;
    flex:none;background:var(--chrome);
  }
  .brand{display:flex;align-items:baseline;gap:12px;}
  .brand .flap{
    font-family:'Archivo Narrow',sans-serif;
    font-weight:800;
    font-size:28px;
    letter-spacing:0.04em;
    text-transform:uppercase;
    color:var(--text-on-ink);
  }
  .brand .flap span{color:var(--amber);}
  .brand .sub{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--text-dim);
    letter-spacing:0.08em;
    text-transform:uppercase;
  }
  nav.tabs{display:flex;gap:6px;flex-wrap:wrap;}
  nav.tabs button{
    font-family:'Archivo Narrow',sans-serif;
    font-weight:700;
    font-size:13px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    background:transparent;
    border:1px solid var(--line);
    color:var(--text-dim);
    padding:9px 16px;
    border-radius:6px;
    cursor:pointer;
    transition:all .15s ease;
  }
  nav.tabs button:hover{color:var(--text-on-ink);border-color:var(--text-dim);}
  nav.tabs button.active{background:var(--amber);color:var(--ink);border-color:var(--amber);}
  .nav-badge{
    display:inline-block;background:#D6484E;color:#fff;font-size:10px;font-weight:800;
    border-radius:9px;padding:1px 6px;margin-left:2px;vertical-align:middle;
  }

  /* PROFILE DROPDOWN */
  .header-right{display:flex;align-items:center;gap:14px;}
  .search-btn{
    background:var(--ink-2);border:1px solid var(--line);color:var(--text-on-ink);
    width:38px;height:38px;border-radius:50%;cursor:pointer;font-size:15px;flex:none;
  }
  .search-btn:hover{border-color:var(--text-dim);}
  .search-result{display:flex;align-items:center;gap:10px;padding:11px 4px;border-bottom:1px dashed #cfc7ac;cursor:pointer;}
  .search-result:last-child{border-bottom:none;}
  .search-result:hover{background:#e3dcc6;}
  .search-result .dot{width:10px;height:10px;border-radius:50%;flex:none;}
  .search-result .title{font-weight:700;font-size:14px;}
  .search-result .meta{font-size:11.5px;color:#6b6650;font-family:'IBM Plex Mono',monospace;}
  .filter-chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
  .filter-chip{
    display:flex;align-items:center;gap:6px;
    background:var(--ink-2);border:1px solid var(--line);color:var(--text-on-ink);
    padding:6px 12px;border-radius:16px;font-size:12.5px;font-weight:600;cursor:pointer;
  }
  .filter-chip .dot{width:9px;height:9px;border-radius:50%;flex:none;}
  .filter-chip-off{opacity:.4;}
  .filter-chip-off .dot{filter:grayscale(1);}

  /* MONTH VIEW */
  .month-grid{background:var(--ink-2);border:1px solid var(--line);border-radius:10px;overflow:hidden;}
  .month-week{display:grid;grid-template-columns:repeat(7,1fr);}
  .month-header{background:var(--ink-2);}
  .month-daylabel{
    padding:8px 4px;text-align:center;
    font-family:'Archivo Narrow',sans-serif;font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.03em;
    color:var(--text-dim);border-bottom:1px solid var(--line);
  }
  .month-cell{
    min-height:74px;padding:6px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);
    cursor:pointer;position:relative;
  }
  .month-cell:hover{background:var(--ink-3);}
  .month-week .month-cell:last-child{border-right:none;}
  .month-cell-out{opacity:.35;}
  .month-cell-today{background:rgba(232,163,61,.15);}
  .month-daynum{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--text-on-ink);margin-bottom:6px;}
  .month-dots{display:flex;flex-wrap:wrap;gap:3px;}
  .month-dot{width:7px;height:7px;border-radius:50%;flex:none;}
  .month-more{font-size:9px;color:var(--text-dim);font-family:'IBM Plex Mono',monospace;}
  .month-ticks{position:absolute;bottom:5px;right:6px;display:flex;gap:4px;align-items:center;}
  .month-task-tick{font-size:10px;color:var(--amber);}
  .month-trip-tick{font-size:9px;}
  @media(max-width:640px){
    .month-cell{min-height:52px;padding:4px;}
    .month-daynum{font-size:10.5px;margin-bottom:3px;}
  }

  .profile-wrap{position:relative;}
  .profile-btn{
    display:flex;align-items:center;gap:8px;
    background:var(--ink-2);border:1px solid var(--line);color:var(--text-on-ink);
    padding:7px 12px 7px 7px;border-radius:24px;cursor:pointer;
  }
  .profile-avatar{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-family:'Archivo Narrow',sans-serif;font-weight:800;font-size:12px;color:#151726;flex:none;}
  .profile-btn .pname{font-family:'Archivo Narrow',sans-serif;font-weight:700;font-size:13px;letter-spacing:.02em;text-transform:uppercase;}
  .profile-btn .caret{font-size:10px;color:var(--text-dim);}
  .profile-menu{
    position:absolute;top:calc(100% + 8px);right:0;min-width:190px;
    background:var(--paper);color:var(--ink);border-radius:10px;
    box-shadow:0 10px 30px rgba(0,0,0,.45);overflow:hidden;z-index:40;
  }
  .profile-item{display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;font-size:13.5px;font-weight:600;color:var(--ink);}
  .profile-item:hover{background:#e3dcc6;}
  .profile-item.current{background:#e3dcc6;}
  .profile-item .dot{width:20px;height:20px;border-radius:50%;flex:none;}
  .profile-menu-footer{border-top:1px solid #cfc7ac;padding:10px 14px;font-size:12px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:#5c5847;cursor:pointer;}
  .profile-menu-footer:hover{background:#e3dcc6;}
  .profile-none{padding:12px 14px;font-size:12.5px;color:#6b6650;}

  /* ONBOARDING */
  .onboard-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .onboard-card{background:var(--paper);color:var(--ink);border-radius:16px;padding:32px;max-width:420px;width:100%;}
  .onboard-brand{text-align:center;margin-bottom:22px;}
  .onboard-brand .flap{font-family:'Archivo Narrow',sans-serif;font-weight:800;font-size:26px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink);}
  .onboard-brand .flap span{color:#B8791F;}
  .onboard-brand .sub{font-family:'IBM Plex Mono',monospace;font-size:11px;color:#6b6650;letter-spacing:.08em;text-transform:uppercase;margin-top:2px;}
  .onboard-card h2{font-family:'Archivo Narrow',sans-serif;font-size:19px;text-transform:uppercase;letter-spacing:.02em;text-align:center;margin:0 0 6px;}
  .onboard-card .lead{font-size:13px;color:#5c5847;text-align:center;margin:0 0 20px;}
  .onboard-divider{display:flex;align-items:center;gap:10px;margin:18px 0 14px;color:#8a8468;font-size:11px;text-transform:uppercase;letter-spacing:.05em;}
  .onboard-divider::before,.onboard-divider::after{content:'';flex:1;height:1px;background:#cfc7ac;}

  /* PRE-LOGIN DASHBOARD */
  .dash-wrap{max-width:640px;margin:40px auto;padding:0 20px;text-align:center;}
  .dash-wrap h1{font-family:'Archivo Narrow',sans-serif;font-size:26px;text-transform:uppercase;letter-spacing:.02em;margin:0 0 6px;}
  .dash-wrap .dash-sub{color:var(--text-dim);font-size:14px;margin-bottom:32px;}
  .dash-stats{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-bottom:32px;}
  .dash-stat{background:var(--ink-2);border:1px solid var(--line);border-radius:12px;padding:20px 26px;min-width:130px;}
  .dash-stat .num{font-family:'IBM Plex Mono',monospace;font-size:30px;font-weight:600;color:var(--amber);}
  .dash-stat .label{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-dim);margin-top:4px;}
  .dash-cta{background:var(--amber);color:var(--ink);border:none;font-family:'Archivo Narrow',sans-serif;font-weight:800;letter-spacing:.03em;text-transform:uppercase;padding:14px 28px;border-radius:30px;font-size:14px;cursor:pointer;}

  main{padding:18px 20px 60px;flex:1;overflow-y:auto;}

  /* DAY SELECTOR */
  .week-nav{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap;}
  .week-nav .arrow{
    background:var(--ink-2);border:1px solid var(--line);color:var(--text-on-ink);
    width:34px;height:34px;border-radius:8px;cursor:pointer;font-size:15px;
  }
  .week-nav .label{font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--text-dim);letter-spacing:.03em;}
  .week-nav .today-btn{
    font-family:'Archivo Narrow',sans-serif;font-weight:700;font-size:12px;letter-spacing:.05em;text-transform:uppercase;
    background:transparent;border:1px solid var(--line);color:var(--text-dim);padding:7px 12px;border-radius:6px;cursor:pointer;
  }
  .day-row{display:flex;gap:4px;margin-bottom:18px;overflow-x:auto;padding-bottom:4px;}
  .day-pill{
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;font-weight:600;
    background:var(--ink-2);
    border:1px solid var(--line);
    color:var(--text-dim);
    padding:9px 16px;border-radius:8px;cursor:pointer;white-space:nowrap;
    display:flex;flex-direction:column;align-items:center;gap:2px;
    min-width:64px;
  }
  .day-pill .dname{font-family:'Archivo Narrow',sans-serif;font-weight:700;font-size:14px;letter-spacing:.04em;text-transform:uppercase;}
  .day-pill .dnum{font-size:11px;opacity:.75;}
  .day-pill.today{border-color:var(--amber);}
  .day-pill.active{background:var(--amber);color:var(--ink);border-color:var(--amber);}
  .day-pill.today .dname::after{content:" •";color:var(--amber);}
  .day-pill.active.today .dname::after{color:var(--ink);}
  .skip-note{font-size:12px;color:#6b6650;background:#e3dcc6;border-radius:7px;padding:8px 10px;margin:-4px 0 14px;}

  /* BOARD GRID */
  .board-wrap{display:flex;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--ink-2);}
  .time-axis{width:56px;flex:none;border-right:1px solid var(--line);}
  .time-axis .tick{
    position:absolute;left:0;right:0;
    font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--text-dim);
    padding-left:6px;transform:translateY(-6px);
  }
  .columns{display:flex;flex:1;overflow-x:auto;}
  .col{flex:1;min-width:150px;position:relative;border-right:1px solid var(--line);}
  .col:last-child{border-right:none;}
  .col-head{
    padding:10px 8px;border-bottom:1px solid var(--line);
    position:sticky;top:0;background:var(--ink-2);z-index:2;
    display:flex;align-items:center;gap:7px;
  }
  .swatch{width:10px;height:10px;border-radius:50%;flex:none;}
  .col-head .name{font-family:'Archivo Narrow',sans-serif;font-weight:700;font-size:14px;letter-spacing:.03em;text-transform:uppercase;}
  .col-body{position:relative;cursor:crosshair;}
  .gridline{position:absolute;left:0;right:0;border-top:1px solid var(--line);opacity:.55;}
  .gridline.hour{opacity:.9;}
  .nowline{position:absolute;left:0;right:0;height:2px;background:var(--amber);z-index:3;}
  .nowline::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--amber);}

  .block{
    position:absolute;
    border-radius:6px;padding:6px 8px;overflow:hidden;
    cursor:pointer;border:1px solid rgba(0,0,0,.25);
    box-shadow:0 2px 6px rgba(0,0,0,.25);
    z-index:1;
  }
  .block .t{font-weight:700;font-size:12.5px;line-height:1.2;color:#151726;}
  .block .m{font-family:'IBM Plex Mono',monospace;font-size:10px;color:#151726;opacity:.75;margin-top:2px;}
  .block.transit{
    background:repeating-linear-gradient(135deg, var(--transit), var(--transit) 6px, #6f6a5c 6px, #6f6a5c 12px);
    color:#fff;border-color:#5c5748;
  }
  .block.transit .t,.block.transit .m{color:#fff;}
  .block.conflict{
    border:2px solid #D6484E;
    box-shadow:0 0 0 1px #D6484E, 0 2px 6px rgba(0,0,0,.3);
    z-index:2;
  }
  .block-moved{
    border:2px dashed var(--amber);
  }
  .task-block{border:1.5px dashed rgba(0,0,0,.35);}
  .trip-block{border:1.5px dotted rgba(0,0,0,.35);}

  /* FAB */
  .undo-toast{
    position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:60;
    background:var(--chrome);color:var(--text-on-ink);border:1px solid var(--line);
    border-radius:10px;padding:12px 14px;display:flex;align-items:center;gap:14px;
    box-shadow:0 8px 24px rgba(0,0,0,.5);font-size:13.5px;max-width:90vw;
  }
  .undo-toast button{
    font-family:'Archivo Narrow',sans-serif;font-weight:800;letter-spacing:.03em;text-transform:uppercase;
    background:var(--amber);color:var(--ink);border:none;padding:7px 14px;border-radius:6px;font-size:12px;cursor:pointer;
  }
  .undo-toast-x{background:transparent !important;color:var(--text-dim) !important;padding:4px 6px !important;font-size:14px !important;}
  .fab{
    position:fixed;right:22px;bottom:22px;z-index:20;
    background:var(--amber);color:var(--ink);border:none;
    font-family:'Archivo Narrow',sans-serif;font-weight:800;letter-spacing:.04em;text-transform:uppercase;
    padding:14px 22px;border-radius:30px;font-size:14px;cursor:pointer;
    box-shadow:0 6px 20px rgba(0,0,0,.4);
  }
  .fab.fab-secondary{
    bottom:78px;
    background:var(--ink-2);color:var(--text-on-ink);border:1px solid var(--line);
  }

  /* MODAL */
  .overlay{position:fixed;inset:0;background:rgba(10,11,18,.72);display:flex;align-items:center;justify-content:center;z-index:30;padding:16px;}
  .modal{background:var(--paper);color:var(--ink);width:100%;max-width:440px;border-radius:14px;padding:22px;max-height:88vh;overflow-y:auto;}
  .modal h2{font-family:'Archivo Narrow',sans-serif;font-size:20px;letter-spacing:.02em;margin:0 0 14px;text-transform:uppercase;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#5c5847;margin-bottom:5px;}
  .field input[type=text],.field input[type=time],.field input[type=number],.field select{
    width:100%;padding:10px 11px;border-radius:7px;border:1px solid #c9c2ab;background:#fff;
    font-family:'Inter',sans-serif;font-size:14px;color:var(--ink);
  }
  .row2{display:flex;gap:10px;}
  .row2 > *{flex:1;}
  .checkline{display:flex;align-items:center;gap:9px;margin:6px 0 14px;}
  .checkline input{width:18px;height:18px;}
  .checkline label{font-size:13.5px;font-weight:600;}
  .modal-actions{display:flex;justify-content:space-between;align-items:center;margin-top:18px;}
  .btn{
    font-family:'Archivo Narrow',sans-serif;font-weight:700;letter-spacing:.03em;text-transform:uppercase;
    border:none;border-radius:8px;padding:11px 18px;font-size:13.5px;cursor:pointer;
  }
  .btn.primary{background:var(--ink);color:var(--paper);}
  .btn.ghost{background:transparent;color:#8a5a3a;border:1px solid #8a5a3a;}
  .btn.danger{background:transparent;color:#a5323a;font-size:12px;padding:8px 12px;}

  /* KID VIEW */
  .kid-select{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;}
  .kid-select button{
    font-family:'Archivo Narrow',sans-serif;font-weight:700;font-size:15px;letter-spacing:.02em;text-transform:uppercase;
    border:2px solid var(--line);background:var(--ink-2);color:var(--text-dim);padding:12px 20px;border-radius:10px;cursor:pointer;
  }
  .kid-select button.active{color:var(--ink);}
  .kid-big{background:var(--paper);color:var(--ink);border-radius:16px;padding:26px;}
  .kid-big h2{font-family:'Archivo Narrow',sans-serif;font-size:26px;letter-spacing:.02em;margin:0 0 4px;text-transform:uppercase;}
  .kid-big .kd{font-family:'IBM Plex Mono',monospace;color:#6b6650;margin-bottom:20px;}
  .kid-item{display:flex;gap:16px;padding:16px 0;border-bottom:1px dashed #cfc7ac;align-items:flex-start;}
  .kid-item:last-child{border-bottom:none;}
  .kid-time{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:16px;min-width:100px;color:#5c5847;}
  .kid-title{font-weight:700;font-size:20px;}
  .kid-loc{color:#6b6650;font-size:14px;margin-top:2px;}
  .kid-empty{padding:30px 0;text-align:center;color:#8a8468;font-size:15px;}

  /* CHORES */
  .chore-group{background:var(--paper);color:var(--ink);border-radius:14px;padding:18px 20px;margin-bottom:16px;}
  .chore-group-head{display:flex;align-items:center;gap:9px;margin-bottom:12px;}
  .chore-group-head .swatch{width:12px;height:12px;border-radius:50%;flex:none;}
  .chore-group-head .name{font-family:'Archivo Narrow',sans-serif;font-weight:700;font-size:15px;text-transform:uppercase;letter-spacing:.02em;}
  .chore-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px dashed #cfc7ac;}
  .chore-row:last-child{border-bottom:none;}
  .chore-info{flex:1;cursor:pointer;}
  .chore-title{font-weight:700;font-size:14.5px;}
  .chore-freq{font-size:11px;color:#8a8468;font-family:'IBM Plex Mono',monospace;margin-top:2px;}
  .chore-done-badge{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:#3d7a4f;background:#dcecdf;border-radius:20px;padding:6px 12px;cursor:pointer;white-space:nowrap;}
  .chore-pending-btn{font-family:'Archivo Narrow',sans-serif;font-weight:700;font-size:12px;letter-spacing:.03em;text-transform:uppercase;background:var(--ink);color:var(--paper);border:none;border-radius:20px;padding:9px 16px;cursor:pointer;white-space:nowrap;}
  .chore-locked-btn{font-size:11.5px;color:#8a8468;white-space:nowrap;}
  .chore-empty-day{text-align:center;color:var(--text-dim);padding:40px 0;font-size:14px;}
  .shop-row{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px dashed #cfc7ac;}
  .shop-row:last-child{border-bottom:none;}
  .shop-check-label{display:flex;align-items:center;gap:12px;font-size:15px;font-weight:600;cursor:pointer;flex:1;}
  .shop-check-label input{width:19px;height:19px;flex:none;}
  .shop-row-checked .shop-check-label span{text-decoration:line-through;color:#8a8468;font-weight:400;}
  .shop-row-selected{background:rgba(232,163,61,.15);border-radius:6px;padding-left:6px;margin-left:-6px;}
  .shop-select-check{width:19px;height:19px;accent-color:var(--amber);flex:none;}
  .shop-remove{background:none;border:none;color:#a5323a;cursor:pointer;font-size:16px;padding:4px 8px;}
  .shop-divider{font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:#8a8468;padding:14px 0 6px;border-top:1px solid #cfc7ac;margin-top:6px;}

<body>
<div id="account-bar" hidden style="padding:8px;text-align:right;background:#181c2a;color:white"><button onclick="tracklineAuth.lock()">Switch member</button> <button onclick="tracklineAuth.signOut()">Sign out of account</button></div>
<div id="root" class="app"></div>

<script src="/auth-client.js"></script>
<script src="/auth.js"></script>
<script src="/family-auth.js"></script>
<script>
// ==============================================================================
// No database URLs or keys live here anymore — on purpose. The browser only
// ever talks to its own domain's /api/family-data and /api/chore-log, which
// are Azure Functions deployed alongside this file. Those Functions hold the
// real Supabase/Cosmos DB credentials as server-only settings (never sent to
// the browser). "View Source" on this page reveals nothing about the database.
// See azure-backend/README.md for how those Functions are configured.
// ==============================================================================
const API_BASE = ''; // '' = same origin (normal case, since the API is hosted alongside this file)
const FAMILY_ENDPOINT = API_BASE + '/api/family-data';
const CHORE_LOG_ENDPOINT = API_BASE + '/api/chore-log';
const TRIP_ENDPOINT = API_BASE + '/api/shopping-trip';
const DEVICE_USAGE_ENDPOINT = API_BASE + '/api/device-usage';
const DEVICE_USAGE_DETAIL_ENDPOINT = API_BASE + '/api/device-usage-detail';
const DEVICE_LIST_ENDPOINT = API_BASE + '/api/device-list';
// Update this to your actual GitHub release/raw link once the agent zip is uploaded.
const TRACKLINE_AGENT_DOWNLOAD_URL = 'https://raw.githubusercontent.com/SathishMalisetti/trackline/main/releases/latest/download/TracklineAgent.zip';
const DEVICE_DEREGISTER_ENDPOINT = API_BASE + '/api/device-deregister';
const JOIN_FAMILY_ENDPOINT = API_BASE + '/api/join-family';
// Study module — curriculum content (subjects/topics/questions) is global,
// shared across every family, so it's fetched like device usage rather than
// stored in the per-family blob. Progress/exam results ARE per-family and
// stay in state.topicProgress, saved through the normal storageSet blob.
const STUDY_TOPICS_ENDPOINT = API_BASE + '/api/study-topics';       // GET ?yearLevel=4
const STUDY_EXAM_START_ENDPOINT = API_BASE + '/api/study-exam-start'; // POST {topicId} -> sampled questions, no answers included
const STUDY_EXAM_SUBMIT_ENDPOINT = API_BASE + '/api/study-exam-submit'; // POST {familyId, kidId, topicId, attemptId, answers} -> scored server-side
const STUDY_ASSIGNMENTS_ENDPOINT = API_BASE + '/api/study-assignments'; // GET ?familyId&kidId&weekOffset -> this week's term-assigned work
const STUDY_SET_YEAR_LEVEL_ENDPOINT = API_BASE + '/api/study-set-year-level'; // POST {familyId,kidId,yearLevel,calendarYear} -> saves year_level directly, wipes+regenerates schedule

// ---- portable storage layer -------------------------------------------------
// Two modes, auto-detected:
//  1) Inside a Claude artifact: window.storage exists -> use it (per-Claude-account storage).
//  2) Everywhere else: talk to this domain's own /api/family-data (backed by
//     whatever database the deployed Function is configured for). If that API
//     isn't reachable (e.g. testing this file locally with no backend deployed
//     yet), everything gracefully falls back to the browser's own localStorage
//     instead of failing outright.
//     IMPORTANT LIMITATION of the localStorage fallback: it does NOT sync
//     across devices/browsers — each device keeps its own separate copy.
let backendReachable = null; // null = unknown yet, true/false once we've tried

const hasClaudeStorage = (typeof window !== 'undefined') && window.storage && typeof window.storage.get === 'function';
const STORAGE_MODE_LABEL = () => hasClaudeStorage ? 'claude' : (backendReachable ? 'cloud' : (backendReachable===false ? 'local' : 'checking'));

const LOCAL_FAMILY_ID_KEY = 'trackline-family-id'; // small pointer kept locally even in cloud mode, so this browser knows which family record to fetch
const LOCAL_KIOSK_KEY = 'trackline-kiosk-family-id'; // set only when a parent explicitly enables kiosk mode ON THIS DEVICE — bound to one family id, never portable via URL/link

// ---------------------------------------------------------------------
// Foreground browser notifications — reminders before upcoming tasks and
// activities. Only fires while this tab is open (even backgrounded), not
// if the browser is fully closed — that would need a service worker and
// server-triggered push, a much bigger piece deliberately out of scope
// for now. Preferences are per-device (localStorage), not synced to the
// family, since different devices may reasonably want different timing.
// ---------------------------------------------------------------------

const LOCAL_NOTIFY_PREFS_KEY = 'trackline-notify-prefs';
const LOCAL_NOTIFIED_KEY = 'trackline-notified-reminders';

function getNotifyPrefs(){
  try {
    const raw = window.localStorage.getItem(LOCAL_NOTIFY_PREFS_KEY);
    if(raw) return Object.assign({enabled:false, firstReminder:30, secondReminder:15}, JSON.parse(raw));
  } catch(e){}
  return { enabled:false, firstReminder:30, secondReminder:15 };
}
function saveNotifyPrefs(prefs){
  try { window.localStorage.setItem(LOCAL_NOTIFY_PREFS_KEY, JSON.stringify(prefs)); } catch(e){}
}
function enableNotifications(){
  if(typeof Notification==='undefined'){
    showAlert('This browser does not support notifications.');
    return Promise.resolve();
  }
  return Notification.requestPermission().then(function(perm){
    const prefs = getNotifyPrefs();
    if(perm==='granted'){
      prefs.enabled = true;
      saveNotifyPrefs(prefs);
      showAlert("Notifications enabled on this device — you'll get a reminder before upcoming tasks and activities while this tab is open.");
    } else {
      prefs.enabled = false;
      saveNotifyPrefs(prefs);
      showAlert('Notifications were not allowed. You can change this in your browser\'s site settings.');
    }
    render();
  });
}
function disableNotifications(){
  const prefs = getNotifyPrefs();
  prefs.enabled = false;
  saveNotifyPrefs(prefs);
  render();
}
function setNotifyReminderMinutes(which, minutes){
  const prefs = getNotifyPrefs();
  const val = parseInt(minutes,10);
  if(isNaN(val) || val<0) return;
  prefs[which] = val;
  saveNotifyPrefs(prefs);
}

function getAlreadyNotifiedSet(){
  try {
    const raw = window.localStorage.getItem(LOCAL_NOTIFIED_KEY);
    if(raw) return new Set(JSON.parse(raw));
  } catch(e){}
  return new Set();
}
function markNotified(key){
  const s = getAlreadyNotifiedSet();
  s.add(key);
  const today = todayISO();
  const pruned = Array.from(s).filter(function(k){ return k.indexOf(today)!==-1; });
  try { window.localStorage.setItem(LOCAL_NOTIFIED_KEY, JSON.stringify(pruned)); } catch(e){}
}

function upcomingReminderItems(){
  // Scoped by who's viewing: a parent (or a kiosk device, which always
  // shows Parent View) sees everyone's upcoming items; a kid sees only
  // their own — matching the same scoping the rest of the app already
  // uses for Kid View vs Parent View.
  const dateISO = todayISO();
  let memberIds;
  if(isKioskDevice() && !isLoggedIn()){
    memberIds = state.members.map(function(m){ return m.id; });
  } else if(isParentLoggedIn()){
    memberIds = state.members.map(function(m){ return m.id; });
  } else if(isLoggedIn()){
    const m = currentMember();
    memberIds = m ? [m.id] : [];
  } else {
    return [];
  }

  const items = [];
  memberIds.forEach(function(mid){
    eventsForDateMember(dateISO, mid).forEach(function(e){
      items.push({ type:'activity', id:e.id, title:e.title, memberId:mid, startMin:e.start, date:dateISO });
    });
    choresForDateMember(dateISO, mid).forEach(function(c){
      if(!c.dueTime) return; // no specific time to count down to
      items.push({ type:'task', id:c.id, title:c.title, memberId:mid, startMin:timeInputToMin(c.dueTime), date:dateISO });
    });
  });
  return items;
}

function checkAndFireNotificationReminders(){
  const prefs = getNotifyPrefs();
  if(!prefs.enabled) return;
  if(typeof Notification==='undefined' || Notification.permission!=='granted') return;

  const now = new Date();
  const nowMin = now.getHours()*60 + now.getMinutes();
  const offsets = [prefs.firstReminder, prefs.secondReminder].filter(function(o){ return o>0; });
  if(offsets.length===0) return;
  const already = getAlreadyNotifiedSet();

  upcomingReminderItems().forEach(function(item){
    offsets.forEach(function(offset){
      const triggerMin = item.startMin - offset;
      if(nowMin===triggerMin){
        const key = item.type+'-'+item.id+'-'+offset+'-'+item.date;
        if(!already.has(key)){
          const member = memberById(item.memberId);
          const label = item.type==='task' ? 'Task' : 'Activity';
          try {
            new Notification(label+' in '+offset+' min', {
              body: item.title + (member ? ' — '+member.name : ''),
            });
          } catch(e){}
          markNotified(key);
        }
      }
    });
  });
}

function isKioskDevice(){
  if(typeof window==='undefined' || !window.localStorage) return false;
  const bound = window.localStorage.getItem(LOCAL_KIOSK_KEY);
  return !!bound && !!state.family && bound===state.family.id;
}
function enableKioskMode(){
  if(!isParentLoggedIn()) return; // only a logged-in parent can turn this on for a device
  showConfirm(
    `Make this device always show ${state.family.name || 'this family'}'s Parent View, without needing to log in? Anyone using this device can view it — a small Login button stays available for making changes.`,
    ()=>{
      try{ window.localStorage.setItem(LOCAL_KIOSK_KEY, state.family.id); }catch(e){}
      showAlert('This device is now set up as a display. Reload the page to see it in kiosk mode.');
      render();
    }
  );
}
function disableKioskMode(){
  if(!isParentLoggedIn()) return;
  try{ window.localStorage.removeItem(LOCAL_KIOSK_KEY); }catch(e){}
  render();
}

async function storageGet(key){
  if(hasClaudeStorage){
    try{ return await window.storage.get(key); } catch(e){ return null; }
  }
  if(key==='trackline-data'){
    const familyId = window.localStorage.getItem(LOCAL_FAMILY_ID_KEY);
    if(familyId){
      try{
        const res = await tracklineAuth.fetch(`${FAMILY_ENDPOINT}?familyId=${encodeURIComponent(familyId)}`);
        if(res.ok){
          backendReachable = true;
          const data = await res.json();
          if(data) return {key, value: JSON.stringify(data)};
          return null; // backend reachable, but this family genuinely doesn't exist there
        }
      } catch(e){ backendReachable = false; console.error('Backend not reachable, using local copy for now', e); }
    }
  }
  try{
    const v = window.localStorage.getItem(key);
    return v!==null ? {key, value:v} : null;
  } catch(e){ return null; }
}
async function storageSet(key, value){
  if(hasClaudeStorage){
    try{ return await window.storage.set(key, value); } catch(e){ return null; }
  }
  // Always write locally first, so nothing is ever lost even if the network/backend is down.
  try{ window.localStorage.setItem(key, value); } catch(e){}

  if(key==='trackline-data'){
    try{
      const parsed = JSON.parse(value);
      const familyId = (parsed.family && parsed.family.id) || window.localStorage.getItem(LOCAL_FAMILY_ID_KEY);
      if(familyId){
        window.localStorage.setItem(LOCAL_FAMILY_ID_KEY, familyId);
        // choreLogs and shoppingTrips are stored/synced separately (their own
        // tables) to avoid rewriting the whole family record every time one
        // task gets checked off or one shopping trip's items change.
        const { choreLogs, shoppingTrips, ...rest } = parsed;
        const res = await tracklineAuth.fetch(FAMILY_ENDPOINT, {
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify({familyId, data: rest})
        });
        backendReachable = res.ok;
        if(!res.ok){ const error=await res.json().catch(()=>({})); throw new Error(error.error || 'Could not save changes to the database.'); }
      }
    } catch(e){ backendReachable = false; throw e; }
  }
  return {key, value};
}

// Looks up a family's data by ID directly, bypassing this browser's local
// pointer — used only by the "join an existing family" flow, where a new
// device doesn't have that pointer set yet.
async function fetchFamilyById(familyId){
  if(hasClaudeStorage) return null; // Claude storage is already account-scoped; joining by ID doesn't apply here
  try{
    const res = await tracklineAuth.fetch(`${FAMILY_ENDPOINT}?familyId=${encodeURIComponent(familyId)}`);
    if(!res.ok) return null;
    return await res.json();
  } catch(e){ console.error('Lookup failed, check network/deployment', e); return null; }
}

// Chore completion logs live in their own table server-side (they grow every
// day, unlike everything else which stays roughly constant in size), synced
// through these two dedicated calls instead of the big family blob.
async function pushChoreLog(logEntry){
  if(hasClaudeStorage) return; // Claude mode keeps everything in the one blob, no separate log table there
  try{
    await tracklineAuth.fetch(CHORE_LOG_ENDPOINT, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(logEntry)
    });
  } catch(e){ console.error('Chore log sync failed (saved locally, will still show on this device)', e); }
}
async function deleteChoreLog(familyId, choreId, date){
  if(hasClaudeStorage) return;
  try{

const DAYS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
// ---------------------------------------------------------------------
// CSV import — tasks and activities. Parser handles quoted fields with
// embedded commas (e.g. "Mon,Wed,Fri" as one column value), matching
// the sample files' format. Validators are pure functions returning
// {valid, errors, data} per row, so the whole pipeline (parse, validate,
// preview, confirm, create) can run without touching the DOM until the
// final "Import" click.
// ---------------------------------------------------------------------

function parseCSV(text){
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(inQuotes){
      if(c==='"'){
        if(text[i+1]==='"'){ field+='"'; i++; }
        else inQuotes = false;
      } else field += c;
    } else {
      if(c==='"') inQuotes = true;
      else if(c===','){ row.push(field); field=''; }
      else if(c==='\n' || c==='\r'){
        if(c==='\r' && text[i+1]==='\n') i++;
        row.push(field); field='';
        if(!(row.length===1 && row[0]==='')) rows.push(row);
        row=[];
      } else field += c;
    }
  }
  if(field!=='' || row.length>0){ row.push(field); rows.push(row); }
  return rows;
}

function csvRowsToObjects(rows){
  if(rows.length===0) return [];
  const header = rows[0].map(h=>h.trim());
  return rows.slice(1).map(row=>{
    const obj = {};
    header.forEach((h,i)=>{ obj[h] = (row[i]!==undefined ? row[i] : '').trim(); });
    return obj;
  });
}

function validateTaskImportRow(row, members){
  const errors = [];
  const member = members.find(m=>m.name===row.member_name);
  if(!row.member_name) errors.push('member_name is required');
  else if(!member) errors.push('member_name "'+row.member_name+'" doesn\'t match any family member');

  const title = row.title;
  if(!title) errors.push('title is required');

  const frequency = row.frequency;
  if(['once','daily','weekly','fortnightly','monthly'].indexOf(frequency)===-1){
    errors.push('frequency must be once/daily/weekly/fortnightly/monthly, got "'+frequency+'"');
  }

  let days = [];
  if(frequency==='weekly' || frequency==='fortnightly'){
    if(!row.days) errors.push('days is required for '+frequency);
    else {
      days = row.days.split(',').map(d=>d.trim()).map(d=>DAYS.indexOf(d));
      if(days.some(d=>d===-1)) errors.push('days contains a value that is not a valid day name (Mon/Tue/Wed/Thu/Fri/Sat/Sun)');
    }
  }

  let dayOfMonth = null;
  if(frequency==='monthly'){
    dayOfMonth = parseInt(row.day_of_month,10);
    if(!row.day_of_month || isNaN(dayOfMonth) || dayOfMonth<1 || dayOfMonth>31) errors.push('day_of_month must be 1-31 for monthly');
  }

  let dueDate = null;
  if(frequency==='once'){
    dueDate = row.due_date;
    if(!dueDate || !/^\d{4}-\d{2}-\d{2}$/.test(dueDate)) errors.push('due_date (YYYY-MM-DD) is required for once');
  }

  const startDate = row.start_date || null;
  if(startDate && !/^\d{4}-\d{2}-\d{2}$/.test(startDate)) errors.push('start_date must be YYYY-MM-DD');

  const dueTime = row.due_time || null;
  if(dueTime && !/^\d{2}:\d{2}$/.test(dueTime)) errors.push('due_time must be HH:MM');

  const pointsStr = row.points;
  const points = pointsStr ? parseInt(pointsStr,10) : 0;
  if(pointsStr && isNaN(points)) errors.push('points must be a number');

  // Match saveChore()'s exact behavior: a recurring task's start defaults
  // to today if left blank, and never allowed to sit in the past either
  // way — same rule as the manual form applies, so CSV-imported tasks
  // behave identically to one added by hand.
  const today = todayISO();
  let resolvedStartDate = startDate;
  if(['daily','weekly','fortnightly','monthly'].indexOf(frequency)!==-1){
    resolvedStartDate = startDate || today;
    if(resolvedStartDate < today) resolvedStartDate = today;
  }
  let resolvedDueDate = dueDate;
  if(frequency==='once' && dueDate && dueDate < today) resolvedDueDate = today;

  return {
    valid: errors.length===0,
    errors: errors,
    data: errors.length===0 ? {
      memberId: member.id, title: title, frequency: frequency, days: days, dayOfMonth: dayOfMonth,
      startDate: resolvedStartDate, dueDate: resolvedDueDate, dueTime: dueTime,
      points: isNaN(points)?0:points, icon: row.icon || null,
    } : null,
  };
}

function validateActivityImportRow(row, members){
  const errors = [];
  const member = members.find(m=>m.name===row.member_name);
  if(!row.member_name) errors.push('member_name is required');
  else if(!member) errors.push('member_name "'+row.member_name+'" doesn\'t match any family member');

  const title = row.title;
  if(!title) errors.push('title is required');

  const recurrence = row.recurrence;
  if(['once','weekly'].indexOf(recurrence)===-1) errors.push('recurrence must be once or weekly, got "'+recurrence+'"');

  let days = [];
  if(recurrence==='weekly'){
    if(!row.days) errors.push('days is required for weekly');
    else {
      days = row.days.split(',').map(d=>d.trim()).map(d=>DAYS.indexOf(d));
      if(days.some(d=>d===-1)) errors.push('days contains a value that is not a valid day name (Mon/Tue/Wed/Thu/Fri/Sat/Sun)');
    }
  }

  let date = null;
  if(recurrence==='once'){
    date = row.date;
    if(!date || !/^\d{4}-\d{2}-\d{2}$/.test(date)) errors.push('date (YYYY-MM-DD) is required for once');
  }

  const timePattern = /^\d{2}:\d{2}$/;
  if(!row.start_time || !timePattern.test(row.start_time)) errors.push('start_time (HH:MM) is required');
  if(!row.end_time || !timePattern.test(row.end_time)) errors.push('end_time (HH:MM) is required');
  const start = row.start_time ? timeInputToMin(row.start_time) : null;
  const end = row.end_time ? timeInputToMin(row.end_time) : null;
  if(start!=null && end!=null && end<=start) errors.push('end_time must be after start_time');

  const needsDrive = (row.needs_drive||'').toLowerCase()==='yes';
  let driverId = null, travelMin = 0;
  if(needsDrive){
    const driver = members.find(m=>m.name===row.driver_name);
    if(!row.driver_name) errors.push('driver_name is required when needs_drive is yes');
    else if(!driver) errors.push('driver_name "'+row.driver_name+'" doesn\'t match any family member');
    else driverId = driver.id;
    const travelStr = row.travel_minutes;
    travelMin = travelStr ? parseInt(travelStr,10) : NaN;
    if(!travelStr || isNaN(travelMin)) errors.push('travel_minutes is required (a number) when needs_drive is yes');
  }

  const recurrenceEndDate = row.repeats_until || null;
  if(recurrenceEndDate && !/^\d{4}-\d{2}-\d{2}$/.test(recurrenceEndDate)) errors.push('repeats_until must be YYYY-MM-DD');

  return {
    valid: errors.length===0,
    errors: errors,
    data: errors.length===0 ? {
      memberId: member.id, title: title, recurrence: recurrence, days: days, date: date, start: start, end: end,
      location: row.location||'', notes: row.notes||'',
      needsDrive: needsDrive, driverId: driverId, travelMin: isNaN(travelMin)?0:travelMin,
      recurrenceEndDate: recurrenceEndDate,
    } : null,
  };
}

function simpleHash(str){
  // Basic non-cryptographic hash — this is a lightweight device PIN lock for a shared
  // family tablet, not encryption-grade security. Good enough to stop casual tampering.
  let h = 5381;
  for(let i=0;i<str.length;i++){ h = ((h*33) ^ str.charCodeAt(i)) >>> 0; }
  return h.toString(16);
}

function cid(){ return 'e' + Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4); }

function genFamilyId(){
  // Short, typeable code — this is both the database row id AND the code
  // shared with family members so their own devices can join. Excludes
  // easily-confused characters (0/O, 1/I/L) since a human has to type this.
  const alphabet = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
  let s = '';
  for(let i=0;i<8;i++){ s += alphabet[Math.floor(Math.random()*alphabet.length)]; }
  return s;
}

function pad2(n){ return n<10 ? '0'+n : ''+n; }
function minToLabel(m){
  let h = Math.floor(m/60), mm = m%60;
  const ap = h>=12?'PM':'AM';
  let h12 = h%12; if(h12===0) h12=12;
  return h12+':'+pad2(mm)+' '+ap;
}
function minToShort(m){
  let h = Math.floor(m/60), mm = m%60;
  return pad2(h)+':'+pad2(mm);
}
function timeInputToMin(v){ // "HH:MM"
  if(!v) return null;
  const [h,m] = v.split(':').map(Number);
  return h*60+m;
}
function minToTimeInput(m){
  return pad2(Math.floor(m/60))+':'+pad2(m%60);
}

// ---- date helpers (all dates handled as local, ISO 'YYYY-MM-DD' strings) ----
function toISODate(d){
  return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
}
function fromISODate(s){
  const [y,m,d] = s.split('-').map(Number);
  return new Date(y, m-1, d);
}
function addDays(dateOrISO, n){
  const d = typeof dateOrISO === 'string' ? fromISODate(dateOrISO) : new Date(dateOrISO);
  d.setDate(d.getDate()+n);
  return d;
}
function mondayOf(dateOrISO){
  const d = typeof dateOrISO === 'string' ? fromISODate(dateOrISO) : new Date(dateOrISO);
  const jsDow = d.getDay(); // 0=Sun
  const offset = jsDow===0 ? -6 : 1-jsDow;
  return addDays(d, offset);
}
function dowMonIndexed(dateOrISO){
  const d = typeof dateOrISO === 'string' ? fromISODate(dateOrISO) : new Date(dateOrISO);
  const j = d.getDay();
  return j===0 ? 6 : j-1;
}
function todayISO(){ return toISODate(new Date()); }
function formatDateNice(iso){
  const d = fromISODate(iso);
  return d.toLocaleDateString(undefined, {month:'short', day:'numeric'});
}
// Returns the ISO date of the next occurrence of a given weekday (0=Mon..6=Sun)
// on or after todayISO() + minDaysAhead days. Used to build example/demo data
// that always feels current and upcoming, regardless of what day it's viewed —
// never a stale hardcoded date, never something that's already in the past.
function nextWeekdayFrom(weekdayIndex, minDaysAhead){
  let d = addDays(todayISO(), minDaysAhead||0);
  let guard = 0;
  while(dowMonIndexed(toISODate(d)) !== weekdayIndex && guard<8){
    d = addDays(d, 1);
    guard++;
  }
  return toISODate(d);
}
