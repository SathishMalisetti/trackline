<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Trackline — Family Schedule</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#181C2A;
    --ink-2:#232840;
    --ink-3:#2E3454;
    --line:#3A4066;
    --paper:#ECE7DA;
    --paper-dim:#D9D3C2;
    --amber:#E8A33D;
    --text-on-ink:#ECE9DD;
    --text-dim:#9AA0C0;
    --transit:#8C8676;
    --radius:10px;
    /* --ink is used in two very different ways throughout this file: as the
       dark TEXT color on light paper/amber surfaces (modals, buttons, forms —
       the majority of its uses), and — separately — as the app's dark
       BACKGROUND chrome (just body, the undo-toast, and the shop-add-bar
       input). Day mode only needs to flip the second kind. --chrome exists
       specifically for that, so --ink itself can stay fixed as "dark text"
       everywhere else, in both modes. */
    --chrome:#181C2A;
  }
  /* DAY MODE — the dark app-chrome background (header, board, tabs, month
     view, tiles) flips to a light, warm tone. Modals/cards/buttons are
     deliberately untouched here — they already use --paper (light) with
     --ink (dark text), which is correct in both modes and never needs to
     change. */
  body.day-mode{
    --ink-2:#EDE7D6;
    --ink-3:#DFD8C0;
    --line:#B8AF92;
    --text-on-ink:#1E1B0F;
    --text-dim:#4A4530;
    --chrome:#F7F3E8;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;}
  body{
    background:var(--chrome);
    color:var(--text-on-ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    -webkit-tap-highlight-color:transparent;
  }
  .app{max-width:1400px;margin:0 auto;height:100vh;display:flex;flex-direction:column;overflow:hidden;}

  /* HEADER / BOARD MASTHEAD */
  header.board{
    padding:22px 20px 16px;
    border-bottom:1px solid var(--line);
    display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;
    flex:none;background:var(--chrome);
  }
  .brand{display:flex;align-items:baseline;gap:12px;}
  .brand .flap{
    font-family:'Archivo Narrow',sans-serif;
    font-weight:800;
    font-size:28px;
    letter-spacing:0.04em;
    text-transform:uppercase;
    color:var(--text-on-ink);
  }
  .brand .flap span{color:var(--amber);}
  .brand .sub{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--text-dim);
    letter-spacing:0.08em;
    text-transform:uppercase;
  }
  nav.tabs{display:flex;gap:6px;flex-wrap:wrap;}
  nav.tabs button{
    font-family:'Archivo Narrow',sans-serif;
    font-weight:700;
    font-size:13px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    background:transparent;
    border:1px solid var(--line);
    color:var(--text-dim);
    padding:9px 16px;
    border-radius:6px;
    cursor:pointer;
    transition:all .15s ease;
  }
  nav.tabs button:hover{color:var(--text-on-ink);border-color:var(--text-dim);}
  nav.tabs button.active{background:var(--amber);color:var(--ink);border-color:var(--amber);}
  .nav-badge{
    display:inline-block;background:#D6484E;color:#fff;font-size:10px;font-weight:800;
    border-radius:9px;padding:1px 6px;margin-left:2px;vertical-align:middle;
  }

  /* PROFILE DROPDOWN */
  .header-right{display:flex;align-items:center;gap:14px;}
  .search-btn{
    background:var(--ink-2);border:1px solid var(--line);color:var(--text-on-ink);
    width:38px;height:38px;border-radius:50%;cursor:pointer;font-size:15px;flex:none;
  }
  .search-btn:hover{border-color:var(--text-dim);}
  .search-result{display:flex;align-items:center;gap:10px;padding:11px 4px;border-bottom:1px dashed #cfc7ac;cursor:pointer;}
  .search-result:last-child{border-bottom:none;}
  .search-result:hover{background:#e3dcc6;}
  .search-result .dot{width:10px;height:10px;border-radius:50%;flex:none;}
  .search-result .title{font-weight:700;font-size:14px;}
  .search-result .meta{font-size:11.5px;color:#6b6650;font-family:'IBM Plex Mono',monospace;}
  .filter-chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
  .filter-chip{
    display:flex;align-items:center;gap:6px;
    background:var(--ink-2);border:1px solid var(--line);color:var(--text-on-ink);
    padding:6px 12px;border-radius:16px;font-size:12.5px;font-weight:600;cursor:pointer;
  }
  .filter-chip .dot{width:9px;height:9px;border-radius:50%;flex:none;}
  .filter-chip-off{opacity:.4;}
  .filter-chip-off .dot{filter:grayscale(1);}

  /* MONTH VIEW */
  .month-grid{background:var(--ink-2);border:1px solid var(--line);border-radius:10px;overflow:hidden;}
  .month-week{display:grid;grid-template-columns:repeat(7,1fr);}
  .month-header{background:var(--ink-2);}
  .month-daylabel{
    padding:8px 4px;text-align:center;
    font-family:'Archivo Narrow',sans-serif;font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.03em;
    color:var(--text-dim);border-bottom:1px solid var(--line);
  }
  .month-cell{
    min-height:74px;padding:6px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);
    cursor:pointer;position:relative;
  }
  .month-cell:hover{background:var(--ink-3);}
  .month-week .month-cell:last-child{border-right:none;}
  .month-cell-out{opacity:.35;}
  .month-cell-today{background:rgba(232,163,61,.15);}
  .month-daynum{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--text-on-ink);margin-bottom:6px;}
  .month-dots{display:flex;flex-wrap:wrap;gap:3px;}
  .month-dot{width:7px;height:7px;border-radius:50%;flex:none;}
  .month-more{font-size:9px;color:var(--text-dim);font-family:'IBM Plex Mono',monospace;}
  .month-ticks{position:absolute;bottom:5px;right:6px;display:flex;gap:4px;align-items:center;}
  .month-task-tick{font-size:10px;color:var(--amber);}
  .month-trip-tick{font-size:9px;}
  @media(max-width:640px){
    .month-cell{min-height:52px;padding:4px;}
    .month-daynum{font-size:10.5px;margin-bottom:3px;}
  }

  .profile-wrap{position:relative;}
  .profile-btn{
    display:flex;align-items:center;gap:8px;
    background:var(--ink-2);border:1px solid var(--line);color:var(--text-on-ink);
    padding:7px 12px 7px 7px;border-radius:24px;cursor:pointer;
  }
  .profile-avatar{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-family:'Archivo Narrow',sans-serif;font-weight:800;font-size:12px;color:#151726;flex:none;}
  .profile-btn .pname{font-family:'Archivo Narrow',sans-serif;font-weight:700;font-size:13px;letter-spacing:.02em;text-transform:uppercase;}
  .profile-btn .caret{font-size:10px;color:var(--text-dim);}
  .profile-menu{
    position:absolute;top:calc(100% + 8px);right:0;min-width:190px;
    background:var(--paper);color:var(--ink);border-radius:10px;
    box-shadow:0 10px 30px rgba(0,0,0,.45);overflow:hidden;z-index:40;
  }
  .profile-item{display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;font-size:13.5px;font-weight:600;color:var(--ink);}
  .profile-item:hover{background:#e3dcc6;}
  .profile-item.current{background:#e3dcc6;}
  .profile-item .dot{width:20px;height:20px;border-radius:50%;flex:none;}
  .profile-menu-footer{border-top:1px solid #cfc7ac;padding:10px 14px;font-size:12px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:#5c5847;cursor:pointer;}
  .profile-menu-footer:hover{background:#e3dcc6;}
  .profile-none{padding:12px 14px;font-size:12.5px;color:#6b6650;}

  /* ONBOARDING */
  .onboard-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .onboard-card{background:var(--paper);color:var(--ink);border-radius:16px;padding:32px;max-width:420px;width:100%;}
  .onboard-brand{text-align:center;margin-bottom:22px;}
  .onboard-brand .flap{font-family:'Archivo Narrow',sans-serif;font-weight:800;font-size:26px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink);}
  .onboard-brand .flap span{color:#B8791F;}
  .onboard-brand .sub{font-family:'IBM Plex Mono',monospace;font-size:11px;color:#6b6650;letter-spacing:.08em;text-transform:uppercase;margin-top:2px;}
  .onboard-card h2{font-family:'Archivo Narrow',sans-serif;font-size:19px;text-transform:uppercase;letter-spacing:.02em;text-align:center;margin:0 0 6px;}
  .onboard-card .lead{font-size:13px;color:#5c5847;text-align:center;margin:0 0 20px;}
  .onboard-divider{display:flex;align-items:center;gap:10px;margin:18px 0 14px;color:#8a8468;font-size:11px;text-transform:uppercase;letter-spacing:.05em;}
  .onboard-divider::before,.onboard-divider::after{content:'';flex:1;height:1px;background:#cfc7ac;}

  /* PRE-LOGIN DASHBOARD */
  .dash-wrap{max-width:640px;margin:40px auto;padding:0 20px;text-align:center;}
  .dash-wrap h1{font-family:'Archivo Narrow',sans-serif;font-size:26px;text-transform:uppercase;letter-spacing:.02em;margin:0 0 6px;}
  .dash-wrap .dash-sub{color:var(--text-dim);font-size:14px;margin-bottom:32px;}
  .dash-stats{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-bottom:32px;}
  .dash-stat{background:var(--ink-2);border:1px solid var(--line);border-radius:12px;padding:20px 26px;min-width:130px;}
  .dash-stat .num{font-family:'IBM Plex Mono',monospace;font-size:30px;font-weight:600;color:var(--amber);}
  .dash-stat .label{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-dim);margin-top:4px;}
  .dash-cta{background:var(--amber);color:var(--ink);border:none;font-family:'Archivo Narrow',sans-serif;font-weight:800;letter-spacing:.03em;text-transform:uppercase;padding:14px 28px;border-radius:30px;font-size:14px;cursor:pointer;}

  main{padding:18px 20px 60px;flex:1;overflow-y:auto;}

  /* DAY SELECTOR */
  .week-nav{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap;}
  .week-nav .arrow{
    background:var(--ink-2);border:1px solid var(--line);color:var(--text-on-ink);
    width:34px;height:34px;border-radius:8px;cursor:pointer;font-size:15px;
  }
  .week-nav .label{font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--text-dim);letter-spacing:.03em;}
  .week-nav .today-btn{
    font-family:'Archivo Narrow',sans-serif;font-weight:700;font-size:12px;letter-spacing:.05em;text-transform:uppercase;
    background:transparent;border:1px solid var(--line);color:var(--text-dim);padding:7px 12px;border-radius:6px;cursor:pointer;
  }
  .day-row{display:flex;gap:4px;margin-bottom:18px;overflow-x:auto;padding-bottom:4px;}
  .day-pill{
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;font-weight:600;
    background:var(--ink-2);
    border:1px solid var(--line);
    color:var(--text-dim);
    padding:9px 16px;border-radius:8px;cursor:pointer;white-space:nowrap;
    display:flex;flex-direction:column;align-items:center;gap:2px;
    min-width:64px;
  }
  .day-pill .dname{font-family:'Archivo Narrow',sans-serif;font-weight:700;font-size:14px;letter-spacing:.04em;text-transform:uppercase;}
  .day-pill .dnum{font-size:11px;opacity:.75;}
  .day-pill.today{border-color:var(--amber);}
  .day-pill.active{background:var(--amber);color:var(--ink);border-color:var(--amber);}
  .day-pill.today .dname::after{content:" •";color:var(--amber);}
  .day-pill.active.today .dname::after{color:var(--ink);}
  .skip-note{font-size:12px;color:#6b6650;background:#e3dcc6;border-radius:7px;padding:8px 10px;margin:-4px 0 14px;}

  /* BOARD GRID */
  .board-wrap{display:flex;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--ink-2);}
  .time-axis{width:56px;flex:none;border-right:1px solid var(--line);}
  .time-axis .tick{
    position:absolute;left:0;right:0;
    font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--text-dim);
    padding-left:6px;transform:translateY(-6px);
  }
  .columns{display:flex;flex:1;overflow-x:auto;}
  .col{flex:1;min-width:150px;position:relative;border-right:1px solid var(--line);}
  .col:last-child{border-right:none;}
  .col-head{
    padding:10px 8px;border-bottom:1px solid var(--line);
    position:sticky;top:0;background:var(--ink-2);z-index:2;
    display:flex;align-items:center;gap:7px;
  }
  .swatch{width:10px;height:10px;border-radius:50%;flex:none;}
  .col-head .name{font-family:'Archivo Narrow',sans-serif;font-weight:700;font-size:14px;letter-spacing:.03em;text-transform:uppercase;}
  .col-body{position:relative;cursor:crosshair;}
  .gridline{position:absolute;left:0;right:0;border-top:1px solid var(--line);opacity:.55;}
  .gridline.hour{opacity:.9;}
  .nowline{position:absolute;left:0;right:0;height:2px;background:var(--amber);z-index:3;}
  .nowline::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--amber);}

  .block{
    position:absolute;
    border-radius:6px;padding:6px 8px;overflow:hidden;
    cursor:pointer;border:1px solid rgba(0,0,0,.25);
    box-shadow:0 2px 6px rgba(0,0,0,.25);
    z-index:1;
  }
  .block .t{font-weight:700;font-size:12.5px;line-height:1.2;color:#151726;}
  .block .m{font-family:'IBM Plex Mono',monospace;font-size:10px;color:#151726;opacity:.75;margin-top:2px;}
  .block.transit{
    background:repeating-linear-gradient(135deg, var(--transit), var(--transit) 6px, #6f6a5c 6px, #6f6a5c 12px);
    color:#fff;border-color:#5c5748;
  }
  .block.transit .t,.block.transit .m{color:#fff;}
  .block.conflict{
    border:2px solid #D6484E;
    box-shadow:0 0 0 1px #D6484E, 0 2px 6px rgba(0,0,0,.3);
    z-index:2;
  }
  .block-moved{
    border:2px dashed var(--amber);
  }
  .task-block{border:1.5px dashed rgba(0,0,0,.35);}
  .trip-block{border:1.5px dotted rgba(0,0,0,.35);}

  /* FAB */
  .undo-toast{
    position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:60;
    background:var(--chrome);color:var(--text-on-ink);border:1px solid var(--line);
    border-radius:10px;padding:12px 14px;display:flex;align-items:center;gap:14px;
    box-shadow:0 8px 24px rgba(0,0,0,.5);font-size:13.5px;max-width:90vw;
  }
  .undo-toast button{
    font-family:'Archivo Narrow',sans-serif;font-weight:800;letter-spacing:.03em;text-transform:uppercase;
    background:var(--amber);color:var(--ink);border:none;padding:7px 14px;border-radius:6px;font-size:12px;cursor:pointer;
  }
  .undo-toast-x{background:transparent !important;color:var(--text-dim) !important;padding:4px 6px !important;font-size:14px !important;}
  .fab{
    position:fixed;right:22px;bottom:22px;z-index:20;
    background:var(--amber);color:var(--ink);border:none;
    font-family:'Archivo Narrow',sans-serif;font-weight:800;letter-spacing:.04em;text-transform:uppercase;
    padding:14px 22px;border-radius:30px;font-size:14px;cursor:pointer;
    box-shadow:0 6px 20px rgba(0,0,0,.4);
  }
  .fab.fab-secondary{
    bottom:78px;
    background:var(--ink-2);color:var(--text-on-ink);border:1px solid var(--line);
  }

  /* MODAL */
  .overlay{position:fixed;inset:0;background:rgba(10,11,18,.72);display:flex;align-items:center;justify-content:center;z-index:30;padding:16px;}
  .modal{background:var(--paper);color:var(--ink);width:100%;max-width:440px;border-radius:14px;padding:22px;max-height:88vh;overflow-y:auto;}
  .modal h2{font-family:'Archivo Narrow',sans-serif;font-size:20px;letter-spacing:.02em;margin:0 0 14px;text-transform:uppercase;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#5c5847;margin-bottom:5px;}
  .field input[type=text],.field input[type=time],.field input[type=number],.field select{
    width:100%;padding:10px 11px;border-radius:7px;border:1px solid #c9c2ab;background:#fff;
    font-family:'Inter',sans-serif;font-size:14px;color:var(--ink);
  }
  .row2{display:flex;gap:10px;}
  .row2 > *{flex:1;}
  .checkline{display:flex;align-items:center;gap:9px;margin:6px 0 14px;}
  .checkline input{width:18px;height:18px;}
  .checkline label{font-size:13.5px;font-weight:600;}
  .modal-actions{display:flex;justify-content:space-between;align-items:center;margin-top:18px;}
  .btn{
    font-family:'Archivo Narrow',sans-serif;font-weight:700;letter-spacing:.03em;text-transform:uppercase;
    border:none;border-radius:8px;padding:11px 18px;font-size:13.5px;cursor:pointer;
  }
  .btn.primary{background:var(--ink);color:var(--paper);}
  .btn.ghost{background:transparent;color:#8a5a3a;border:1px solid #8a5a3a;}
  .btn.danger{background:transparent;color:#a5323a;font-size:12px;padding:8px 12px;}

  /* KID VIEW */
  .kid-select{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;}
  .kid-select button{
    font-family:'Archivo Narrow',sans-serif;font-weight:700;font-size:15px;letter-spacing:.02em;text-transform:uppercase;
    border:2px solid var(--line);background:var(--ink-2);color:var(--text-dim);padding:12px 20px;border-radius:10px;cursor:pointer;
  }
  .kid-select button.active{color:var(--ink);}
  .kid-big{background:var(--paper);color:var(--ink);border-radius:16px;padding:26px;}
  .kid-big h2{font-family:'Archivo Narrow',sans-serif;font-size:26px;letter-spacing:.02em;margin:0 0 4px;text-transform:uppercase;}
  .kid-big .kd{font-family:'IBM Plex Mono',monospace;color:#6b6650;margin-bottom:20px;}
  .kid-item{display:flex;gap:16px;padding:16px 0;border-bottom:1px dashed #cfc7ac;align-items:flex-start;}
  .kid-item:last-child{border-bottom:none;}
  .kid-time{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:16px;min-width:100px;color:#5c5847;}
  .kid-title{font-weight:700;font-size:20px;}
  .kid-loc{color:#6b6650;font-size:14px;margin-top:2px;}
  .kid-empty{padding:30px 0;text-align:center;color:#8a8468;font-size:15px;}

  /* CHORES */
  .chore-group{background:var(--paper);color:var(--ink);border-radius:14px;padding:18px 20px;margin-bottom:16px;}
  .chore-group-head{display:flex;align-items:center;gap:9px;margin-bottom:12px;}
  .chore-group-head .swatch{width:12px;height:12px;border-radius:50%;flex:none;}
  .chore-group-head .name{font-family:'Archivo Narrow',sans-serif;font-weight:700;font-size:15px;text-transform:uppercase;letter-spacing:.02em;}
  .chore-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px dashed #cfc7ac;}
  .chore-row:last-child{border-bottom:none;}
  .chore-info{flex:1;cursor:pointer;}
  .chore-title{font-weight:700;font-size:14.5px;}
  .chore-freq{font-size:11px;color:#8a8468;font-family:'IBM Plex Mono',monospace;margin-top:2px;}
  .chore-done-badge{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:#3d7a4f;background:#dcecdf;border-radius:20px;padding:6px 12px;cursor:pointer;white-space:nowrap;}
  .chore-pending-btn{font-family:'Archivo Narrow',sans-serif;font-weight:700;font-size:12px;letter-spacing:.03em;text-transform:uppercase;background:var(--ink);color:var(--paper);border:none;border-radius:20px;padding:9px 16px;cursor:pointer;white-space:nowrap;}
  .chore-locked-btn{font-size:11.5px;color:#8a8468;white-space:nowrap;}
  .chore-empty-day{text-align:center;color:var(--text-dim);padding:40px 0;font-size:14px;}
  .shop-row{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px dashed #cfc7ac;}
  .shop-row:last-child{border-bottom:none;}
  .shop-check-label{display:flex;align-items:center;gap:12px;font-size:15px;font-weight:600;cursor:pointer;flex:1;}
  .shop-check-label input{width:19px;height:19px;flex:none;}
  .shop-row-checked .shop-check-label span{text-decoration:line-through;color:#8a8468;font-weight:400;}
  .shop-row-selected{background:rgba(232,163,61,.15);border-radius:6px;padding-left:6px;margin-left:-6px;}
  .shop-select-check{width:19px;height:19px;accent-color:var(--amber);flex:none;}
  .shop-remove{background:none;border:none;color:#a5323a;cursor:pointer;font-size:16px;padding:4px 8px;}
  .shop-divider{font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:#8a8468;padding:14px 0 6px;border-top:1px solid #cfc7ac;margin-top:6px;}

<script>
// ==============================================================================
// No database URLs or keys live here anymore — on purpose. The browser only
// ever talks to its own domain's /api/family-data and /api/chore-log, which
// are Azure Functions deployed alongside this file. Those Functions hold the
// real Supabase/Cosmos DB credentials as server-only settings (never sent to
// the browser). "View Source" on this page reveals nothing about the database.
// See azure-backend/README.md for how those Functions are configured.
// ==============================================================================
const API_BASE = ''; // '' = same origin (normal case, since the API is hosted alongside this file)
const FAMILY_ENDPOINT = API_BASE + '/api/family-data';
const CHORE_LOG_ENDPOINT = API_BASE + '/api/chore-log';
const TRIP_ENDPOINT = API_BASE + '/api/shopping-trip';
const DEVICE_USAGE_ENDPOINT = API_BASE + '/api/device-usage';
const DEVICE_LIST_ENDPOINT = API_BASE + '/api/device-list';
const DEVICE_DEREGISTER_ENDPOINT = API_BASE + '/api/device-deregister';
const JOIN_FAMILY_ENDPOINT = API_BASE + '/api/join-family';

// ---- portable storage layer -------------------------------------------------
// Two modes, auto-detected:
//  1) Inside a Claude artifact: window.storage exists -> use it (per-Claude-account storage).
//  2) Everywhere else: talk to this domain's own /api/family-data (backed by
//     whatever database the deployed Function is configured for). If that API
//     isn't reachable (e.g. testing this file locally with no backend deployed
//     yet), everything gracefully falls back to the browser's own localStorage
//     instead of failing outright.
//     IMPORTANT LIMITATION of the localStorage fallback: it does NOT sync
//     across devices/browsers — each device keeps its own separate copy.
let backendReachable = null; // null = unknown yet, true/false once we've tried

const hasClaudeStorage = (typeof window !== 'undefined') && window.storage && typeof window.storage.get === 'function';
const STORAGE_MODE_LABEL = () => hasClaudeStorage ? 'claude' : (backendReachable ? 'cloud' : (backendReachable===false ? 'local' : 'checking'));

const LOCAL_FAMILY_ID_KEY = 'trackline-family-id'; // small pointer kept locally even in cloud mode, so this browser knows which family record to fetch

async function storageGet(key){
  if(hasClaudeStorage){
    try{ return await window.storage.get(key); } catch(e){ return null; }
  }
  if(key==='trackline-data'){
    const familyId = window.localStorage.getItem(LOCAL_FAMILY_ID_KEY);
    if(familyId){
      try{
        const res = await fetch(`${FAMILY_ENDPOINT}?familyId=${encodeURIComponent(familyId)}`);
        if(res.ok){
          backendReachable = true;
          const data = await res.json();
          if(data) return {key, value: JSON.stringify(data)};
          return null; // backend reachable, but this family genuinely doesn't exist there
        }
      } catch(e){ backendReachable = false; console.error('Backend not reachable, using local copy for now', e); }
    }
  }
  try{
    const v = window.localStorage.getItem(key);
    return v!==null ? {key, value:v} : null;
  } catch(e){ return null; }
}
async function storageSet(key, value){
  if(hasClaudeStorage){
    try{ return await window.storage.set(key, value); } catch(e){ return null; }
  }
  // Always write locally first, so nothing is ever lost even if the network/backend is down.
  try{ window.localStorage.setItem(key, value); } catch(e){}

  if(key==='trackline-data'){
    try{
      const parsed = JSON.parse(value);
      const familyId = (parsed.family && parsed.family.id) || window.localStorage.getItem(LOCAL_FAMILY_ID_KEY);
      if(familyId){
        window.localStorage.setItem(LOCAL_FAMILY_ID_KEY, familyId);
        // choreLogs and shoppingTrips are stored/synced separately (their own
        // tables) to avoid rewriting the whole family record every time one
        // task gets checked off or one shopping trip's items change.
        const { choreLogs, shoppingTrips, ...rest } = parsed;
        const res = await fetch(FAMILY_ENDPOINT, {
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify({familyId, data: rest})
        });
        backendReachable = res.ok;
      }
    } catch(e){ backendReachable = false; console.error('Backend sync failed, saved locally only for now', e); }
  }
  return {key, value};
}

// Looks up a family's data by ID directly, bypassing this browser's local
// pointer — used only by the "join an existing family" flow, where a new
// device doesn't have that pointer set yet.
async function fetchFamilyById(familyId){
  if(hasClaudeStorage) return null; // Claude storage is already account-scoped; joining by ID doesn't apply here
  try{
    const res = await fetch(`${FAMILY_ENDPOINT}?familyId=${encodeURIComponent(familyId)}`);
    if(!res.ok) return null;
    return await res.json();
  } catch(e){ console.error('Lookup failed, check network/deployment', e); return null; }
}

// Chore completion logs live in their own table server-side (they grow every
// day, unlike everything else which stays roughly constant in size), synced
// through these two dedicated calls instead of the big family blob.
async function pushChoreLog(logEntry){
  if(hasClaudeStorage) return; // Claude mode keeps everything in the one blob, no separate log table there
  try{
    await fetch(CHORE_LOG_ENDPOINT, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(logEntry)
    });
  } catch(e){ console.error('Chore log sync failed (saved locally, will still show on this device)', e); }
}
async function deleteChoreLog(familyId, choreId, date){
  if(hasClaudeStorage) return;
  try{
    await fetch(`${CHORE_LOG_ENDPOINT}?familyId=${encodeURIComponent(familyId)}&choreId=${encodeURIComponent(choreId)}&date=${encodeURIComponent(date)}`, {
      method:'DELETE'
    });
  } catch(e){ console.error('Chore log delete sync failed', e); }
}

// Shopping trips also live in their own table (they accumulate the same way
// chore logs do — every trip is a new row, forever). Each trip is saved as
// one whole object (including its items array), same shape as saving a
// family record, just scoped to a single trip instead of everything.
async function pushTrip(trip){
  if(hasClaudeStorage) return;
  try{
    await fetch(TRIP_ENDPOINT, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({familyId: state.family.id, trip})
    });
  } catch(e){ console.error('Trip sync failed (saved locally, will still show on this device)', e); }
}
async function deleteTripRemote(tripId){
  if(hasClaudeStorage) return;
  try{
    await fetch(`${TRIP_ENDPOINT}?familyId=${encodeURIComponent(state.family.id)}&tripId=${encodeURIComponent(tripId)}`, {
      method:'DELETE'
    });
  } catch(e){ console.error('Trip delete sync failed', e); }
}

function simpleHash(str){
  // Basic non-cryptographic hash — this is a lightweight device PIN lock for a shared
  // family tablet, not encryption-grade security. Good enough to stop casual tampering.
  let h = 5381;
  for(let i=0;i<str.length;i++){ h = ((h*33) ^ str.charCodeAt(i)) >>> 0; }
  return h.toString(16);
}

function cid(){ return 'e' + Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4); }

function genFamilyId(){
  // Short, typeable code — this is both the database row id AND the code
  // shared with family members so their own devices can join. Excludes
  // easily-confused characters (0/O, 1/I/L) since a human has to type this.
  const alphabet = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
  let s = '';
  for(let i=0;i<8;i++){ s += alphabet[Math.floor(Math.random()*alphabet.length)]; }
  return s;
}

function pad2(n){ return n<10 ? '0'+n : ''+n; }
function minToLabel(m){
  let h = Math.floor(m/60), mm = m%60;
  const ap = h>=12?'PM':'AM';
  let h12 = h%12; if(h12===0) h12=12;
  return h12+':'+pad2(mm)+' '+ap;
}
function minToShort(m){
  let h = Math.floor(m/60), mm = m%60;
  return pad2(h)+':'+pad2(mm);
}
function timeInputToMin(v){ // "HH:MM"
  if(!v) return null;
  const [h,m] = v.split(':').map(Number);
  return h*60+m;
}
function minToTimeInput(m){
  return pad2(Math.floor(m/60))+':'+pad2(m%60);
}

// ---- date helpers (all dates handled as local, ISO 'YYYY-MM-DD' strings) ----
function toISODate(d){
  return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
}
function fromISODate(s){
  const [y,m,d] = s.split('-').map(Number);
  return new Date(y, m-1, d);
}
function addDays(dateOrISO, n){
  const d = typeof dateOrISO === 'string' ? fromISODate(dateOrISO) : new Date(dateOrISO);
  d.setDate(d.getDate()+n);
  return d;
}
function mondayOf(dateOrISO){
  const d = typeof dateOrISO === 'string' ? fromISODate(dateOrISO) : new Date(dateOrISO);
  const jsDow = d.getDay(); // 0=Sun
  const offset = jsDow===0 ? -6 : 1-jsDow;
  return addDays(d, offset);
}
function dowMonIndexed(dateOrISO){
  const d = typeof dateOrISO === 'string' ? fromISODate(dateOrISO) : new Date(dateOrISO);
  const j = d.getDay();
  return j===0 ? 6 : j-1;
}
function todayISO(){ return toISODate(new Date()); }
function formatDateNice(iso){
  const d = fromISODate(iso);
  return d.toLocaleDateString(undefined, {month:'short', day:'numeric'});
}
// Returns the ISO date of the next occurrence of a given weekday (0=Mon..6=Sun)
// on or after todayISO() + minDaysAhead days. Used to build example/demo data
// that always feels current and upcoming, regardless of what day it's viewed —
// never a stale hardcoded date, never something that's already in the past.
function nextWeekdayFrom(weekdayIndex, minDaysAhead){
  let d = addDays(todayISO(), minDaysAhead||0);
  let guard = 0;
  while(dowMonIndexed(toISODate(d)) !== weekdayIndex && guard<8){
    d = addDays(d, 1);
    guard++;
  }
  return toISODate(d);
}

// Demo Screen Time data for the example family — the example family is
// purely local/client-side (never actually synced to a real backend), so
// this is served directly instead of hitting the network. Deliberately
// includes BOTH a healthy device (Mia, still syncing today) and one that's
// gone quiet (Leo, nothing for the last 2 days) — so someone browsing the
// demo sees the gap-detection warning naturally, not just a clean happy
// path that never shows what that feature actually looks like.
function buildDefaultDeviceUsage(){
  const now = Date.now();
  const usage = [];

  const miaMinutesByDaysAgo = {0:130, 1:175, 2:210, 3:98, 4:145};
  Object.keys(miaMinutesByDaysAgo).forEach(daysAgoStr=>{
    const daysAgo = parseInt(daysAgoStr,10);
    const date = toISODate(addDays(todayISO(), -daysAgo));
    usage.push({ memberId:'kid1', deviceName:'DESKTOP-MIA', date, minutesUsed: miaMinutesByDaysAgo[daysAgo] });
  });

  // Leo — had usage 4/3/2 days ago, then nothing — simulating the agent going quiet
  const leoMinutesByDaysAgo = {2:190, 3:120, 4:160};
  Object.keys(leoMinutesByDaysAgo).forEach(daysAgoStr=>{
    const daysAgo = parseInt(daysAgoStr,10);
    const date = toISODate(addDays(todayISO(), -daysAgo));
    usage.push({ memberId:'kid2', deviceName:'DESKTOP-LEO', date, minutesUsed: leoMinutesByDaysAgo[daysAgo] });
  });

  const devices = [
    { id:'demo-dev-mia', memberId:'kid1', hostname:'DESKTOP-MIA', label:"Mia's Laptop", lastSyncAt: new Date(now - 12*60000).toISOString() },
    { id:'demo-dev-leo', memberId:'kid2', hostname:'DESKTOP-LEO', label:"Leo's Laptop", lastSyncAt: new Date(now - (2*24*60 + 15)*60000).toISOString() },
  ];

  return { usage, devices };
}

async function loadData(){
  try{
    const r = await storageGet('trackline-data');
    if(r && r.value){
      const parsed = JSON.parse(r.value);
      if(parsed.members && parsed.events){
        // migrate old events (no recurrence field) to weekly recurrence
        parsed.events.forEach(e=>{
          if(!e.recurrence) e.recurrence = 'weekly';
          if(!('date' in e)) e.date = null;
          if(!e.skipDates) e.skipDates = [];
        });
        parsed.members.forEach(m=>{
          if(!('pinHash' in m)) m.pinHash = null;
          if(!('canAddTasks' in m)) m.canAddTasks = true;
          if(!('canAddShopping' in m)) m.canAddShopping = true;
          if(!('email' in m)) m.email = '';
          if(!('phone' in m)) m.phone = '';
        });
        // anyone with data saved before family setup existed gets a default family wrapper
        // so they aren't unexpectedly dropped back into onboarding
        if(!parsed.family){
          parsed.family = {id:cid(), name:'My Family', primaryHolderName:'', primaryHolderEmail:'', primaryHolderPhone:''};
        }
        if(!parsed.chores) parsed.chores = [];
        parsed.chores.forEach(c=>{
          if(!('anchorDate' in c)) c.anchorDate = null;
          if(!('startDate' in c)) c.startDate = null; // null = unrestricted, preserves behavior for tasks that existed before this field
          if(!('dueDate' in c)) c.dueDate = null;
          if(!('dueTime' in c)) c.dueTime = null;
          if(!('points' in c)) c.points = 0;
        });
        if(!parsed.choreLogs) parsed.choreLogs = [];
        if(!parsed.choreLibrary){
          const fromExisting = [...new Set(parsed.chores.map(c=>c.title))];
          parsed.choreLibrary = fromExisting.length ? fromExisting : [];
        }
        if(!parsed.shoppingList) parsed.shoppingList = [];
        if(!parsed.shoppingTrips) parsed.shoppingTrips = [];
        if(!parsed.shoppingItemLibrary) parsed.shoppingItemLibrary = [];
        if(!parsed.activityLibrary) parsed.activityLibrary = [];
        parsed.events.forEach(e=>{ if(!('notes' in e)) e.notes = ''; });
        parsed.events.forEach(e=>{ if(!('occurrenceOverrides' in e)) e.occurrenceOverrides = []; });
        state = parsed;
      }
    }
  }catch(e){ /* no saved data yet — fresh install, onboarding will show */ }
  ui.loaded = true;
  if(!ui.kidId){
    const firstKid = state.members.find(m=>m.role==='kid');
    ui.kidId = firstKid ? firstKid.id : null;
  }
  render();
}
async function saveData(){

}

function memberById(id){ return state.members.find(m=>m.id===id); }

function eventsForDate(dateISO){
  const dow = dowMonIndexed(dateISO);
  const weekly = state.events.filter(e=> e.recurrence==='weekly' && e.day===dow && !(e.skipDates||[]).includes(dateISO));
  const once = state.events.filter(e=> e.recurrence==='once' && e.date===dateISO);
  // occurrences that were rescheduled TO this date from elsewhere in the series
  const movedIn = [];
  state.events.forEach(e=>{
    (e.occurrenceOverrides||[]).forEach(o=>{
      if(o.newDate===dateISO){
        movedIn.push(Object.assign({}, e, {
          start: o.newStart, end: o.newEnd,
          _movedOccurrence: true, _originalDate: o.originalDate, _overrideId: o.id
        }));
      }
    });
  });
  return weekly.concat(once).concat(movedIn);
}
function eventsForDateMember(dateISO, memberId){
  return eventsForDate(dateISO).filter(e=>e.memberId===memberId);
}
function transitBlocksForDateDriver(dateISO, driverId){
  const blocks = [];
  eventsForDate(dateISO).filter(e=>e.needsDrive && e.driverId===driverId).forEach(e=>{
    const t = e.travelMin||0;
    if(t>0){
      blocks.push({kind:'transit', label:'Drive: '+e.title+' (there)', start:e.start-t, end:e.start, sourceId:e.id});
      blocks.push({kind:'transit', label:'Drive: '+e.title+' (back)', start:e.end, end:e.end+t, sourceId:e.id});
    }
  });
  return blocks;
}

// ---- chores (recurring checklist items, separate from time-blocked activities) ----
function choreDue(chore, dateISO){
  if(!chore.active) return false;
  if(chore.pendingApproval) return false; // waits for a parent to approve before it's a real, active task
  // Never show a task as due before it actually started existing — prevents
  // a newly-created weekly/daily task from retroactively appearing on past dates.
  if(chore.startDate && dateISO < chore.startDate) return false;
  if(chore.frequency==='daily') return true;
  if(chore.frequency==='weekly') return (chore.days||[]).includes(dowMonIndexed(dateISO));
  if(chore.frequency==='fortnightly'){
    if(!(chore.days||[]).includes(dowMonIndexed(dateISO))) return false;
    const anchorMonday = mondayOf(chore.startDate || chore.anchorDate || dateISO);
    const thisMonday = mondayOf(dateISO);
    const weeksDiff = Math.round((thisMonday.getTime() - anchorMonday.getTime()) / (7*24*60*60*1000));
    return ((weeksDiff % 2) + 2) % 2 === 0; // works for negative diffs too
  }
  if(chore.frequency==='monthly'){
    const d = fromISODate(dateISO);
    const daysInMonth = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
    const targetDay = Math.min(chore.dayOfMonth||1, daysInMonth);
    return d.getDate() === targetDay;
  }
  if(chore.frequency==='once') return chore.dueDate === dateISO;
  return false;
}
function choresForDate(dateISO){
  return state.chores.filter(c=> choreDue(c, dateISO));
}
function choresForDateMember(dateISO, memberId){
  return choresForDate(dateISO).filter(c=>c.memberId===memberId);
}
function choreLogFor(choreId, dateISO){
  return state.choreLogs.find(l=>l.choreId===choreId && l.date===dateISO) || null;
}
function canMarkChoreDone(chore){

  return isParentLoggedIn() || currentMember().id === chore.memberId;
}
function totalPointsForMember(memberId){
  let total = 0;
  (state.choreLogs||[]).forEach(log=>{
    const chore = state.chores.find(c=>c.id===log.choreId);
    if(chore && chore.memberId===memberId) total += (chore.points||0);
  });
  return total;
}

function frequencyLabel(chore){
  let base = '';
  if(chore.frequency==='daily') base = 'Daily';
  else if(chore.frequency==='monthly') base = 'Monthly (day '+(chore.dayOfMonth||1)+')';
  else if(chore.frequency==='weekly'){
    base = (!chore.days || chore.days.length===0) ? 'Weekly' : chore.days.slice().sort().map(d=>DAYS[d]).join('/');
  }
  else if(chore.frequency==='fortnightly'){
    const dayPart = (!chore.days || chore.days.length===0) ? '' : ' ('+chore.days.slice().sort().map(d=>DAYS[d]).join('/')+')';
    base = 'Fortnightly'+dayPart;
  }
  else if(chore.frequency==='once'){
    base = chore.dueDate ? 'Once — '+formatDateNice(chore.dueDate) : 'Just once';
  }
  if(chore.dueTime) base += ' · by ' + minToLabel(timeInputToMin(chore.dueTime));
  return base;
}

function clampRange(s,e){
  return [Math.max(s,DAY_START), Math.min(e,DAY_END)];
}

function renderTimeAxis(){
  let ticks = '';
  for(let m=DAY_START; m<=DAY_END; m+=60){
    const top = (m-DAY_START)*PX_PER_MIN;
    ticks += `<div class="tick" style="top:${top}px">${minToLabel(m).replace(':00','')}</div>`;
  }
  // The invisible header spacer below MUST match .col-head exactly (same
  // class, same markup shape) — every day column has a real header row
  // (avatar + name) that pushes its grid content down; without a matching
  // spacer here, the time labels start higher than the actual grid,
  // making every block and the now-line appear to sit lower than the
  // time it's actually at.
  return `<div class="time-axis">
    <div class="col-head" style="visibility:hidden;"><span class="swatch"></span><span class="name">&nbsp;</span></div>
    <div class="time-axis-ticks" style="position:relative;height:${RANGE*PX_PER_MIN}px;">${ticks}</div>
  </div>`;
}

function renderGridlines(){
  let lines = '';
  for(let m=DAY_START; m<=DAY_END; m+=30){
    const top=(m-DAY_START)*PX_PER_MIN;
    const isHour = m%60===0;
    lines += `<div class="gridline ${isHour?'hour':''}" style="top:${top}px"></div>`;
  }
  return lines;
}

function renderNowLine(dateISO){
  if(dateISO !== todayISO()) return '';
  const now = new Date();
  const mins = now.getHours()*60+now.getMinutes();
  if(mins<DAY_START || mins>DAY_END) return '';
  const top=(mins-DAY_START)*PX_PER_MIN;
  return `<div class="nowline" style="top:${top}px"></div>`;
}

function renderMonthGrid(){
  const cursor = fromISODate(ui.monthCursor);
  const year = cursor.getFullYear(), month = cursor.getMonth();
  const firstOfMonth = new Date(year, month, 1);
  const lastOfMonth = new Date(year, month+1, 0);
  const gridStart = mondayOf(toISODate(firstOfMonth));
  const gridEndSunday = addDays(mondayOf(toISODate(lastOfMonth)), 6);
  const totalDays = Math.round((gridEndSunday.getTime()-gridStart.getTime())/(24*60*60*1000)) + 1;

  const weeks = [];
  let cursorDate = gridStart;
  for(let w=0; w<totalDays/7; w++){
    const week = [];
    for(let d=0; d<7; d++){
      week.push(toISODate(cursorDate));
      cursorDate = addDays(cursorDate, 1);
    }
    weeks.push(week);
  }

  const dayHeaderRow = DAYS.map(d=>`<div class="month-daylabel">${d}</div>`).join('');

  const weekRows = weeks.map(week=>{
    const cells = week.map(dateISO=>{
      const d = fromISODate(dateISO);
      const inMonth = d.getMonth()===month;
      const isToday = dateISO===todayISO();
      const dayEvents = eventsForDate(dateISO);
      const seen = new Set();
      const memberDots = [];
      dayEvents.forEach(e=>{
        if(seen.has(e.memberId)) return;
        seen.add(e.memberId);
        const m = memberById(e.memberId);
        if(m) memberDots.push(m.color);
      });
      const dotsHtml = memberDots.slice(0,4).map(c=>`<span class="month-dot" style="background:${c}"></span>`).join('')
        + (memberDots.length>4 ? `<span class="month-more">+${memberDots.length-4}</span>` : '');
      const hasTasks = choresForDate(dateISO).length>0;
      const hasTrips = (state.shoppingTrips||[]).some(t=>t.date===dateISO && !t.pendingApproval);
      return `<div class="month-cell ${inMonth?'':'month-cell-out'} ${isToday?'month-cell-today':''}" onclick="jumpToDayFromMonth('${dateISO}')">
        <div class="month-daynum">${d.getDate()}</div>
        <div class="month-dots">${dotsHtml}</div>
        <div class="month-ticks">
          ${hasTasks? '<span class="month-task-tick" title="Tasks due">✓</span>' : ''}
          ${hasTrips? '<span class="month-trip-tick" title="Shopping trip">🛒</span>' : ''}
        </div>
      </div>`;
    }).join('');
    return `<div class="month-week">${cells}</div>`;
  }).join('');

  return `<div class="month-grid"><div class="month-week month-header">${dayHeaderRow}</div>${weekRows}</div>`;
}

function renderWeekNav(){
  const wkEnd = addDays(ui.weekStart,6);

function renderDayRow(){
  const pills = DAYS.map((d,i)=>{
    const dateISO = toISODate(addDays(ui.weekStart,i));
    const cls = ['day-pill'];
    if(i===ui.selectedOffset) cls.push('active');

    return `<div class="${cls.join(' ')}" onclick="setDay(${i})">

  }).join('');
  return `<div class="day-row">${pills}</div>`;
}

function layoutItems(items){
  // items: [{start,end,...}] -> assigns _col (0-based lane) and _cols (total lanes needed)
  // classic calendar-style greedy column packing, plus a real overlap flag per item
  const sorted = items.slice().sort((a,b)=> a.start-b.start || a.end-b.end);
  const colEndTimes = [];
  sorted.forEach(it=>{
    let placed = -1;
    for(let i=0;i<colEndTimes.length;i++){
      if(colEndTimes[i] <= it.start){ placed = i; break; }
    }
    if(placed === -1){ placed = colEndTimes.length; colEndTimes.push(it.end); }
    else { colEndTimes[placed] = it.end; }
    it._col = placed;
  });
  const totalCols = colEndTimes.length;
  sorted.forEach(it=>{
    it._cols = totalCols;
    it._conflict = items.some(o => o!==it && o.start < it.end && it.start < o.end);
  });
  return sorted;
}

function renderBoard(){
  if(ui.boardViewMode==='month'){
    return `
      ${renderBoardViewToggle()}
      ${renderMonthNav()}
      ${renderMonthGrid()}
    `;
  }

  const dateISO = selectedDateISO();
  const hidden = ui.hiddenBoardMembers || [];
  const visibleMembers = state.members.filter(m => !hidden.includes(m.id));

  const filterChips = state.members.length>1 ? `
    <div class="filter-chips">
      ${state.members.map(m=>{
        const isHidden = hidden.includes(m.id);
        return `<button class="filter-chip ${isHidden?'filter-chip-off':''}" onclick="toggleBoardMemberFilter('${m.id}')">
          <span class="dot" style="background:${m.color}"></span>${escapeHtml(m.name)}
        </button>`;
      }).join('')}
    </div>` : '';

  const cols = visibleMembers.map(m=>{
    const realItems = eventsForDateMember(dateISO, m.id).map(e=>({
      kind:'event', id:e.id, title:e.title, start:e.start, end:e.end,
      location:e.location, recurrence:e.recurrence, color:e.color||m.color,
      moved: !!e._movedOccurrence
    }));
    const transitItems = transitBlocksForDateDriver(dateISO, m.id).map(t=>({
      kind:'transit', id:t.sourceId+'_'+t.start, sourceId:t.sourceId, label:t.label, start:t.start, end:t.end
    }));
    // tasks with a due time show on the calendar too, not just the Tasks tab —
    // given a fixed short visual duration since tasks don't have a real end time
    const taskItems = choresForDateMember(dateISO, m.id)
      .filter(c => c.dueTime)
      .map(c => {
        const startMin = timeInputToMin(c.dueTime);
        return { kind:'task', id:c.id, title:c.title, start:startMin, end:startMin+20, color: m.color };
      });
    // shopping trips with a time set show here too, same reasoning
    const tripItemsForBoard = (state.shoppingTrips||[])
      .filter(t => t.memberId===m.id && t.date===dateISO && t.time && !t.pendingApproval)
      .map(t => {
        const startMin = timeInputToMin(t.time);
        return { kind:'trip', id:t.id, title:t.name, start:startMin, end:startMin+45, color: m.color };
      });
    const laidOut = layoutItems(realItems.concat(transitItems).concat(taskItems).concat(tripItemsForBoard));

    const blocks = laidOut.map(it=>{
      const [s,en] = clampRange(it.start,it.end);
      if(en<=s) return '';
      const top=(s-DAY_START)*PX_PER_MIN;
      const h=Math.max((en-s)*PX_PER_MIN, it.kind==='transit'?18:22);
      const widthPct = 100/it._cols;
      const leftPct = it._col*widthPct;
      const gutter = it._cols>1 ? 3 : 4;
      const posStyle = `top:${top}px;height:${h}px;left:calc(${leftPct}% + ${gutter}px);width:calc(${widthPct}% - ${gutter*2}px);`;

      if(it.kind==='transit'){
        const cls = it._conflict ? 'block transit conflict' : 'block transit';
        return `<div class="${cls}" style="${posStyle}" onclick="openEdit('${it.sourceId}','${dateISO}')">
          <div class="t">${it._conflict?'⚠ ':''}🚗 ${escapeHtml(it.label)}</div>
          <div class="m">${minToShort(it.start)}–${minToShort(it.end)}</div>
        </div>`;
      }
      if(it.kind==='task'){
        const cls = it._conflict ? 'block task-block conflict' : 'block task-block';
        return `<div class="${cls}" style="${posStyle}background:${it.color};" onclick="openChoreEdit('${it.id}')">
          <div class="t">${it._conflict?'⚠ ':''}✓ ${escapeHtml(it.title)}</div>
          <div class="m">${minToShort(it.start)}</div>
        </div>`;
      }
      if(it.kind==='trip'){
        const cls = it._conflict ? 'block trip-block conflict' : 'block trip-block';
        return `<div class="${cls}" style="${posStyle}background:${it.color};" onclick="jumpToTripFromElsewhere('${it.id}')">
          <div class="t">${it._conflict?'⚠ ':''}🛒 ${escapeHtml(it.title)}</div>
          <div class="m">${minToShort(it.start)}</div>
        </div>`;
      }
      const badge = it.moved ? ' <span style="opacity:.8">·moved</span>' : (it.recurrence==='weekly' ? '' : ' <span style="opacity:.7">·once</span>');
      const cls = it._conflict ? 'block conflict' : (it.moved ? 'block block-moved' : 'block');
      const bg = `background:${it.color};`;
      return `<div class="${cls}" style="${posStyle}${bg}" onclick="openEdit('${it.id}','${dateISO}')">
        <div class="t">${it._conflict?'⚠ ':''}${escapeHtml(it.title)}${badge}</div>
        <div class="m">${minToShort(it.start)}–${minToShort(it.end)}${it.location? ' · '+escapeHtml(it.location):''}</div>
      </div>`;
    }).join('');

    const isMe = m.id===ui.profileId;
    return `<div class="col">
      <div class="col-head" style="${isMe?'background:'+m.color+'22;':''}"><span class="swatch" style="background:${m.color}"></span><span class="name">${escapeHtml(m.name)}${isMe?' <span style="opacity:.6">· you</span>':''}</span></div>
      <div class="col-body" style="height:${RANGE*PX_PER_MIN}px" data-member="${m.id}" onclick="colClick(event,'${m.id}')">
        ${renderGridlines()}
        ${renderNowLine(dateISO)}
        ${blocks}
      </div>
    </div>`;
  }).join('');

  return `
    ${renderBoardViewToggle()}
    ${renderWeekNav()}
    ${renderDayRow()}
    ${filterChips}
    <div class="board-wrap">
      ${renderTimeAxis()}
      <div class="columns">${cols || '<div style="padding:40px;text-align:center;color:var(--text-dim);">All family members are hidden — tap a name above to show their column.</div>'}</div>
    </div>
    <button class="fab fab-secondary" onclick="openChoreAdd()">+ Add task</button>
    <button class="fab" onclick="openAdd(null)">+ Add activity</button>
  `;
}

function renderTripDetail(tripId){
  const trip = (state.shoppingTrips||[]).find(t=>t.id===tripId);
  if(!trip){
    return `<button class="btn ghost" onclick="setShoppingMode('trips')">← Back to trips</button><div class="chore-empty-day">Trip not found.</div>`;
  }
  const member = memberById(trip.memberId);
  const items = trip.items||[];
  const canEditMeta = isParentLoggedIn();
  const canEditItems = isLoggedIn(); // collaborative — anyone logged in can update item status/add items, since whoever's actually at the store needs to be able to update it

  const statusLabel = {pending:'Pending', bought:'Bought', unavailable:'Unavailable'};
  const statusClass = {pending:'', bought:'trip-item-bought', unavailable:'trip-item-unavailable'};

  const itemRows = items.map(it=>`
    <div class="trip-item-row ${statusClass[it.status]||''}">
      <div class="trip-item-name">${escapeHtml(it.name)}</div>
      <button class="trip-item-status-btn" ${canEditItems?'':'disabled'} onclick="cycleTripItemStatus('${trip.id}','${it.id}')">${statusLabel[it.status]||'Pending'}</button>
      ${canEditMeta?`<button class="trip-item-remove" onclick="removeTripItem('${trip.id}','${it.id}')" title="Remove">✕</button>`:''}
    </div>`).join('');

  const librarySuggestions = [];
  (state.shoppingItemLibrary||[]).forEach((name, idx) => {
    if(librarySuggestions.length<10 && !items.some(it=>it.name.toLowerCase()===name.toLowerCase())){
      librarySuggestions.push({name, idx});
    }
  });
  const quickAddChips = librarySuggestions.map(s=>`<button class="quick-add-chip" onclick="addTripItemFromLibrary('${trip.id}', ${s.idx})">${escapeHtml(s.name)}</button>`).join('');

  return `
    <button class="btn ghost" style="margin-bottom:14px;" onclick="setShoppingMode('trips')">← Back to trips</button>
    <div class="kid-big">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;">
        <div>
          <h2>${escapeHtml(trip.name)}${trip.status==='completed'?' <span class="trip-done-badge">Done</span>':''}${trip.pendingApproval?' <span class="trip-pending-badge">Pending approval</span>':''}</h2>
          <div class="kd">${formatDateNice(trip.date)}${trip.time? ' · '+minToLabel(timeInputToMin(trip.time)):''} · ${member?escapeHtml(member.name):'Unassigned'}${trip.choreId?' · linked to a task':''}</div>
        </div>
        ${canEditMeta? `<button class="btn ghost" style="flex:none;" onclick="openTripEditModal('${trip.id}')">Edit</button>` : ''}
      </div>
      ${items.length===0? '<div class="kid-empty">No items yet — add some below.</div>' : itemRows}
      <div class="shop-add-bar" style="margin-top:16px;">
        <input type="text" id="newTripItem" list="shoppingItemLibraryList" placeholder="Add an item..." onkeydown="if(event.key==='Enter') addTripItem('${trip.id}')">
        <button class="btn primary" onclick="addTripItem('${trip.id}')">Add</button>
      </div>
      <datalist id="shoppingItemLibraryList">
        ${(state.shoppingItemLibrary||[]).map(n=>`<option value="${escapeHtml(n)}"></option>`).join('')}
      </datalist>
      ${quickAddChips? `<div class="quick-add-row"><div class="quick-add-label">Frequently bought:</div>${quickAddChips}</div>` : ''}
      <div class="modal-actions" style="margin-top:20px;">
        <div>${canEditMeta? `<button class="btn danger" onclick="deleteTrip('${trip.id}')">Delete trip</button>` : ''}</div>
        <div>${canEditMeta? `<button class="btn primary" onclick="toggleTripComplete('${trip.id}')">${trip.status==='completed'?'Reopen trip':'Mark trip complete'}</button>` : ''}</div>
      </div>
    </div>
  `;
}

function renderTripModal(){

  const today = todayISO();
  const memberOptions = state.members.map(m=>`<option value="${m.id}" ${editingTrip && editingTrip.memberId===m.id?'selected':''}>${escapeHtml(m.name)}</option>`).join('');
  const choreOptions = state.chores.map(c=>`<option value="${c.id}" ${editingTrip && editingTrip.choreId===c.id?'selected':''}>${escapeHtml(c.title)}</option>`).join('');
  const nameVal = editingTrip ? editingTrip.name : '';
  const dateVal = editingTrip ? editingTrip.date : today;

          <label class="trip-quicklist-check">

  return `
  <div class="overlay" onclick="if(event.target===this) closeTripModal()">
    <div class="modal">
      <h2>${isEdit? 'Edit trip' : 'New shopping trip'}</h2>
      <div class="field">
        <label>Trip name</label>
        <input type="text" id="f_trip_name" placeholder="e.g. Coles run" value="${escapeHtml(nameVal)}">
      </div>
      <div class="row2">
        <div class="field">
          <label>Date</label>
          <input type="date" id="f_trip_date" value="${dateVal}" min="${today}">
        </div>
        <div class="field">
          <label>Time (optional)</label>
          <input type="time" id="f_trip_time" value="${timeVal}">
        </div>
      </div>
      <div class="field">
        <label>Who's going</label>
        <select id="f_trip_member">${memberOptions}</select>
      </div>
      <p style="font-size:11.5px;color:#8a8468;margin:-8px 0 14px;">Set a time and this trip shows up on the Week Board calendar too, alongside activities and tasks — not just here.</p>
      <div class="field">
        <label>Link to an existing task (optional)</label>
        <select id="f_trip_chore">

          <button class="btn primary" onclick="saveTrip()">${isEdit?'Save changes':'Create'}</button>
        </div>

}

function renderChores(){
  const dateISO = selectedDateISO();
  const loggedInId = ui.profileId;

  const groups = state.members.map(m=>{
    const due = choresForDateMember(dateISO, m.id);
    if(due.length===0) return '';
    const rows = due.map(c=>{
      const log = choreLogFor(c.id, dateISO);
      const canAct = canMarkChoreDone(c);
      let action;
      if(log){
        action = canAct
          ? `<div class="chore-done-badge" onclick="undoChoreDone('${c.id}','${dateISO}')">✓ Done at ${escapeHtml(log.completedAt)}</div>`
          : `<div class="chore-done-badge" style="cursor:default;">✓ Done at ${escapeHtml(log.completedAt)}</div>`;
      } else {
        action = canAct
          ? `<button class="chore-pending-btn" onclick="openCompleteChore('${c.id}')">Mark done</button>`
          : `<span class="chore-locked-btn">${isLoggedIn()? 'Not yours':'Log in'}</span>`;
      }
      return `<div class="chore-row">
        <div class="chore-info" onclick="openChoreEdit('${c.id}')">
          <div class="chore-title">${escapeHtml(c.title)}</div>
          <div class="chore-freq">${frequencyLabel(c)}</div>
        </div>
        ${action}
      </div>`;
    }).join('');

    return `<div class="chore-group">
      <div class="chore-group-head"><span class="swatch" style="background:${m.color}"></span><span class="name">${escapeHtml(m.name)}</span></div>
      ${rows}
    </div>`;
  }).join('');

  const anyDue = state.members.some(m=>choresForDateMember(dateISO,m.id).length>0);

  return `
    ${renderWeekNav()}
    ${renderDayRow()}
    ${anyDue ? groups : `<div class="chore-empty-day">No tasks due on ${formatDateNice(dateISO)}.</div>`}
    <button class="fab" onclick="openChoreAdd()">+ Add task</button>
  `;
}

function renderParentView(){
  const dateISO = selectedDateISO();

  const tiles = state.members.map(m=>{
    // this person's activities + any transit blocks they're driving, merged and time-sorted
    const scheduleItems = [];
    eventsForDateMember(dateISO, m.id).forEach(e=>{
      scheduleItems.push({ start:e.start, end:e.end, title:e.title, location:e.location, kind:'event' });
    });
    transitBlocksForDateDriver(dateISO, m.id).forEach(t=>{
      scheduleItems.push({ start:t.start, end:t.end, title:t.label, location:'', kind:'transit' });
    });
    scheduleItems.sort((a,b)=>a.start-b.start);

    const scheduleHtml = scheduleItems.length===0
      ? `<div class="tile-empty">Nothing scheduled</div>`
      : scheduleItems.map(it=>`
        <div class="tile-sched-row">
          <span class="tile-sched-time">${minToShort(it.start)}</span>
          <span class="tile-sched-title">${it.kind==='transit'?'🚗 ':''}${escapeHtml(it.title)}${it.location?` · ${escapeHtml(it.location)}`:''}</span>
        </div>`).join('');

    // tasks due today for this person, with a quick-complete button right on the tile
    const dueTasks = m.role==='kid' ? choresForDateMember(dateISO, m.id) : [];
    const doneCount = dueTasks.filter(c=>choreLogFor(c.id, dateISO)).length;
    const pct = dueTasks.length ? Math.round((doneCount/dueTasks.length)*100) : 0;
    const taskRows = dueTasks.map(c=>{
      const log = choreLogFor(c.id, dateISO);
      if(log) return `<div class="tile-task-row tile-task-done">✓ ${escapeHtml(c.title)}</div>`;
      const overdue = c.dueTime && timeInputToMin(c.dueTime) < nowMinutesOfDay();
      return `<div class="tile-task-row ${overdue?'tile-task-overdue':''}" onclick="openCompleteChore('${c.id}')">
        <span>${overdue?'⚠ ':''}${escapeHtml(c.title)}</span>
        <span class="tile-task-mark">Mark done</span>
      </div>`;
    }).join('');
    const tasksSection = m.role==='kid' ? `
      <div class="tile-section">
        <div class="tile-section-head">
          <span>Tasks</span>
          ${dueTasks.length ? `<span class="tile-progress-label">${doneCount}/${dueTasks.length}</span>` : ''}
        </div>
        ${dueTasks.length ? `<div class="tile-progress-bar"><div class="tile-progress-fill" style="width:${pct}%;background:${m.color};"></div></div>` : ''}
        ${dueTasks.length ? taskRows : `<div class="tile-empty">No tasks today</div>`}
      </div>` : '';

    // shopping trips assigned to this person today
    const myTrips = (state.shoppingTrips||[]).filter(t=>t.memberId===m.id && t.date===dateISO && !t.pendingApproval);
    const tripsSection = myTrips.length ? `
      <div class="tile-section">
        <div class="tile-section-head"><span>Shopping</span></div>
        ${myTrips.map(t=>{
          const items = t.items||[];
          const bought = items.filter(i=>i.status==='bought').length;
          return `<div class="tile-sched-row" style="cursor:pointer;" onclick="jumpToTripFromElsewhere('${t.id}')">
            <span class="tile-sched-time">🛒</span>
            <span class="tile-sched-title">${escapeHtml(t.name)} · ${bought}/${items.length} bought</span>
          </div>`;
        }).join('')}
      </div>` : '';

    const needsAttention = dueTasks.some(c=>!choreLogFor(c.id,dateISO) && c.dueTime && timeInputToMin(c.dueTime) < nowMinutesOfDay());

    return `
      <div class="person-tile ${needsAttention?'person-tile-attention':''}" style="border-top-color:${m.color};">
        <div class="tile-header">
          <span class="profile-avatar" style="background:${m.color};width:38px;height:38px;font-size:14px;">${initials(m.name)}</span>
          <div>
            <div class="tile-name">${escapeHtml(m.name)}</div>
            <div class="tile-role">${m.role==='parent'?'Parent':'Kid'}</div>
          </div>
        </div>
        <div class="tile-section">
          <div class="tile-section-head"><span>Today</span></div>
          ${scheduleHtml}
        </div>
        ${tasksSection}
        ${tripsSection}
      </div>`;
  }).join('');

  return `
    ${renderWeekNav()}
    ${renderDayRow()}
    <div class="person-tiles-grid">
      ${tiles}
    </div>
  `;
}

function nowMinutesOfDay(){
  const n = new Date();
  return n.getHours()*60 + n.getMinutes();
}

      plain = kid.name + ' schedule — ' + formatDateNice(dateISO) + '\n' + evs.map(e=>`${minToShort(e.start)}–${minToShort(e.end)}  ${e.title}${e.location? ' ('+e.location+')':''}${e.notes? ' — '+e.notes:''}`).join('\n');
    }

    const dueTasks = choresForDateMember(dateISO, kid.id);

        } else {

          <div class="chore-info" onclick="openChoreEdit('${c.id}')">

      }).join('\n');
      plain += '\n\nTasks:\n' + taskPlain;
    }
  }
  kidPlainText = plain;

  // shopping trips assigned specifically to this kid, for the selected date
  let tripItems = '';

    const kidTrips = (state.shoppingTrips||[]).filter(t=>t.memberId===kid.id && t.date===dateISO);

function renderScreenTimeCard(m){
  const myDevices = (ui.deviceInfoData||[]).filter(d=>d.memberId===m.id);
  const todayByDevice = todayUsageByDevice(m.id);
  const todayTotal = Object.values(todayByDevice).reduce((sum,v)=>sum+v,0);
  const trend = dailyTotalsForMember(m.id, ui.deviceUsageDays);
  const maxDay = Math.max(1, ...trend.map(t=>t.totalMinutes));

  const anyStale = myDevices.some(d=>deviceSyncStatus(d).status==='stale');

  const deviceRows = myDevices.length===0
    ? `<div class="tile-empty">No device paired yet</div>`
    : myDevices.map(d=>{
        const status = deviceSyncStatus(d);
        const todayMins = todayByDevice[d.hostname] || 0;
        const label = d.label || d.hostname || 'Device';
        const extra = (status.status!=='stale' && todayMins>0) ? ` — ${formatMinutesAsHM(todayMins)} today` : '';
        return `<div class="tile-task-row ${status.status==='stale'?'tile-task-overdue':''}" style="cursor:default;">
          <span>${status.status==='stale'?'⚠ ':'✓ '}${escapeHtml(label)}${extra}</span>
          <span class="tile-task-mark" style="${status.status==='stale'?'background:#D6484E;color:#fff;':''}">${escapeHtml(status.label)}</span>
        </div>`;
      }).join('');

  const bars = trend.map(t=>{
    const pct = t.totalMinutes>0 ? Math.max(Math.round((t.totalMinutes / maxDay) * 100), 4) : 0;
    const d = fromISODate(t.date);
    const dayLabel = d.toLocaleDateString(undefined,{weekday:'narrow'});
    return `<div class="screentime-bar-col" title="${formatDateNice(t.date)}: ${formatMinutesAsHM(t.totalMinutes)}">
      <div class="screentime-bar-track"><div class="screentime-bar-fill" style="height:${pct}%;background:${m.color};"></div></div>
      <div class="screentime-bar-label">${dayLabel}</div>
    </div>`;
  }).join('');

  return `
    <div class="person-tile ${anyStale?'person-tile-attention':''}" style="border-top-color:${m.color};">
      <div class="tile-header">
        <span class="profile-avatar" style="background:${m.color};width:38px;height:38px;font-size:14px;">${initials(m.name)}</span>
        <div>
          <div class="tile-name">${escapeHtml(m.name)}</div>
          <div class="tile-role">Today: ${formatMinutesAsHM(todayTotal)}</div>
        </div>
      </div>
      <div class="tile-section">
        <div class="tile-section-head"><span>Devices</span></div>
        ${deviceRows}
      </div>
      <div class="tile-section">
        <div class="tile-section-head"><span>Last ${ui.deviceUsageDays} days</span></div>
        <div class="screentime-bars">${bars}</div>
      </div>
    </div>`;
}

async function fetchDeviceUsage(){
  if(!state.family) return;
  if(state.family.isExample){
    const demo = buildDefaultDeviceUsage();
    ui.deviceUsageData = demo.usage;
    ui.deviceInfoData = demo.devices;
    ui.deviceUsageError = null;
    ui.deviceUsageLoading = false;
    render();
    return;
  }
  if(hasClaudeStorage){
    ui.deviceUsageData = [];
    ui.deviceInfoData = [];
    ui.deviceUsageError = 'Screen time reporting needs the deployed backend — not available while running inside Claude.';
    render();
    return;
  }
  ui.deviceUsageLoading = true;
  ui.deviceUsageError = null;
  render();
  try{
    const res = await fetch(`${DEVICE_USAGE_ENDPOINT}?familyId=${encodeURIComponent(state.family.id)}&days=${ui.deviceUsageDays}`);
    if(!res.ok){
      const err = await res.json().catch(()=>({}));
      ui.deviceUsageError = err.error || 'Could not load screen time data.';
      ui.deviceUsageData = [];
      ui.deviceInfoData = [];
    } else {
      const result = await res.json();
      ui.deviceUsageData = result.usage || [];
      ui.deviceInfoData = result.devices || [];
    }
  } catch(e){
    ui.deviceUsageError = 'Could not reach the server. Check your connection and try again.';
    ui.deviceUsageData = [];
    ui.deviceInfoData = [];
  }
  ui.deviceUsageLoading = false;
  render();
}
function refreshDeviceUsage(){
  ui.deviceUsageData = null;
  fetchDeviceUsage();
}

function deviceUsageForMember(memberId){
  return (ui.deviceUsageData||[]).filter(u=>u.memberId===memberId);
}
const SYNC_STALE_THRESHOLD_MINUTES = 90; // agent syncs every 30 min per design; this allows a couple of missed cycles before flagging

function deviceSyncStatus(device){
  if(!device.lastSyncAt) return { status:'never', label:'Never synced yet' };
  const lastSync = new Date(device.lastSyncAt);
  const minutesAgo = (Date.now() - lastSync.getTime()) / 60000;
  if(minutesAgo > SYNC_STALE_THRESHOLD_MINUTES){
    return { status:'stale', label:`No data since ${formatSyncTimeLabel(lastSync)}`, minutesAgo };
  }
  return { status:'ok', label:`Synced ${minutesAgoLabel(minutesAgo)}`, minutesAgo };
}
function minutesAgoLabel(minutesAgo){
  if(minutesAgo < 1) return 'just now';
  if(minutesAgo < 60) return `${Math.round(minutesAgo)} min ago`;
  return `${Math.round(minutesAgo/60)}h ago`;
}
function formatSyncTimeLabel(dateObj){
  const iso = toISODate(dateObj);
  return `${formatDateNice(iso)}, ${minToLabel(dateObj.getHours()*60 + dateObj.getMinutes())}`;
}

function todayUsageByDevice(memberId){
  const today = todayISO();
  const byDevice = {};
  deviceUsageForMember(memberId).filter(u=>u.date===today).forEach(u=>{
    byDevice[u.deviceName] = (byDevice[u.deviceName]||0) + u.minutesUsed;
  });
  return byDevice;
}
function dailyTotalsForMember(memberId, days){
  const totals = {};
  deviceUsageForMember(memberId).forEach(u=>{ totals[u.date] = (totals[u.date]||0) + u.minutesUsed; });
  const result = [];
  for(let i=days-1;i>=0;i--){
    const d = toISODate(addDays(todayISO(), -i));
    result.push({ date:d, totalMinutes: totals[d]||0 });
  }
  return result;
}
function formatMinutesAsHM(mins){
  if(!mins) return '0m';
  const h = Math.floor(mins/60), m = mins%60;
  if(h===0) return `${m}m`;
  if(m===0) return `${h}h`;
  return `${h}h ${m}m`;
}

async function submitDeviceManagerPassword(){
  const pwd = (document.getElementById('f_devicemgr_password').value||'').trim();
  if(!pwd) return;
  const hash = simpleHash(pwd);
  ui.deviceManagerLoading = true;
  ui.deviceManagerError = null;
  render();
  try{
    const res = await fetch(DEVICE_LIST_ENDPOINT, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ familyId: state.family.id, passwordHash: hash })
    });
    if(!res.ok){
      const err = await res.json().catch(()=>({}));
      ui.deviceManagerError = err.error || 'Could not load devices.';
      ui.deviceManagerLoading = false;
      render();
      return;
    }
    const result = await res.json();
    ui.deviceManagerDevices = result.devices || [];
    ui.deviceManagerPasswordEntered = true;
    ui.deviceManagerPasswordHash = hash;
  } catch(e){
    ui.deviceManagerError = 'Could not reach the server. Check your connection and try again.';
  }
  ui.deviceManagerLoading = false;
  render();
}

function submitLogin(){
  const m = memberById(ui.loginMemberId);
  if(!m) return;

  const attempt = ui.loginAttempts[m.id] || {count:0, lockedUntil:null};
  if(attempt.lockedUntil && Date.now() < attempt.lockedUntil){
    const secondsLeft = Math.ceil((attempt.lockedUntil - Date.now())/1000);
    ui.loginError = `Too many incorrect attempts. Try again in ${secondsLeft}s.`;
    render();
    return;
  }

  const pin = (document.getElementById('pin_input').value||'').trim();

  if(!/^\d{4}$/.test(pin)){
    ui.loginError = 'PIN must be exactly 4 digits.';
    render();
    return;
  }

  if(ui.loginMode==='create'){
    const confirm = (document.getElementById('pin_confirm').value||'').trim();
    if(pin !== confirm){
      ui.loginError = 'PINs don\u2019t match. Try again.';
      render();
      return;
    }
    m.pinHash = simpleHash(pin);
    saveData();
  } else {
    if(simpleHash(pin) !== m.pinHash){
      attempt.count = (attempt.count||0) + 1;
      if(attempt.count >= 5){
        const lockSeconds = Math.min(30 * Math.pow(2, attempt.count-5), 300);
        attempt.lockedUntil = Date.now() + lockSeconds*1000;
        ui.loginError = `Too many incorrect attempts. Locked for ${lockSeconds}s.`;
      } else {
        ui.loginError = `Incorrect PIN. ${5-attempt.count} attempt${5-attempt.count===1?'':'s'} left before a short lockout.`;
      }
      ui.loginAttempts[m.id] = attempt;
      render();
      return;
    }
  }

  // success — reset the attempt counter for this member
  ui.loginAttempts[m.id] = {count:0, lockedUntil:null};

  ui.profileId = m.id;
  ui.authenticated = true;
  ui.loginOpen = false;
  ui.loginError = null;
  if(m.role==='kid'){
    ui.kidId = m.id;
    ui.tab = 'kid'; // kids land on their own day, not the board/parent view
  }
  render();
}

async function submitJoinFamily(){
  const familyId = (document.getElementById('jf_familyId').value||'').trim().toUpperCase();
  const password = document.getElementById('jf_password').value||'';

  if(!familyId || !password){
    ui.joinError = 'Enter both the Family ID and the family password.';
    render();
    return;
  }

  if(hasClaudeStorage){
    ui.joinError = 'Joining another family isn\u2019t applicable while running inside Claude — each Claude account already has its own separate space.';
    render();
    return;
  }

  ui.joinError = null;
  render(); // clear any previous error while the lookup runs

  try{
    const res = await fetch(JOIN_FAMILY_ENDPOINT, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ familyId, passwordHash: simpleHash(password) })
    });
    if(!res.ok){
      const err = await res.json().catch(()=>({}));
      ui.joinError = err.error || 'No family found with that ID. Double-check it and try again.';
      render();
      return;
    }
    const data = await res.json();
    if(!data || !data.family){
      ui.joinError = 'No family found with that ID. Double-check it and try again.';
      render();
      return;
    }

    // success — link this browser to that family and load its data
    window.localStorage.setItem(LOCAL_FAMILY_ID_KEY, familyId);
    state = data;
    ui.joinFamilyMode = false;
    ui.joinError = null;
    render();
  } catch(e){
    ui.joinError = 'Can\u2019t reach the server right now — check your internet connection and try again.';
    render();
  }
}

  if(!m) return;
  ui.loginMemberId = id;
  ui.loginMode = m.pinHash ? 'enter' : 'create';
  const attempt = ui.loginAttempts[id];
  ui.loginError = (attempt && attempt.lockedUntil && Date.now() < attempt.lockedUntil)
    ? `Too many incorrect attempts. Try again in ${Math.ceil((attempt.lockedUntil - Date.now())/1000)}s.`
    : null;
  ui.loginOpen = true;
  ui.profileMenuOpen = false;
  render();
  setTimeout(()=>{ const el=document.getElementById('pin_input'); if(el) el.focus(); }, 0);
}

function colClick(evt, memberId){
  if(evt.target.closest('.block')) return; // clicked an existing block, ignore
  if(!requireAuth()) return;
  const rect = evt.currentTarget.getBoundingClientRect();
  const y = evt.clientY - rect.top;
  let mins = DAY_START + Math.round((y/PX_PER_MIN)/15)*15;
  mins = Math.max(DAY_START, Math.min(mins, DAY_END-30));
  openAdd({memberId, start:mins});
}

function saveEvent(){
  if(ui.editingId && !isParentLoggedIn()) return; // editing existing: parent only
  if(!ui.editingId && !isLoggedIn()) return; // creating new: must be logged in
  const title = document.getElementById('f_title').value.trim() || 'Untitled';
  const memberId = document.getElementById('f_member').value;
  const recurrence = currentRecurMode();
  const start = timeInputToMin(document.getElementById('f_start').value);
  let end = timeInputToMin(document.getElementById('f_end').value);
  const location = document.getElementById('f_location').value.trim();
  const notes = document.getElementById('f_notes').value.trim();
  const needsDrive = document.getElementById('f_needsDrive').checked;
  const driverId = needsDrive? document.getElementById('f_driver').value : null;
  const travelMin = needsDrive? parseInt(document.getElementById('f_travel').value||'0',10) : 0;
  const color = document.getElementById('f_color').value;

  if(end<=start){ end = start+30; }

  let day, date;
  if(recurrence==='weekly'){
    day = parseInt(document.getElementById('f_day').value,10);
    date = null;
  } else {
    date = document.getElementById('f_date').value;
    day = dowMonIndexed(date);
  }

  if(ui.editingId){
    const ev = state.events.find(e=>e.id===ui.editingId);
    Object.assign(ev, {title,memberId,recurrence,day,date,start,end,location,notes,needsDrive,driverId,travelMin,color});
    if(recurrence==='once'){ ev.skipDates = []; }
  } else {
    state.events.push({id:cid(), title,memberId,recurrence,day,date,skipDates:[],start,end,location,notes,needsDrive,driverId,travelMin,color});
  }
  addToActivityLibrary(title);
  saveData();
  closeModal();
}
function deleteEvent(){
  if(!isParentLoggedIn()) return;
  const removed = state.events.find(e=>e.id===ui.editingId);
  state.events = state.events.filter(e=>e.id!==ui.editingId);
  saveData();
  closeModal();
  if(removed){
    showUndoToast(`"${removed.title}" deleted.`, ()=>{
      state.events.push(removed);
      saveData();
      render();
    });
  }
}
function skipOccurrence(){
  if(!isParentLoggedIn()) return;
  const ev = state.events.find(e=>e.id===ui.editingId);
  if(ev && ui.editingOccurrenceDate){
    ev.skipDates = ev.skipDates || [];
    if(!ev.skipDates.includes(ui.editingOccurrenceDate)) ev.skipDates.push(ui.editingOccurrenceDate);
    saveData();
  }
  closeModal();
}

function renderRescheduleModal(){
  if(!ui.rescheduleModalOpen) return '';
  const ev = state.events.find(e=>e.id===ui.editingId);
  if(!ev) return '';
  const originalDate = ui.editingOccurrenceDate;
  return `
  <div class="overlay" onclick="if(event.target===this) closeReschedule()">
    <div class="modal" style="max-width:360px;">
      <h2>Reschedule this occurrence</h2>
      <p style="font-size:13px;color:#5c5847;margin:0 0 16px;">Moves just ${formatDateNice(originalDate)}'s "${escapeHtml(ev.title)}" — the rest of the series is unaffected.</p>
      <div class="field">
        <label>New date</label>
        <input type="date" id="f_resched_date" value="${originalDate}">
      </div>
      <div class="row2">
        <div class="field">
          <label>New start</label>
          <input type="time" id="f_resched_start" value="${minToTimeInput(ev.start)}">
        </div>
        <div class="field">
          <label>New end</label>
          <input type="time" id="f_resched_end" value="${minToTimeInput(ev.end)}">
        </div>
      </div>
      <div class="modal-actions">
        <div></div>
        <div style="display:flex;gap:8px;">
          <button class="btn ghost" onclick="closeReschedule()">Cancel</button>
          <button class="btn primary" onclick="saveReschedule()">Move it</button>
        </div>
      </div>
    </div>
  </div>`;
}
function saveReschedule(){
  if(!isParentLoggedIn()) return;
  const ev = state.events.find(e=>e.id===ui.editingId);
  if(!ev) return;
  const originalDate = ui.editingOccurrenceDate;
  const newDate = document.getElementById('f_resched_date').value || originalDate;
  let newStart = timeInputToMin(document.getElementById('f_resched_start').value);
  let newEnd = timeInputToMin(document.getElementById('f_resched_end').value);
  if(newEnd<=newStart) newEnd = newStart+30;

  ev.skipDates = ev.skipDates || [];
  if(!ev.skipDates.includes(originalDate)) ev.skipDates.push(originalDate);

  ev.occurrenceOverrides = ev.occurrenceOverrides || [];
  ev.occurrenceOverrides.push({id:cid(), originalDate, newDate, newStart, newEnd});

  saveData();
  closeReschedule();
  closeModal();
}
function cancelReschedule(overrideId){
  if(!isParentLoggedIn()) return;
  const ev = state.events.find(e=>e.id===ui.editingId);
  if(!ev) return;
  const override = (ev.occurrenceOverrides||[]).find(o=>o.id===overrideId);
  if(!override) return;
  ev.occurrenceOverrides = (ev.occurrenceOverrides||[]).filter(o=>o.id!==overrideId);
  ev.skipDates = (ev.skipDates||[]).filter(d=>d!==override.originalDate);
  saveData();
  closeModal();
}
